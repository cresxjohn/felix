const HOLIDAY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>`;
const OOO_CACHE = "felix:ooo";
const OOO_VIEW_KEY = "felix:ooo-view";
const OOO_WHO_KEY = "felix:ooo-who";
let ooo = readCache(OOO_CACHE);
let oooError = null;
let oooLoading = false;
// The view and who the card opens on: as Settings says, or the ones picked last.
let oooView = settings.oooView === "last" ? readCache(OOO_VIEW_KEY) || "today" : settings.oooView;
let oooWho = settings.oooWho === "last" ? readCache(OOO_WHO_KEY) || "team" : settings.oooWho;
let oooPick = null; // { from, to } for Pick dates

/**
 * A day as YYYY-MM-DD in this Mac's time zone.
 * @param {number} t
 * @returns {string}
 */
const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

/**
 * The days a view covers.
 * @param {string} view "today", "tomorrow", "upcoming" (two months from tomorrow, unless Settings says otherwise) or "pick".
 * @returns {{ from: string, to: string }}
 */
function oooRange(view) {
  const today = startOfDay(Date.now());
  if (view === "tomorrow") return { from: ymd(today + 86400e3), to: ymd(today + 86400e3) };
  if (view === "upcoming") return { from: ymd(today + 86400e3), to: ymd(today + (1 + settings.oooAhead) * 86400e3) };
  if (view === "pick" && oooPick) return oooPick;
  return { from: ymd(today), to: ymd(today) };
}

/**
 * A day said simply: "Oct 31".
 * @param {string} day YYYY-MM-DD
 * @returns {string}
 */
const dayText = (day) => new Date(`${day}T12:00:00`).toLocaleDateString([], { month: "short", day: "numeric" });

/**
 * When a leave runs, said for the view: "until Oct 31" for a single day's view, else its dates.
 * @param {{ from: string, to: string }} l
 * @param {boolean} single
 * @returns {string}
 */
function leaveDates(l, single) {
  if (l.from === l.to) return single ? "today" : dayText(l.from);
  if (single) return `until ${dayText(l.to)}`;
  return `${dayText(l.from)} to ${dayText(l.to)}`;
}

/**
 * The line under a name: the kind of leave and its note (each unless Settings hides it), the dates, and whether
 * they're out the whole time.
 * @param {{ kind: string, note: string, from: string, to: string, whole: boolean }} l
 * @param {boolean} single Whether the view is one day.
 * @returns {string}
 */
function oooLeaveLine(l, single) {
  const kind = [settings.oooKind ? l.kind : "", settings.oooNote && l.note ? `(${l.note})` : ""].filter(Boolean).join(" ");
  return esc([kind, leaveDates(l, single), !single && l.whole && settings.oooWhole ? "the whole time" : ""].filter(Boolean).join(" · "));
}

/**
 * Draws Team out of office: the Google setup step until it can read, else the view switch, who's out, and how many
 * of your team that is, with Manage team.
 */
function renderOoo() {
  const step = googleStepHtml(oooError);
  if (step) {
    return gateCard("ooo", step, googleProblem(oooError),
      () => withSample(() => [ooo, oooError, oooLoading], ([a, b, c]) => { ooo = a; oooError = b; oooLoading = c; }, SAMPLES.ooo(), renderOoo));
  }
  if (!ooo) return fillCard("ooo", oooError ? `<div class="error">${esc(oooError.message)}</div>` : skeleton(3));
  const views = [["today", "Today"], ["tomorrow", "Tomorrow"], ["upcoming", "Upcoming"], ["pick", "Pick dates"]];
  const seg = `<div class="segmented small" role="group" aria-label="When">${views.map(([v, label]) => `<button type="button" data-ooo-view="${v}" aria-pressed="${oooView === v}">${label}</button>`).join("")}</div>`;
  const range = oooRange(oooView);
  const pick = oooView === "pick"
    ? `<div class="ooo-pick"><input type="date" data-ooo-from value="${range.from}" aria-label="From"><span>to</span><input type="date" data-ooo-to value="${range.to}" aria-label="To"></div>` : "";
  const hasTeam = ooo.teamSize > 0;
  const who = hasTeam
    ? `<div class="segmented small" role="group" aria-label="Who">${[["team", "My team"], ["all", "Everyone"]].map(([v, label]) => `<button type="button" data-ooo-who="${v}" aria-pressed="${oooWho === v}">${label}</button>`).join("")}</div>` : "";
  const single = range.from === range.to;
  // Holidays are a country's or office's ("PH", "US PURE"), so they show for everyone, on their own line.
  const holidays = ooo.out.filter((l) => l.holiday);
  const hol = holidays.length
    ? `<div class="ooo-holiday"><span class="flag" aria-hidden="true">${HOLIDAY_ICON}</span><span><b>Holiday</b><span class="sub">${esc([...new Set(holidays.map((h) => h.name))].join(", "))}${single ? "" : ` · ${esc(leaveDates(holidays[0], single))}`}</span></span></div>` : "";
  const rows = ooo.out.filter((l) => !l.holiday && (!hasTeam || oooWho === "all" || l.onTeam))
    .sort((a, b) => a.from.localeCompare(b.from) || a.name.localeCompare(b.name));
  const list = hol + (rows.length
    ? rows.map((l) => `<div class="person"><span class="face">${esc(l.name.charAt(0).toUpperCase())}</span><span><b>${esc(l.name)}</b>`
      + `<span class="sub">${oooLeaveLine(l, single)}</span></span></div>`).join("")
    : emptyHtml("ooo", hasTeam && oooWho === "team" ? "Nobody on your team is out." : "Nobody is out."));
  const fresh = settings.oooNew && hasTeam && ooo.unknown.length
    ? `<div class="ooo-new">New in the tracker: ${esc(ooo.unknown.slice(0, 3).join(", "))}${ooo.unknown.length > 3 ? ` and ${ooo.unknown.length - 3} more` : ""}. <button class="linkbtn" type="button" data-ooo-manage>Add to your team?</button></div>` : "";
  const teamOut = new Set(ooo.out.filter((l) => l.onTeam).map((l) => l.person)).size;
  const note = hasTeam ? `${teamOut} of ${ooo.teamSize} out` : `<button class="linkbtn" type="button" data-ooo-manage>Pick your team</button>`;
  const err = oooError ? `<div class="error">${esc(oooError.message)} Showing the last list.</div>` : "";
  fillCard("ooo", `${err}<div class="ooo-tools">${seg}${who}</div>${pick}<div class="ooo-list">${list}</div>${fresh}`
    + footHtml(ooo.fetchedAt, oooLoading, `${note}${hasTeam ? ` · <button class="linkbtn" type="button" data-ooo-manage>Manage team</button>` : ""}`));
  $("ooo-body")?.querySelectorAll('input[type="date"]').forEach((el) => window.FelixPickers?.enhance(el));
}

/**
 * Manage team: a checklist of everyone the tracker has named in the past year. Tick who's on your team; search to
 * find someone; Edit a person to rename them or add the other ways the tracker writes their name.
 */
async function openTeamDialog() {
  const dlg = document.createElement("dialog");
  dlg.className = "team-dlg";
  dlg.innerHTML = `<form method="dialog"><div class="team-head"><b>Your team</b>`
    + `<span class="sub">Tick the people on your team. Team out of office shows them first and counts who's out.</span>`
    + `<input class="field team-search" type="search" placeholder="Search people" aria-label="Search people" autocomplete="off"></div>`
    + `<div class="team-list">${skeleton(5)}</div><p class="setup-error" role="alert" hidden></p>`
    + `<div class="team-foot"><span class="team-count"></span><span class="spacer"></span><button class="mini" value="cancel" formnovalidate>Cancel</button><button class="mini primary" value="save" data-team-save>Save</button></div></form>`;
  document.body.append(dlg);
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
  const listEl = dlg.querySelector(".team-list");
  const count = () => { dlg.querySelector(".team-count").textContent = `${people.filter((p) => p.onTeam).length} on your team`; };
  let people = [];
  try {
    people = (await fetchJson("/api/team/roster")).people;
  } catch (e) {
    listEl.innerHTML = `<div class="error">${esc(e.message)}</div>`;
    return;
  }
  const others = (p) => p.nicknames.filter((k) => k.toLowerCase() !== p.name.toLowerCase());
  const rowHtml = (p, i) => `<div class="team-row" data-i="${i}" data-find="${esc([p.name, ...p.nicknames].join(" ").toLowerCase())}">`
    + `<label class="team-pick"><input class="fx-check" type="checkbox" data-k="onTeam"${p.onTeam ? " checked" : ""}><span class="face">${esc(p.name.charAt(0).toUpperCase())}</span>`
    + `<span class="who"><b>${esc(p.name)}</b>${others(p).length ? `<span class="sub">Also ${esc(others(p).join(", "))}</span>` : ""}</span></label>`
    + `<button type="button" class="team-edit" data-team-edit aria-label="Edit ${esc(p.name)}" title="Rename, or add other ways the tracker writes this name">`
    + `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg></button>`
    + `<div class="team-fields" hidden><label class="setup-field"><span>Name</span><input class="field" type="text" data-k="name" value="${esc(p.name)}"></label>`
    + `<label class="setup-field"><span>Also written as</span><input class="field" type="text" data-k="nicknames" value="${esc(others(p).join(", "))}" placeholder="Separate with commas"></label></div></div>`;
  listEl.innerHTML = people.map(rowHtml).join("") || `<p class="sub">The tracker has no names from the past year.</p>`;
  count();
  listEl.addEventListener("change", (e) => {
    const p = people[Number(e.target.closest("[data-i]")?.dataset.i)];
    if (p && e.target.dataset.k === "onTeam") { p.onTeam = e.target.checked; count(); }
  });
  listEl.addEventListener("click", (e) => {
    const edit = e.target.closest("[data-team-edit]");
    if (!edit) return;
    const fields = edit.parentElement.querySelector(".team-fields");
    fields.hidden = !fields.hidden;
    edit.classList.toggle("on", !fields.hidden);
    if (!fields.hidden) fields.querySelector("input").focus();
  });
  dlg.querySelector(".team-search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    for (const row of listEl.querySelectorAll(".team-row")) {
      row.hidden = Boolean(q) && !row.dataset.find.includes(q);
      if (!row.hidden) shown += 1;
    }
    listEl.querySelector(".team-none")?.remove();
    if (!shown) listEl.insertAdjacentHTML("beforeend", `<p class="sub team-none">Nobody called "${esc(e.target.value.trim())}".</p>`);
  });
  dlg.querySelector("[data-team-save]").addEventListener("click", async (ev) => {
    ev.preventDefault();
    for (const row of listEl.querySelectorAll(".team-row")) {
      const p = people[Number(row.dataset.i)];
      const name = row.querySelector('[data-k="name"]').value.trim();
      const more = row.querySelector('[data-k="nicknames"]').value.split(",").map((k) => k.trim()).filter(Boolean);
      // The tracker's own spelling of the old name stays, so renaming someone doesn't lose their leave.
      p.nicknames = [...new Set([...(name && name !== p.name ? [p.name] : []), ...p.nicknames.filter((k) => k.toLowerCase() === p.name.toLowerCase()), ...more])];
      if (name) p.name = name;
    }
    try {
      await window.FelixShell.request("/api/team", { people });
      dlg.close();
      loadOoo(true);
    } catch (e) {
      const err = dlg.querySelector(".setup-error");
      err.textContent = e.message;
      err.hidden = false;
    }
  });
}

// ---------- Tasks ----------
// One task manager for both modes: the Work card holds work tasks, the Personal card personal ones (kept apart by
// scope in data/tasks.db).
const TASK_CARDS = {
  tasks: { scope: "work", setting: "tasksView", hints: [
    "Add a task: Review fm#12247 tomorrow 3pm !high #review",
    "Add a task: Reply to Brian about PMHUB-32049 today",
    "Add a task: Prep the sprint demo Thursday 10am #sprint",
    "Add a task: Update the on-call notes every Monday",
  ] },
  ptasks: { scope: "personal", setting: "ptasksView", hints: [
    "Add a task: Buy a gift for Mom Saturday !high #family",
    "Add a task: Pay the electricity bill Nov 5 #bills",
    "Add a task: Call Lola tonight #family",
    "Add a task: Book the dentist next week #health",
    "Add a task: Water the plants every day #home",
  ] },
};

/**
 * The views a Tasks card offers: Today always, the others as Settings says (Overdue on the Work card only, at first).
 * @param {string} id "tasks" or "ptasks"
 * @returns {string[]}
 */
function taskViews(id) {
  const overdue = settings.tasksOverdue === "both" || (settings.tasksOverdue === "work" && id === "tasks");
  return ["today", settings.tasksUpcoming && "upcoming", overdue && "overdue", settings.tasksSomeday && "someday", settings.tasksDone && "done"].filter(Boolean);
}

/**
 * The view a Tasks card opens on: the one Settings names, or the one picked last; Today when that view is turned off.
 * @param {string} id
 * @returns {string}
 */
function openingView(id) {
  const set = settings[TASK_CARDS[id].setting];
  const view = set === "last" ? readCache(`felix:tasks-view:${TASK_CARDS[id].scope}`) || "today" : set;
  return taskViews(id).includes(view) ? view : "today";
}
const VIEW_LABELS = { today: "Today", upcoming: "Upcoming", overdue: "Overdue", someday: "Someday", done: "Done" };
const PRIORITY_NAMES = ["None", "Low", "Medium", "High"];
const REPEATS = ["", "every day", "every weekday", "every week", "every sprint", "every month"];
/** @type {Record<string, { data: any, view: string, tag: string, project?: string, error: string, loading: boolean }>} */
const taskState = Object.fromEntries(Object.entries(TASK_CARDS).map(([id, c]) => [id, {
  data: readCache(`felix:tasks:${c.scope}`), view: openingView(id), tag: "", error: "", loading: false,
}]));

/**
 * When a task is due, said the short way: its time today, "Overdue", "Tomorrow", a weekday this week, else a date.
 * @param {{ dueDate: string | null, dueTime: string | null, someday: boolean, doneAt: string | null }} t
 * @param {string} today YYYY-MM-DD
 * @returns {{ text: string, late: boolean }}
 */
function dueText(t, today) {
  if (t.doneAt) return { text: "Done", late: false };
  if (t.someday) return { text: "Someday", late: false };
  if (!t.dueDate) return { text: "", late: false };
  const at = new Date(`${t.dueDate}T${t.dueTime || "12:00"}:00`);
  const time = t.dueTime ? at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  if (t.dueDate < today) return { text: "Overdue", late: true };
  if (t.dueDate === today) return { text: time || "Today", late: Boolean(t.dueTime) && at.getTime() < Date.now() };
  const days = Math.round((Date.parse(`${t.dueDate}T12:00:00`) - Date.parse(`${today}T12:00:00`)) / 86400e3);
  if (days === 1) return { text: "Tomorrow", late: false };
  if (days < 7) return { text: at.toLocaleDateString([], { weekday: "short" }), late: false };
  if (days < 14 && at.getDay() === 1) return { text: "Next week", late: false };
  return { text: at.toLocaleDateString([], { month: "short", day: "numeric" }), late: false };
}

/**
 * One task row: tick box, name (a red dot when high priority), its links, the first label, and when it's due.
 * @param {any} t
 * @param {string} today
 * @param {boolean} draggable
 * @returns {string}
 */
function taskRowHtml(t, today, draggable) {
  const due = dueText(t, today);
  const cls = [t.doneAt ? "done" : "", t.priority === 3 && !t.doneAt ? "high" : "", due.late ? "late" : ""].filter(Boolean).join(" ");
  const subs = settings.tasksSubs && t.subtasks?.length ? `<span class="task-subs" title="Subtasks done">${t.subtasks.filter((s) => s.doneAt).length}/${t.subtasks.length}</span>` : "";
  const links = (t.links || []).slice(0, settings.tasksLinks).map((l) => `<a class="task-link" href="${esc(l.url)}" target="_blank" rel="noopener" title="Open ${esc(l.label)}">${esc(l.label)}</a>`).join("");
  // The first label, and "+N" for the rest: hovering shows them all, and any one of them filters the list.
  const more = t.tags?.length > 1;
  const tag = settings.tasksLabels && t.tags?.length
    ? `<span class="task-tags"${more ? ` data-many data-tags="${esc(t.tags.join(","))}"` : ""}><button type="button" class="tag" data-task-tag="${esc(t.tags[0])}" title="Show only #${esc(t.tags[0])}">#${esc(t.tags[0])}</button>`
      + `${more ? `<button type="button" class="tag more" data-tag-more aria-haspopup="menu" aria-label="All labels: ${esc(t.tags.map((x) => `#${x}`).join(", "))}">+${t.tags.length - 1}</button>` : ""}</span>` : "";
  const project = t.project ? `<button type="button" class="task-project" data-task-project="${esc(t.project)}" title="Show only ${esc(t.project)}">${FOLDER_ICON}<span>${esc(t.project)}</span></button>` : "";
  const repeat = settings.tasksRepeat && t.repeat ? `<span class="task-repeat" title="Repeats ${esc(t.repeat)}">↻</span>` : "";
  return `<div class="task ${cls}" data-task="${esc(t.id)}"${draggable && settings.tasksDrag && !t.doneAt ? ` draggable="true"` : ""}>`
    + `<button type="button" class="box" role="checkbox" aria-checked="${Boolean(t.doneAt)}" aria-label="${t.doneAt ? "Mark not done" : "Mark done"}: ${esc(t.title)}" data-task-done></button>`
    + `<button type="button" class="title" data-task-open title="${esc(t.notes ? `${t.title}\n\n${t.notes}` : t.title)}">${esc(t.title)}</button>`
    + `${repeat}${subs}${links}${project}${tag}<span class="due">${esc(due.text)}</span></div>`;
}

const FOLDER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>`;

// The label popover: every label of a task, shown while you hover its labels (or click "+N"). It lives outside the
// card so the card's edge never cuts it off.
let tagPop = null;
let tagPopTimer = 0;

/**
 * Shows a task's labels under its label chips.
 * @param {HTMLElement} group The row's .task-tags.
 */
function showTagPop(group) {
  clearTimeout(tagPopTimer);
  if (tagPop?.group === group) return;
  hideTagPop();
  const id = taskCardOf(group);
  const active = taskState[id]?.tag;
  const pop = document.createElement("div");
  pop.className = "dd-menu tag-pop";
  pop.setAttribute("role", "menu");
  pop.innerHTML = `<div class="tag-pop-head">Show only</div>${group.dataset.tags.split(",").map((t) => `<button type="button" class="dd-item" role="menuitem" data-pop-tag="${esc(t)}"${t === active ? ' aria-selected="true"' : ""}>`
    + `<span class="dd-check">${t === active ? window.FelixDropdown?.ICONS.check || "" : ""}</span>#${esc(t)}</button>`).join("")}`;
  document.body.append(pop);
  const r = group.getBoundingClientRect();
  pop.style.top = `${Math.round(innerHeight - r.bottom > pop.offsetHeight + 8 ? r.bottom + 4 : r.top - pop.offsetHeight - 4)}px`;
  pop.style.left = `${Math.round(Math.max(8, Math.min(r.right - pop.offsetWidth, innerWidth - pop.offsetWidth - 8)))}px`;
  pop.addEventListener("mouseenter", () => clearTimeout(tagPopTimer));
  pop.addEventListener("mouseleave", () => { tagPopTimer = setTimeout(hideTagPop, 180); });
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pop-tag]");
    if (!b || !taskState[id]) return;
    taskState[id].tag = b.dataset.popTag;
    hideTagPop();
    loadTasks(id);
  });
  tagPop = { pop, group };
}

/**
 * Draws a Tasks card. The add box is drawn once and kept, so typing isn't lost when the list redraws.
 * @param {string} id "tasks" or "ptasks"
 */
function renderTasks(id) {
  const body = $(`${id}-body`);
  if (!body) return;
  const card = TASK_CARDS[id];
  const st = taskState[id];
  if (!body.querySelector(".task-add")) {
    body.innerHTML = `<form class="task-add" data-task-add autocomplete="off"><span aria-hidden="true">+</span>`
      + `<input name="text" maxlength="500" placeholder="${esc(card.hints[0])}" aria-label="Add a task. Words like tomorrow 3pm, !high and #label are read."></form>`
      + `<div class="task-tools"></div><div class="task-list"></div><div class="task-foot"></div>`;
  }
  const d = st.data;
  const views = taskViews(id).map((v) => {
    const n = d?.counts?.[v];
    const count = n ? `<span class="n${v === "overdue" ? " bad" : ""}">${n}</span>` : "";
    return `<button type="button" class="chip${st.view === v ? " on" : ""}" data-task-view="${v}" aria-pressed="${st.view === v}">${VIEW_LABELS[v]}${count}</button>`;
  }).join("");
  const filter = (st.tag ? `<button type="button" class="chip on tagged" data-task-tag="" title="Show every label">#${esc(st.tag)} ×</button>` : "")
    + (st.project ? `<button type="button" class="chip on tagged" data-task-project="" title="Show every project">${esc(st.project)} ×</button>` : "");
  body.querySelector(".task-tools").innerHTML = `<div class="chips">${views}${filter}</div>`;
  const list = body.querySelector(".task-list");
  if (!d) list.innerHTML = st.error ? `<div class="error">${esc(st.error)}</div>` : skeleton(4);
  else {
    const empty = { today: "Nothing due today. Add one above.", upcoming: "Nothing coming up.", overdue: "Nothing overdue.", someday: "Nothing set for someday.", done: "Nothing done yet." }[st.view];
    list.innerHTML = (st.error ? `<div class="error">${esc(st.error)}</div>` : "")
      + (d.tasks.length ? d.tasks.map((t) => taskRowHtml(t, d.today, st.view === "today" && !st.tag && !st.project)).join("")
        : emptyHtml(st.tag || st.project ? "search" : st.view, st.tag || st.project ? `No ${st.tag ? `#${esc(st.tag)} ` : ""}tasks${st.project ? ` in ${esc(st.project)}` : ""} here.` : empty));
  }
  // Tasks live on this Mac and don't sync, so the foot just says where they're kept, on the right; no "Updated".
  body.querySelector(".task-foot").innerHTML = d ? `<div class="card-foot"><span></span><span>${card.scope === "personal" ? "Kept apart from work tasks" : "Saved on this Mac"}</span></div>` : "";
}

/**
 * Loads a Tasks card's view.
 * @param {string} id
 */
async function loadTasks(id) {
  const st = taskState[id];
  const { scope } = TASK_CARDS[id];
  st.loading = true;
  renderTasks(id);
  try {
    st.data = await fetchJson(`/api/tasks?${new URLSearchParams({ scope, view: st.view, ...(st.tag ? { tag: st.tag } : {}), ...(st.project ? { project: st.project } : {}) })}`);
    st.error = "";
    if (!st.tag && !st.project) saveCache(`felix:tasks:${scope}`, st.data);
  } catch (e) {
    st.error = e.message;
  } finally {
    st.loading = false;
    renderTasks(id);
  }
}

/**
 * Draws the Felix card: the first check-in waiting (a dated thing you told him about whose day has passed), or why
 * there's none right now.
 * @param {{ checkins?: Array<{ id: string, followUp: string, saidAt: string, quote: string }>, quiet?: boolean, off?: boolean, error?: string }} d
 */
function renderBuddy(d) {
  const body = $("buddy-body");
  if (!body) return;
  const [first] = d.checkins || [];
  if (first) {
    const day = new Date(first.saidAt).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
    const more = d.checkins.length > 1 ? ` · ${d.checkins.length - 1} more after this` : "";
    body.innerHTML = `<div class="checkin"><div class="bubble">${esc(first.followUp)}</div>`
      + `<div class="sub">You told me on ${esc(day)}: “${esc(first.quote)}”${esc(more)}</div>`
      + `<div class="acts"><button class="yes" type="button" data-checkin="${esc(first.id)}" data-text="${esc(first.followUp)}">Tell Felix</button>`
      + `<button type="button" data-checkin-skip="${esc(first.id)}">Not now</button></div></div>`;
    return;
  }
  const why = d.error ? `Couldn't check: ${d.error}` : d.off ? "Friend mode is off in Settings." : d.quiet ? "Quiet hours. Felix won't bring things up until they end."
    : "Nothing to check in on. When you tell Felix about something coming up, he asks how it went once it's passed.";
  body.innerHTML = `<p class="sub">${esc(why)}</p>`;
}

/** The Felix card's next look, on the hour. @type {ReturnType<typeof setTimeout> | undefined} */
let buddyTimer;

/**
 * Loads the Felix card's check-ins.
 * @returns {Promise<void>}
 */
async function loadBuddy() {
  try {
    renderBuddy(await fetchJson("/api/felix/checkins"));
  } catch (e) {
    renderBuddy({ error: e.message });
  }
  // Quiet hours start and end on the hour: the card looks again then, so it follows the clock.
  clearTimeout(buddyTimer);
  const next = new Date();
  next.setHours(next.getHours() + 1, 0, 1, 0);
  buddyTimer = setTimeout(() => { if (settings.mode !== "work") loadBuddy(); }, next - Date.now());
}

/**
 * What you typed for a task's link: a web link, a PR like fm#123 or bm#45, or a Jira ticket like PMHUB-123.
 * @param {string} text
 * @returns {{ kind: string, url: string, label: string } | null}
 */
function linkFor(text) {
  const t = String(text || "").trim();
  const pr = /^(fm|bm)\s*#\s*(\d{1,7})$/i.exec(t);
  if (pr) return { kind: "pr", url: `https://github.com/purepm/${pr[1].toLowerCase() === "fm" ? "frontend" : "backend"}-monorepo/pull/${pr[2]}`, label: `${pr[1].toLowerCase()}#${pr[2]}` };
  const ticket = /^([A-Z][A-Z0-9]{1,9}-\d{1,7})$/i.exec(t);
  if (ticket) return { kind: "jira", url: `https://purepm.atlassian.net/browse/${ticket[1].toUpperCase()}`, label: ticket[1].toUpperCase() };
  try {
    const u = new URL(t);
    return /^https?:$/.test(u.protocol) ? { kind: "url", url: u.href, label: u.hostname.replace(/^www\./, "") } : null;
  } catch { return null; }
}

/**
 * A task's details: name, notes, due day and time, priority, repeat, labels, project, links and subtasks; Save,
 * Delete, or Esc to close.
 * @param {string} cardId
 * @param {string} taskId
 */
function openTaskDialog(cardId, taskId) {
  const task = taskState[cardId].data.tasks.find((t) => t.id === taskId);
  const dlg = document.createElement("dialog");
  dlg.className = "team-dlg task-dlg";
  const opt = (list, value, label = (v) => v) => list.map((v, i) => `<option value="${esc(String(typeof v === "number" ? i : v))}"${String(value) === String(typeof v === "number" ? i : v) ? " selected" : ""}>${esc(label(v, i))}</option>`).join("");
  const repeats = REPEATS.includes(task.repeat || "") ? REPEATS : [...REPEATS, task.repeat];
  dlg.innerHTML = `<form method="dialog" class="form">`
    + `<div class="team-head"><textarea class="task-name" name="title" rows="1" maxlength="500" aria-label="Task name" required>${esc(task.title)}</textarea></div>`
    + `<div class="team-list task-fields">`
    + `<label class="setup-field"><span>Notes</span><textarea class="field" name="notes" rows="3" placeholder="Anything to remember about it">${esc(task.notes)}</textarea></label>`
    + `<div class="task-grid"><div class="setup-field"><span>Due</span><input type="date" name="dueDate" value="${esc(task.dueDate || "")}" aria-label="Due" data-empty="No due day"></div>`
    + `<div class="setup-field"><span>Time</span><input type="time" name="dueTime" value="${esc(task.dueTime || "")}" aria-label="Time"></div>`
    + `<div class="setup-field"><span>Priority</span><select name="priority" aria-label="Priority">${PRIORITY_NAMES.map((n, i) => `<option value="${i}"${task.priority === i ? " selected" : ""}>${n}</option>`).join("")}</select></div>`
    + `<div class="setup-field"><span>Repeat</span><select name="repeat" aria-label="Repeat">${opt(repeats, task.repeat || "", (v) => v ? v.charAt(0).toUpperCase() + v.slice(1) : "Doesn't repeat")}</select></div></div>`
    + `<label class="setup-field"><span>Labels</span><input class="field" name="tags" value="${esc(task.tags.join(", "))}" placeholder="review, sprint"></label>`
    + `<label class="setup-field"><span>Project</span><input class="field" name="project" value="${esc(task.project || "")}" list="task-projects" placeholder="None"><datalist id="task-projects">${(taskState[cardId].data.projects || []).map((p) => `<option value="${esc(p)}">`).join("")}</datalist></label>`
    + `<label class="check-line"><input class="fx-check" type="checkbox" name="someday"${task.someday ? " checked" : ""}> Someday (no due day)</label>`
    + `<div class="setup-field"><span>Links</span><div class="task-links" data-links></div>`
    + `<input class="field" name="newLink" placeholder="Paste a link, fm#123 or PMHUB-123, then press Enter" aria-label="Add a link"></div>`
    + `<div class="setup-field"><span>Subtasks</span><div class="task-subtasks">${task.subtasks.map((s) => `<label class="check-line"><input class="fx-check" type="checkbox" data-sub="${esc(s.id)}"${s.doneAt ? " checked" : ""}> ${esc(s.title)}</label>`).join("")}`
    + `<input class="field" name="newSub" placeholder="Add a subtask and press Enter" maxlength="300"></div></div>`
    + `</div><p class="setup-error" role="alert" hidden></p>`
    + `<div class="team-foot"><button class="mini danger" type="button" data-task-delete>Delete</button><span class="spacer"></span><button class="mini" value="cancel" formnovalidate>Cancel</button><button class="mini primary" value="save" data-task-save>Save</button></div></form>`;
  document.body.append(dlg);
  dlg.addEventListener("close", () => { dlg.remove(); loadTasks(cardId); });
  dlg.showModal();
  const f = dlg.querySelector("form").elements;
  // The name is one line of text that wraps: as tall as it needs, and Enter saves rather than starting a new line.
  const fit = () => { f.title.style.height = "auto"; f.title.style.height = `${f.title.scrollHeight}px`; };
  f.title.addEventListener("input", () => {
    if (/\n/.test(f.title.value)) f.title.value = f.title.value.replace(/\s*\n\s*/g, " ");
    fit();
  });
  f.title.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    dlg.querySelector("[data-task-save]")?.click();
  });
  fit();
  const fail = (err) => { const p = dlg.querySelector(".setup-error"); p.textContent = err.message; p.hidden = false; };
  const path = `/api/tasks/${encodeURIComponent(task.id)}`;
  dlg.querySelectorAll("select").forEach((el) => window.FelixDropdown?.enhance(el));
  dlg.querySelectorAll('input[type="date"], input[type="time"]').forEach((el) => window.FelixPickers?.enhance(el));

  // Links: each one a chip you can remove; paste a link, fm#123 or PMHUB-123 and press Enter to add one.
  let links = task.links.map((l) => ({ ...l }));
  const drawLinks = () => {
    dlg.querySelector("[data-links]").innerHTML = links.map((l, i) => `<span class="link-chip"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
      + `<button type="button" data-unlink="${i}" aria-label="Remove ${esc(l.label)}">×</button></span>`).join("");
  };
  drawLinks();
  dlg.querySelector("[data-links]").addEventListener("click", (e) => {
    const x = e.target.closest("[data-unlink]");
    if (!x) return;
    links.splice(Number(x.dataset.unlink), 1);
    drawLinks();
  });
  f.newLink.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const link = linkFor(f.newLink.value);
    if (!link) return fail(new Error("That isn't a link, a PR like fm#123, or a ticket like PMHUB-123."));
    dlg.querySelector(".setup-error").hidden = true;
    if (!links.some((l) => l.url === link.url)) links.push(link);
    f.newLink.value = "";
    drawLinks();
  });

  dlg.querySelector(".task-subtasks").addEventListener("change", async (e) => {
    const sub = e.target.dataset.sub;
    if (sub) await window.FelixShell.request(`/api/tasks/${encodeURIComponent(sub)}`, { patch: { done: e.target.checked } }).catch(fail);
  });
  f.newSub.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const text = f.newSub.value.trim();
    if (!text) return;
    try {
      const { task: s } = await window.FelixShell.request("/api/tasks", { text, parentId: task.id });
      f.newSub.insertAdjacentHTML("beforebegin", `<label class="check-line"><input type="checkbox" data-sub="${esc(s.id)}"> ${esc(s.title)}</label>`);
      f.newSub.value = "";
    } catch (err) { fail(err); }
  });
  dlg.querySelector("[data-task-delete]").addEventListener("click", async () => {
    const yes = await window.FelixShell.confirm({
      title: `Delete "${task.title}"?`,
      text: task.subtasks.length ? `Its ${task.subtasks.length === 1 ? "subtask goes" : `${task.subtasks.length} subtasks go`} too. This can't be undone.` : "This can't be undone.",
      confirm: "Delete", danger: true,
    });
    if (!yes) return;
    try { await window.FelixShell.request(`${path}/delete`, {}); dlg.close(); } catch (err) { fail(err); }
  });
  dlg.querySelector("[data-task-save]").addEventListener("click", async (e) => {
    e.preventDefault();
    const someday = f.someday.checked;
    const patch = {
      title: f.title.value, notes: f.notes.value, priority: Number(f.priority.value), repeat: f.repeat.value || null,
      tags: f.tags.value.split(",").map((t) => t.trim()).filter(Boolean), project: f.project.value.trim() || null, links,
      ...(someday ? { someday: true } : { someday: false, dueDate: f.dueDate.value || null, dueTime: f.dueTime.value || null }),
    };
    try { await window.FelixShell.request(path, { patch }); dlg.close(); } catch (err) { fail(err); }
  });
}

/**
 * The big "8 to review · 10 mine" numbers, then the counts worth a look, each opening the PR page filtered.
 * @param {Record<string, object[]>} lists Every PR in each tab.
 * @param {object} reviews
 * @returns {string}
 */
function prCountsHtml(lists, reviews) {
  // With one repo picked in Settings, the links open the page filtered to it too.
  const repo = settings.prsRepos === "both" ? "" : `repo=${settings.prsRepos}`;
  const total = (tab, label) => `<a href="/prs/${tab}${repo ? `?${repo}` : ""}"><span class="n">${lists[tab].length}</span><span class="t">${label}</span></a>`;
  const rows = COUNTS.map((c) => ({ ...c, n: lists[c.tab].filter((p) => c.test(p, reviews)).length }))
    .filter((c) => settings[c.setting] === "always" || (settings[c.setting] === "some" && c.n))
    .map((c) => `<a class="count${c.n ? "" : " zero"}" href="/prs/${c.tab}?status=${c.status}${repo ? `&${repo}` : ""}"><span class="dot" style="background:${c.color}"></span>${esc(c.label)}<span class="n">${c.n}</span></a>`);
  return `${settings.prsTotals ? `<div class="totals">${total("review", "to review")}${total("mine", "mine")}</div>` : ""}${rows.join("")}`;
}

/**
 * Draws the Open PRs card from the last list.
 */
function renderPrs() {
  if (!prs?.lists) return fillCard("prs", prError ? `<div class="error">${esc(prError)}</div>` : skeleton(5));
  const lists = Object.fromEntries(["review", "mine"].map((tab) => [tab, prs.lists[tab].filter((r) => prRepoShown(r.key)).flatMap((r) => r.prs)]));
  fillCard("prs", `${prError ? `<div class="error">${esc(prError)} Showing the last list.</div>` : ""}`
    + `${prCountsHtml(lists, prs.reviews || {})}${settings.prsReleases ? releasesHtml() : ""}${footHtml(prs.fetchedAt, prLoading)}`);
}

/**
 * A status pill, a link when it has one.
 * @param {{ cls: string, label: string, url?: string, title?: string } | null} st
 * @returns {string}
 */
function pillHtml(st) {
  if (!st) return "";
  const title = st.title ? ` title="${esc(st.title)}"` : "";
  return st.url
    ? `<a class="pill ${st.cls}" href="${esc(st.url)}" target="_blank" rel="noopener"${title}>${esc(st.label)}</a>`
    : `<span class="pill ${st.cls}"${title}>${esc(st.label)}</span>`;
}

/**
 * Approve and Merge for an open release PR, as it allows.
 * @param {{ url: string, number: number, iApproved: boolean, mergeState: string, inMergeQueue: boolean }} o
 * @returns {string}
 */
function releaseActsHtml(o) {
  if (o.inMergeQueue) return "";
  const clean = o.mergeState === "CLEAN";
  const approve = !o.iApproved && !clean ? `<button class="mini" type="button" data-rel-approve="${esc(o.url)}" title="Approve #${o.number} on GitHub as you">Approve</button>` : "";
  const merge = clean ? `<button class="mini primary" type="button" data-rel-merge="${esc(o.url)}" title="Add #${o.number} to the merge queue. Merging deploys these packages to dev.">Merge</button>` : "";
  return `<span class="acts">${approve}${merge}</span>`;
}

/**
 * One repo's release line: its open release PR with status and actions, or when the last one merged.
 * @param {{ key: string, error?: string, open?: object, last?: object, mine: object[] }} r
 * @returns {string}
 */
function releaseRowHtml(r) {
  const head = `<span class="rk">${esc(r.key)}</span>`;
  if (r.error) return `<div class="relrow">${head}<span class="yours">Couldn't load: ${esc(r.error)}</span></div>`;
  const o = r.open;
  if (!o) {
    const last = r.last ? ` · last <a class="num" href="${esc(r.last.url)}" target="_blank" rel="noopener">#${r.last.number}</a> ${ago(r.last.mergedAt)}` : "";
    return `<div class="relrow">${head}<span class="yours">No open release${last}</span></div>`;
  }
  return `<div class="relrow">${head}<a class="num" href="${esc(o.url)}" target="_blank" rel="noopener" title="${r.mine.length} of your PRs">#${o.number}</a>`
    + `${pillHtml(PrStatus.releaseStatus(o))}${releaseActsHtml(o)}</div>`;
}

/**
 * The Releases section: one line per repo.
 * @returns {string}
 */
function releasesHtml() {
  if (!rel) return relError ? `<div class="rels"><span class="label">Releases</span><span class="sub">Couldn't load releases. ${esc(relError)}</span></div>` : "";
  return `<div class="rels"><div class="head"><span class="label">Releases</span><a href="/prs/releases">Details →</a></div>`
    + `${relActionError ? `<div class="error">${esc(relActionError)}</div>` : ""}${rel.repos.filter((r) => prRepoShown(r.key)).map(releaseRowHtml).join("")}</div>`;
}

/**
 * Loads the release PRs and redraws the card.
 */
async function loadReleases() {
  try {
    rel = await fetchJson("/api/releases");
    relError = null;
  } catch (e) {
    relError = e.message;
  }
  renderPrs();
}

/**
 * Approve or Merge a release PR. They act on GitHub, so the first click only asks; a second click within
 * 4 seconds acts.
 * @param {HTMLButtonElement} button
 * @param {string} path
 * @param {string} ask What the button says while it waits for the second click.
 */
async function releaseAction(button, path, ask) {
  if (!button.classList.contains("confirm")) {
    const original = button.innerHTML;
    button.classList.add("confirm");
    button.textContent = ask;
    setTimeout(() => { if (button.isConnected && !button.disabled) { button.classList.remove("confirm"); button.innerHTML = original; } }, 4000);
    return;
  }
  button.disabled = true;
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: button.dataset.relApprove || button.dataset.relMerge }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `The server answered ${res.status}.`);
    relActionError = null;
  } catch (e) {
    relActionError = `${path.includes("approve") ? "Couldn't approve" : "Couldn't merge"}: ${e.message}`;
  }
  await loadReleases();
}

$("grid").addEventListener("click", (e) => {
  let b;
  if ((b = e.target.closest("[data-rel-approve]"))) return releaseAction(b, "/api/release/approve", "Click again to approve");
  if ((b = e.target.closest("[data-rel-merge]"))) return releaseAction(b, "/api/merge", "Click again to merge");
});

/**
 * Loads the PR list, and the releases unless Settings hides them (then GitHub isn't asked for them).
 */
async function loadPrs() {
  if (settings.prsReleases) loadReleases();
  prLoading = true;
  renderPrs();
  try {
    prs = await fetchJson("/api/prs");
    prError = null;
    saveCache(PR_CACHE, prs);
  } catch (e) {
    prError = e.message;
  } finally {
    prLoading = false;
    renderPrs();
  }
}

// ---------- AI usage ----------
const AI_CACHE = "felix:ai-usage";
let ai = readCache(AI_CACHE);
let aiError = null;
let aiLoading = false;

/**
 * Formats an amount of money, for example $1,234.50.
 * @param {number | null | undefined} amount
 * @param {string} [currency]
 * @returns {string}
 */
const fmtMoney = (amount, currency = "USD") => amount == null ? "—" : amount.toLocaleString([], { style: "currency", currency });

/**
 * Escapes server text and shows its `backticked` commands as code.
 * @param {string} text
 * @returns {string}
 */
const codeText = (text) => esc(text).replace(/`([^`]+)`/g, "<code>$1</code>");

/**
 * One limit: its label and percent used over a bar colored by severity, and when it resets under the bar when the
 * card has room (on hover otherwise).
 * @param {{ label: string, percent: number, severity: string, resetsAt: string | null }} m
 * @param {string | null} [cycleEnd] When the tool's billing cycle ends, for limits that don't say when they reset.
 * @returns {string}
 */
function meterHtml(m, cycleEnd = null) {
  const pct = Math.round(m.percent);
  const at = m.resetsAt || cycleEnd;
  const title = at ? ` title="Resets ${esc(inTime(at))}, ${esc(new Date(at).toLocaleString())}"` : "";
  const line = at ? `<span class="meter-reset roomy">Resets ${esc(inTime(at))} · ${esc(fmtWhen(at))}</span>` : "";
  return `<div class="meter ${esc(m.severity)}"${title}><div class="meter-top"><span>${esc(m.label)}</span><span class="pct">${pct}%</span></div>`
    + `<div class="bar" role="progressbar" aria-label="${esc(m.label)}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100, m.percent)}%"></span></div>${line}</div>`;
}

/**
 * A tool's limit bars, with its billing cycle's end standing in for limits that don't say when they reset.
 * @param {{ limits: Array<object>, cycle?: { end: string } | null }} t
 * @returns {string}
 */
const metersHtml = (t) => t.limits.map((m) => meterHtml(m, t.cycle?.end)).join("");

/**
 * Whether Cursor is signed in and answering, so Claude's limit alert can point to it.
 * @returns {boolean}
 */
const cursorReady = () => Boolean(ai?.tools?.some((t) => t.tool === "cursor" && t.limits && !t.error));

/**
 * Claude's extra usage line: on or off, what it cost this month, and when the monthly count resets.
 * @param {{ enabled: boolean, used: { amount: number, currency: string } | null, limit: { amount: number, currency: string } | null, resetsAt?: string } | null | undefined} x
 * @returns {string}
 */
function claudeExtraHtml(x) {
  if (!x) return "";
  if (!x.enabled) return `<div class="ai-note">Extra usage off</div>`;
  const used = `${fmtMoney(x.used?.amount, x.used?.currency)}${x.limit ? ` of ${fmtMoney(x.limit.amount, x.limit.currency)}` : ""} this month`;
  const reset = x.resetsAt ? `Claude counts extra usage month to date and doesn't say when it resets, so this guesses the 1st: ${fmtDay(x.resetsAt)} (${daysAway(x.resetsAt)}).` : "";
  return `<div class="ai-note" title="${esc(reset)}">Extra usage: ${esc(used)}</div>`;
}

/**
 * The alert a wide card shows when one of Claude's limits is used up: until when, and that Cursor can take over.
 * @param {{ limits: Array<{ label: string, percent: number, resetsAt: string | null }> }} t
 * @returns {string}
 */
function claudeAlertHtml(t) {
  const capped = t.limits.find((m) => m.percent >= 100);
  if (!capped) return "";
  const until = capped.resetsAt ? ` until ${fmtWhen(capped.resetsAt)}` : "";
  return `<div class="ai-alert">At the "${esc(capped.label)}" limit${esc(until)}.${cursorReady() ? " Reviews and fixes can run on Cursor meanwhile." : ""}</div>`;
}

/**
 * Cursor's extra line: on-demand spend, mine and the team pool's.
 * @param {{ onDemand?: { individual: { used: number, limit: number } | null, pool: { used: number, limit: number } | null } | null }} t
 * @returns {string}
 */
function cursorNotes(t) {
  const od = t.onDemand;
  const parts = [
    od?.individual && `on-demand ${fmtMoney(od.individual.used)} of ${fmtMoney(od.individual.limit)}`,
    od?.pool && `team pool ${fmtMoney(od.pool.used)} of ${fmtMoney(od.pool.limit)}`,
  ].filter(Boolean);
  return parts.length ? `<div class="ai-note">${esc(parts.join(" · ").replace(/^./, (c) => c.toUpperCase()))}</div>` : "";
}

/** Each tool's spend line under its bars, on small and wide cards alike. */
const AI_SPEND = { claude: (t) => claudeExtraHtml(t.extra), cursor: cursorNotes };

/** Everything a wide card shows under a tool's bars: Claude's limit alert, then the spend line (unless Settings hides it). */
const AI_NOTES = {
  claude: (t) => `${claudeAlertHtml(t)}${settings.aiSpend ? AI_SPEND.claude(t) : ""}`,
  cursor: (t) => (settings.aiSpend ? AI_SPEND.cursor(t) : ""),
};

/**
 * A limit's colour: amber and red from the levels set in Settings (80% and 100% at first). Claude's own colour stands
 * while Settings lets Claude pick its own.
 * @param {string} tool
 * @param {{ percent: number, severity: string }} m
 * @returns {string}
 */
function aiSeverity(tool, m) {
  if (tool === "claude" && settings.aiOwnColours) return m.severity;
  return m.percent >= settings.aiBadAt ? "critical" : m.percent >= settings.aiWarnAt ? "warning" : "normal";
}

/**
 * The tools the card shows, as Settings says, each limit coloured by aiSeverity.
 * @returns {Array<Record<string, any>>}
 */
const aiTools = () => (ai?.tools || []).filter((t) => settings[t.tool === "cursor" ? "aiCursor" : "aiClaude"])
  .map((t) => (t.limits ? { ...t, limits: t.limits.map((m) => ({ ...m, severity: aiSeverity(t.tool, m) })) } : t));

/**
 * The short line at the card's foot: when the most used limit resets, such as "Claude weekly resets in 2 days".
 * @param {Array<{ name: string, limits?: Array<{ label: string, percent: number, resetsAt: string | null }> }>} tools
 * @returns {string}
 */
function soonestLimitNote(tools) {
  const top = tools.flatMap((t) => (t.limits || []).filter((m) => m.resetsAt).map((m) => ({ ...m, tool: t.name })))
    .sort((a, b) => b.percent - a.percent)[0];
  if (!top) return "";
  return esc(`${top.tool} ${top.label.toLowerCase()} resets ${inTime(top.resetsAt)}`);
}

const SHORT = { "Weekly · all models": "Weekly", "Included usage": "Included", "Auto and Composer": "Auto", "Named models (API)": "API" };

/**
 * A limit's name made short for the overview's small bars: "Session (5 hours)" is "Session", "Weekly · Fable" is
 * "Fable", "Named models (API)" is "API". The details show the full names.
 * @param {string} label
 * @returns {string}
 */
const shortLabel = (label) => SHORT[label] || label.replace(/\s*\(.*\)$/, "").replace(/^Weekly · /, "");

/**
 * The limit closest to running out, which leads a tool's overview.
 * @param {Array<{ percent: number }>} limits
 * @returns {object}
 */
const topLimit = (limits) => [...limits].sort((a, b) => b.percent - a.percent)[0];

/**
 * One tool in the overview: name and plan, its most pressing limit large with when it resets, and a small bar for
 * each of its limits. Hovering it (or focusing it, or tapping it) shows the details.
 * @param {{ tool: string, name: string, plan?: string | null, limits?: Array<object>, cycle?: { end: string } | null, error?: { code: string, message: string } }} t
 * @returns {string}
 */
function aiRowHtml(t) {
  const head = `<div class="ai-row-top"><b>${esc(t.name)}</b><span>${esc(t.plan || "")}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>`;
  if (!t.limits?.length) {
    const why = t.error ? codeText(t.error.message) : "No numbers yet.";
    return `<div class="ai-row" data-ai-row="${esc(t.tool)}" tabindex="0">${head}<div class="ai-note">${why}</div></div>`;
  }
  const top = topLimit(t.limits);
  const at = top.resetsAt || t.cycle?.end;
  const when = at ? `Resets ${esc(inTime(at))}` : "";
  const minis = t.limits.map((m) => `<div class="ai-mini ${esc(m.severity)}"><div class="kvm"><span>${esc(shortLabel(m.label))}</span><b>${Math.round(m.percent)}%</b></div>`
    + `<div class="bar"><span style="width:${Math.min(100, m.percent)}%"></span></div></div>`).join("");
  return `<div class="ai-row" data-ai-row="${esc(t.tool)}" tabindex="0" aria-label="${esc(t.name)} usage: ${esc(top.label)} ${Math.round(top.percent)}%. Shows details.">${head}`
    + `<div class="ai-lead ${esc(top.severity)}"><span class="pct">${Math.round(top.percent)}%</span><span class="what"><b>${esc(top.label)}</b><span>${when}</span></span></div>`
    + `<div class="ai-minis">${minis}</div></div>`;
}

/**
 * A tool's details, shown on hover: every limit with its bar and when it resets, its spend (Claude's extra usage, or
 * Cursor's on-demand and team pool), Claude's alert when a limit is used up, and a link to the tool's usage page.
 * @param {{ tool: string, name: string, url: string, plan?: string | null, limits?: Array<object>, cycle?: { end: string } | null, error?: { code: string, message: string } }} t
 * @returns {string}
 */
function aiDetailHtml(t) {
  const link = `<a class="ai-open" href="${esc(t.url)}" target="_blank" rel="noopener">Usage page<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>`;
  const err = t.error ? `<div class="ai-note">${codeText(t.error.message)}${t.limits ? " Showing the last numbers." : ""}</div>`
    // While a tool limits how often its usage is checked, its last numbers show with their time, not an error.
    : t.limited ? `<div class="ai-note">As of ${esc(fmtWhen(t.fetchedAt))}. ${esc(t.name)} limits how often this is checked.</div>` : "";
  const cycle = t.cycle?.end ? `<div class="ai-note">Billing cycle ends ${esc(fmtWhen(t.cycle.end))}</div>` : "";
  const body = t.limits ? `${metersHtml(t)}${AI_NOTES[t.tool]?.(t) || ""}${cycle}` : "";
  return `<div class="ai-pop-h"><b>${esc(t.name)}</b><span>${esc(t.plan || "")}</span>${link}</div>${err}<div class="ai-pop-b">${body}</div>`;
}

/**
 * Draws the AI usage card from the last answer, or a skeleton while the first one loads: an overview of every tool,
 * with each tool's details on hover.
 */
function renderAi() {
  if (!ai) return fillCard("ai", aiError ? `<div class="error">${esc(aiError)}</div>` : skeleton(4));
  fillCard("ai", `${aiError ? `<div class="error">${esc(aiError)} Showing the last numbers.</div>` : ""}`
    + `<div class="ai-rows">${aiTools().map(aiRowHtml).join("")}</div>`
    + footHtml(ai.fetchedAt, aiLoading, soonestLimitNote(aiTools())));
  if (aiPop.tool) showAiPop(aiPop.tool);
}

// The details popover: one for the page, placed beside the hovered tool and kept inside the window.
const aiPop = { el: null, tool: "", timer: 0 };

/**
 * Shows a tool's details beside its row in the overview.
 * @param {string} tool
 */
function showAiPop(tool) {
  const row = document.querySelector(`[data-ai-row="${tool}"]`);
  const t = aiTools().find((x) => x.tool === tool);
  if (!row || !t) return hideAiPop(true);
  clearTimeout(aiPop.timer);
  if (!aiPop.el) {
    aiPop.el = Object.assign(document.createElement("div"), { className: "ai-pop", role: "dialog" });
    aiPop.el.addEventListener("mouseenter", () => clearTimeout(aiPop.timer));
    aiPop.el.addEventListener("mouseleave", () => hideAiPop());
    document.body.append(aiPop.el);
  }
  aiPop.tool = tool;
  aiPop.el.setAttribute("aria-label", `${t.name} usage`);
  aiPop.el.innerHTML = aiDetailHtml(t);
  document.querySelectorAll("[data-ai-row]").forEach((r) => r.classList.toggle("open", r === row));
  const r = row.getBoundingClientRect();
  const w = aiPop.el.offsetWidth;
  const h = aiPop.el.offsetHeight;
  const left = r.right + 10 + w <= innerWidth - 8 ? r.right + 10 : Math.max(8, r.left - 10 - w);
  const top = Math.max(8, Math.min(r.top - 6, innerHeight - h - 8));
  Object.assign(aiPop.el.style, { left: `${left}px`, top: `${top}px` });
  aiPop.el.classList.add("on");
}

/**
 * Hides the details, a moment later unless the pointer moves onto them.
 * @param {boolean} [now]
 */
function hideAiPop(now = false) {
  clearTimeout(aiPop.timer);
  const go = () => {
    aiPop.tool = "";
    aiPop.el?.classList.remove("on");
    document.querySelectorAll("[data-ai-row].open").forEach((r) => r.classList.remove("open"));
  };
  if (now) go();
  else aiPop.timer = setTimeout(go, 160);
}

$("grid").addEventListener("mouseover", (e) => {
  const row = e.target.closest("[data-ai-row]");
  if (row && row.dataset.aiRow !== aiPop.tool) showAiPop(row.dataset.aiRow);
  else if (row) clearTimeout(aiPop.timer);
});
$("grid").addEventListener("mouseout", (e) => {
  const row = e.target.closest("[data-ai-row]");
  if (row && !row.contains(e.relatedTarget)) hideAiPop();
});
$("grid").addEventListener("focusin", (e) => {
  const row = e.target.closest("[data-ai-row]");
  if (row) showAiPop(row.dataset.aiRow);
});
$("grid").addEventListener("focusout", (e) => { if (e.target.closest("[data-ai-row]")) hideAiPop(); });
$("grid").addEventListener("click", (e) => {
  const row = e.target.closest("[data-ai-row]");
  if (!row) return;
  if (aiPop.tool === row.dataset.aiRow && aiPop.el?.classList.contains("on")) hideAiPop(true);
  else showAiPop(row.dataset.aiRow);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideAiPop(true); });
addEventListener("scroll", () => hideAiPop(true), true);

/**
 * Loads AI usage from the server and keeps a copy in the browser so the card draws at once next time.
 * @param {boolean} [fresh] Ask the tools again instead of the server's cache (2 minutes, unless Settings says otherwise).
 */
async function loadAi(fresh = false) {
  aiLoading = true;
  renderAi();
  try {
    ai = await fetchJson(`/api/ai-usage${fresh ? "?fresh=1" : ""}`);
    aiError = null;
    saveCache(AI_CACHE, ai);
  } catch (e) {
    aiError = e.message;
  } finally {
    aiLoading = false;
    renderAi();
  }
}

// ---------- Refresh and settings ----------
let pollTimer = 0;
let pollDue = false;
let scheduledMs = null;

/**
 * How often the live cards reload: the Auto refresh settings in work mode, never in personal mode (its cards
 * are examples so far).
 * @returns {number} Milliseconds, or 0 for no automatic reload.
 */
const pollMs = () => settings.mode === "work" && settings.autoRefresh ? settings.refreshMinutes * 60e3 : 0;

/** Each live work card's loader, by card id; `fresh` skips the server's cache. */
const CARD_LOADERS = {
  ic: (fresh) => loadIc(fresh), jira: (fresh) => loadJira(fresh), prs: () => loadPrs(), ai: (fresh) => loadAi(fresh),
  cal: (fresh) => loadCal(fresh), slack: (fresh) => loadSlack(fresh), ooo: (fresh) => loadOoo(fresh), tasks: () => loadTasks("tasks"),
};
const cardTimers = {};
const cardsDue = new Set();

/**
 * The cards that reload with the others, on the Auto refresh timer: those whose own Refresh every is "With the
 * other cards".
 * @returns {string[]}
 */
const sharedCards = () => Object.keys(CARD_LOADERS).filter((id) => settings[`${id}Refresh`] === 0);

/**
 * Starts each card's own reload timer, for cards with their own Refresh every. A hidden window waits, like the main
 * timer, and reloads them when it's shown again.
 */
function scheduleCards() {
  for (const id of Object.keys(CARD_LOADERS)) {
    clearInterval(cardTimers[id]);
    const minutes = settings[`${id}Refresh`];
    if (settings.mode !== "work" || !settings.autoRefresh || minutes <= 0) continue;
    cardTimers[id] = setInterval(() => (document.hidden ? cardsDue.add(id) : CARD_LOADERS[id](false)), minutes * 60e3);
  }
}

/**
 * Starts the countdown to the next automatic reload, and the ring that shows it.
 */
function schedulePoll() {
  clearTimeout(pollTimer);
  pollDue = false;
  scheduledMs = pollMs();
  if (scheduledMs) pollTimer = setTimeout(poll, scheduledMs);
  FelixShell.restartRing(scheduledMs);
}

/**
 * Reloads the live cards (every one, or only those named) and starts the countdown to the next automatic reload.
 * @param {boolean} fresh Skip the server's caches (on-call keeps an hour, AI usage 2 minutes, unless Settings says otherwise).
 * @param {string[]} [only] The cards to reload; all of them when left out.
 * @returns {Promise<void>}
 */
async function loadAll(fresh, only = Object.keys(CARD_LOADERS)) {
  schedulePoll();
  if (settings.mode !== "work") return Promise.all([loadTasks("ptasks"), loadBuddy()]);
  await Promise.all(only.map((id) => CARD_LOADERS[id](fresh)));
}

/**
 * The Refresh button and the R key: reload everything past the server's caches, with the button spinning.
 * @returns {Promise<void>}
 */
async function refreshAll() {
  if (settings.mode !== "work") return;
  $("refresh").classList.add("spinning");
  await loadAll(true);
  $("refresh").classList.remove("spinning");
}

/**
 * The automatic reload. A hidden window waits instead, which keeps the GitHub limit for work that needs it, and
 * reloads as soon as it is shown again.
 */
function poll() {
  if (document.hidden) pollDue = true;
  else loadAll(false, sharedCards());
}

/** What a change to each card's settings needs from the server: these keys change what the card asks for. */
const RELOAD_ON = {
  ic: ["icDays", "icLookahead"], jira: ["jiraBoard", "jiraWhose"], prs: ["prsReleases"], ai: ["aiClaude", "aiCursor"],
  cal: ["calDays", "calDeclined"], ooo: ["oooAhead", "oooView"], tasks: ["tasksDoneToday"], ptasks: ["tasksDoneToday"],
  // Felix's check-ins: the Personal home, friend mode and quiet hours decide what it shows.
  buddy: ["mode", "felixOn", "felixFriendOn", "felixQuietOn", "felixQuietFrom", "felixQuietTo"],
};

/**
 * Follows a settings change on the cards: the classes every card reads, each card's view and who it shows when its
 * opening setting changed, the card timers, a reload for cards whose data depends on what changed, and a redraw.
 * @param {Record<string, unknown>} prev The settings before the change.
 */
function followCardSettings(prev) {
  const root = document.documentElement.classList;
  root.toggle("no-card-icons", !settings.cardIcons);
  root.toggle("no-card-links", !settings.cardLinks);
  root.toggle("no-card-updated", !settings.cardUpdated);
  const changed = (key) => prev[key] !== settings[key];
  if (Object.keys(CARD_LOADERS).some((id) => changed(`${id}Refresh`)) || changed("autoRefresh") || changed("mode")) scheduleCards();
  if (changed("oooView")) oooView = settings.oooView === "last" ? oooView : settings.oooView;
  if (changed("oooWho")) oooWho = settings.oooWho === "last" ? oooWho : settings.oooWho;
  const reload = new Set(Object.keys(RELOAD_ON).filter((id) => RELOAD_ON[id].some(changed)));
  for (const id of Object.keys(TASK_CARDS)) {
    const st = taskState[id];
    // A view turned off in Settings takes the card back to Today.
    const view = changed(TASK_CARDS[id].setting) ? openingView(id) : taskViews(id).includes(st.view) ? st.view : "today";
    if (view !== st.view) reload.add(id);
    st.view = view;
  }
  renderCards();
  const live = settings.mode === "work" ? Object.keys(CARD_LOADERS) : ["ptasks", "buddy"];
  for (const id of live.filter((x) => reload.has(x))) {
    if (id === "ptasks") loadTasks(id);
    else if (id === "buddy") loadBuddy();
    else CARD_LOADERS[id](false);
  }
}

/**
 * Applies settings: the mode's cards, Fit to screen, and the reload timer.
 * @param {Record<string, unknown>} next Clean settings.
 * @param {boolean} [first] The first draw of the page.
 */
function applySettings(next, first = false) {
  const modeChanged = first || next.mode !== settings.mode;
  const prev = first ? {} : settings;
  settings = next;
  document.documentElement.classList.toggle("fit", Boolean(settings.fitToScreen));
  FelixShell.setMode(settings.mode);
  if (modeChanged) drawGrid();
  // After a mode change the cards load in full below, so only the mode counts as changed here.
  followCardSettings(modeChanged ? { ...settings, mode: prev.mode } : prev);
  // Each mode loads its own cards when it opens (loadAll picks Personal's or Work's).
  if (modeChanged) loadAll(false);
  else if (pollMs() !== scheduledMs) schedulePoll();
}

/**
 * The top bar's Personal and Work switch: changes the cards at once and saves the choice.
 * @param {string} mode
 */
function switchMode(mode) {
  applySettings({ ...settings, mode });
  FelixShell.saveSettings({ mode }).catch(() => {});
}

$("refresh").addEventListener("click", refreshAll);
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "r" && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) refreshAll();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (pollDue) loadAll(false, sharedCards());
  for (const id of cardsDue) CARD_LOADERS[id](false);
  cardsDue.clear();
});
window.addEventListener("storage", (e) => {
  if (e.key === FelixShell.SETTINGS_CACHE) applySettings(cleanSettings(JSON.parse(e.newValue || "null")));
});

applySettings(settings, true);
FelixShell.loadSettings().then((s) => applySettings(cleanSettings(s))).catch(() => {});
</script>
</body>
</html>
