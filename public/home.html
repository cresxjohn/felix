<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felix</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Felix">
<meta name="application-name" content="Felix">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<script src="/app.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/theme.css">
<script src="/pr-status.js"></script>
<script src="/layout.js"></script>
<link rel="stylesheet" href="/shell.css">
<script src="/shell.js"></script>
<script src="/dropdown.js"></script>
<script src="/pickers.js"></script>
<script src="/cards.js"></script>
<script src="/music.js"></script>
<script src="/voice-device.js"></script>
<script src="/felix-voice.js"></script>
<script src="/felix.js"></script>
<style>
/* Home: a 12-column grid of cards inside Felix's shell (/shell.css). Each card's spot comes from /layout.js.
   Wide windows place each card at its spot. Medium ones flow cards in reading order at twice their width (so two
   share a row), and narrow ones stack them. Rows grow to fit their tallest card, unless Fit to screen is on. */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(200px, auto); gap: 16px; }
.grid > .card { grid-column: var(--x) / span var(--w); grid-row: var(--y) / span var(--h); }
@media (max-width: 1199px) {
  .grid { grid-auto-flow: row dense; }
  .grid > .card { grid-column: span var(--wm); grid-row: span var(--h); }
}
@media (max-width: 699px) { .grid > .card { grid-column: 1 / -1; grid-row: auto; } }

/* Fit to screen: on a wide window the page is exactly the window's height and the rows share it. A card whose
   content is longer than its space scrolls inside. */
@media (min-width: 1200px) {
  html.fit, html.fit body { height: 100dvh; overflow: hidden; }
  html.fit .app { height: 100dvh; min-height: 0; }
  html.fit .grid { flex: 1; min-height: 0; grid-auto-rows: unset; grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); }
  html.fit .card { min-height: 0; }
  html.fit .card-body { min-height: 0; overflow: auto; scrollbar-width: thin; }
  html.fit .dock { position: static; margin-top: 0; padding-top: 0; background: none; }
}
html[data-mode="personal"] #refresh { display: none; }

/* Extra details for when rows grow to fit their cards: .roomy shows unless Fit to screen is on, .fit-only the
   other way round. .narrow-only hides on a wide card, where a fuller view takes its place. */
.card .fit-only { display: none; }
@media (min-width: 1200px) {
  html.fit .card .roomy { display: none; }
  html.fit .card .fit-only { display: revert; }
}
.list { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.list .item b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .item.mine b { color: var(--accent); }

.card {
  background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--r-card); box-shadow: var(--card-shadow);
  padding: var(--pad); display: flex; flex-direction: column; gap: 12px; min-width: 0; container: card / inline-size;
}
.card-body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.card-head { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.card-head h2 { margin: 0; font: 600 16px/1.3 var(--sans); letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* A card's icon is a plain muted glyph, not an icon in a tinted square. */
.card-head .icon { display: inline-grid; place-items: center; flex: none; width: 20px; height: 28px; color: var(--muted); }
.card-head .icon svg { width: 16px; height: 16px; }
.card-head .icon:has(.mark) { width: 24px; }
.card-head .icon svg.mark { width: 24px; height: 24px; }
.card-head .spacer { flex: 1; }
.card-head a.more { color: var(--link); font: 600 13px/1 var(--sans); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.card-head a.more:hover { text-decoration: underline; }
.card-head a.more svg { width: 13px; height: 13px; }
/* Settings that apply to every card (Home and layout). */
html.no-card-icons .card-head .icon { display: none; }
html.no-card-links .card-head a.more { display: none; }
html.no-card-updated .card-foot .when { display: none; }
.card-foot { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.card .error { background: var(--bad-bg); color: var(--bad); border-radius: var(--r-box); padding: 10px 12px; font-size: 13px; }
.card .error code { font-family: var(--mono); font-size: 12px; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
.label { color: var(--muted); font: 600 12px/1.2 var(--sans); }
.sub { display: block; color: var(--muted); font-size: 12.5px; }
.accent { color: var(--accent); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
.kv > span:first-child { color: var(--muted); white-space: nowrap; }
.kv > b { font-weight: 500; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv.accent > b { color: var(--accent); }
.kv.warn > b { color: var(--alert); }
.kv.bad > b { color: var(--bad); font-weight: 600; }
.chip { font: 500 12px/1.4 var(--sans); color: var(--muted); background: none; border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 2px 10px; white-space: nowrap; }
.chip.on { color: var(--fg); background: var(--neutral-soft); border-color: var(--fg); }

/* Incident Commander */
.now { display: grid; gap: 2px; }
.now .who { font: 600 18px/1.3 var(--sans); letter-spacing: -.01em; }
.now .who.none { color: var(--muted); font-weight: 500; }
.wide-only { display: none; }
@container card (min-width: 560px) { .wide-only { display: block; } .narrow-only { display: none; } }
.shifts { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.shifts th { text-align: left; font-weight: 500; color: var(--muted); padding: 0 8px 6px 0; font-size: 12px; }
.shifts th:first-child { width: 84px; }
.shifts td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.shifts td .name { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shifts td .time { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.shifts td .empty { color: var(--muted); }
.shifts .me .name { color: var(--accent); }

/* Open PRs */
.totals { display: flex; align-items: baseline; gap: 16px; padding-bottom: 2px; }
.totals a { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; }
.totals .n { font: 650 28px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.totals .t { color: var(--muted); font-size: 13px; }
.totals a:hover .t { color: var(--fg); text-decoration: underline; }
.count { display: flex; align-items: center; gap: 8px; padding: 3px 8px; margin: 0 -8px; border-radius: var(--r-tag); text-decoration: none; font-size: 13px; }
a.count:hover { background: var(--neutral-bg); }
.count .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.count .n { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.count.zero { color: var(--muted); }
.count.zero .dot { opacity: 0.35; }
.count.zero .n { font-weight: 400; }
.rels { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.rels .head { display: flex; align-items: center; gap: 8px; }
.rels .head a { margin-left: auto; color: var(--link); font-size: 12px; text-decoration: none; }
.rels .head a:hover { text-decoration: underline; }
.relrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; padding: 2px 0; }
.relrow .rk { font-weight: 600; min-width: 22px; }
.relrow > a.num { color: var(--link); text-decoration: none; }
.relrow > a.num:hover { text-decoration: underline; }
.relrow .yours { color: var(--muted); font-size: 12px; }
.relrow .acts { margin-left: auto; display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; font: 600 12px/1 var(--sans); border-radius: var(--r-pill); padding: 0 9px; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; text-decoration: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.alert { background: var(--alert-bg); color: var(--alert); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.run { background: var(--info-soft); color: var(--info); }
.mini { display: inline-flex; align-items: center; height: 26px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 0 10px; font: 600 12px/1 var(--sans); cursor: pointer; }
.mini:hover { border-color: var(--accent); color: var(--accent-ink); }
.mini.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mini.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
.mini.confirm { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.mini:disabled { opacity: .6; cursor: default; }

/* AI usage: an overview of every tool (its most pressing limit large, a small bar per limit), and a tool's details
   in a panel beside it on hover, focus or tap. */
.ai-rows { display: grid; gap: 4px; }
.ai-row { display: grid; gap: 8px; padding: 10px; margin: 0 -10px; border-radius: var(--r-box); cursor: default; outline: none; transition: background .15s; }
.ai-row + .ai-row { position: relative; }
.ai-row + .ai-row::before { content: ""; position: absolute; left: 10px; right: 10px; top: -2px; height: 1px; background: var(--line); }
.ai-row:hover, .ai-row.open, .ai-row:focus-visible { background: var(--surface-2); }
.ai-row:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.ai-row-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.ai-row-top b { font: 600 14px/1.2 var(--sans); }
.ai-row-top span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-row-top .chev { width: 14px; height: 14px; margin-left: auto; align-self: center; flex: none; fill: none; stroke: var(--faint); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s, stroke .2s; }
.ai-row:hover .chev, .ai-row.open .chev { stroke: var(--fg); transform: translateX(2px); }
.ai-lead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ai-lead .pct { font: 650 26px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ai-lead .what { display: grid; gap: 2px; min-width: 0; }
.ai-lead .what b { font: 500 13px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-lead .what span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ai-lead.warning .pct { color: var(--alert); }
.ai-lead.critical .pct { color: var(--bad); }
.ai-minis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 12px; }
.ai-mini { display: grid; gap: 4px; min-width: 0; }
.ai-mini .kvm { display: flex; justify-content: space-between; gap: 4px; font-size: 11.5px; color: var(--muted); }
.ai-mini .kvm span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-mini .kvm b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.ai-mini .bar { height: 4px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.ai-row:hover .ai-mini .bar, .ai-row.open .ai-mini .bar { background: var(--line); }
.ai-mini .bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s; }
.ai-mini.warning .bar span { background: var(--alert); } .ai-mini.warning .kvm b { color: var(--alert); }
.ai-mini.critical .bar span { background: var(--bad); } .ai-mini.critical .kvm b { color: var(--bad); }

.ai-pop {
  position: fixed; z-index: 80; width: 300px; display: grid; gap: 12px; padding: 14px;
  background: var(--raised); border-radius: var(--r-box); box-shadow: var(--pop-shadow);
  opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity .15s ease, transform .2s cubic-bezier(0.22, 1, 0.36, 1);
}
.ai-pop.on { opacity: 1; transform: none; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .ai-pop { transition: opacity .1s; transform: none; } }
.ai-pop-h { display: flex; align-items: baseline; gap: 8px; }
.ai-pop-h b { font: 600 15px/1.2 var(--sans); }
.ai-pop-h > span { color: var(--muted); font-size: 12px; }
.ai-open { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--link); font: 600 12px/1 var(--sans); text-decoration: none; white-space: nowrap; }
.ai-open:hover { text-decoration: underline; }
.ai-open svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ai-pop-b { display: grid; gap: 12px; }
.meter { display: grid; gap: 5px; font-size: 13px; }
.meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.meter-top .pct { font: 650 16px/1 var(--sans); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.meter-reset { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.meter .bar { height: 6px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.meter .bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s; }
.meter.warning .bar span { background: var(--alert); }
.meter.warning .pct { color: var(--alert); }
.meter.critical .bar span { background: var(--bad); }
.meter.critical .pct { color: var(--bad); }
.ai-note { color: var(--muted); font-size: 12px; }
.ai-note code, .ai-alert code { font-family: var(--mono); font-size: 12px; }
.ai-alert { background: var(--bad-bg); color: var(--bad); border-radius: var(--r-box); padding: 8px 10px; font-size: 12.5px; line-height: 1.4; }

/* A card's Set up form, in place of its content until its service is connected. */
.setup { display: grid; gap: 12px; align-content: start; }
.setup-head { display: grid; gap: 3px; }
.setup-head b { font: 600 15px/1.3 var(--sans); }
.setup-head span { color: var(--muted); font-size: 13px; }
.setup-steps { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.setup-steps a { color: var(--link); }
.setup-steps code { font: 12px var(--mono); padding: 1px 5px; border-radius: var(--r-tag); background: var(--surface-2); color: var(--fg); }
.setup-fields { display: grid; gap: 8px; }
.setup-field { display: grid; gap: 4px; font: 600 12px/1.2 var(--sans); color: var(--muted); }
/* Inputs use the shared .field look (shell.css). */
.setup-field small { font-weight: 400; color: var(--faint); }
.setup-error { margin: 0; padding: 8px 10px; border-radius: var(--r-box); background: var(--bad-soft); color: var(--bad); font-size: 12.5px; }
.setup-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.setup-foot span { color: var(--muted); font-size: 12px; }
.setup-go {
  height: 34px; padding: 0 14px; border: 0; border-radius: var(--r-box); background: var(--accent); color: var(--on-accent);
  font: 600 13px var(--sans); cursor: pointer;
}
.setup-go:hover { background: var(--accent-hover); }
.setup-go:disabled { opacity: .6; cursor: progress; }

/* A card that needs setup: itself with sample data, faded and fading out downwards, under a panel the colour of the
   card that rises out of it, with what the card is for and Set up. */
.gate { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 240px; }
.gate-preview { flex: 1; display: flex; flex-direction: column; gap: 8px; opacity: .5; filter: saturate(.6); pointer-events: none; user-select: none; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, rgba(0, 0, 0, .35) 70%, transparent 96%); mask-image: linear-gradient(to bottom, #000 30%, rgba(0, 0, 0, .35) 70%, transparent 96%); }
.gate-panel {
  position: absolute; left: -2px; right: -2px; bottom: -2px; display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px;
  border-radius: 14px; background: var(--surface);
  box-shadow: 0 -22px 30px 2px var(--surface), 0 0 0 1px var(--line), 0 10px 28px rgba(17, 24, 39, .09);
}
.gate-text { flex: 1; min-width: 0; display: grid; gap: 3px; }
.gate-text b { font: 600 14px/1.3 var(--sans); }
.gate-text > span { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.gate-text .gate-problem { color: var(--bad); }
.gate-panel .setup-go { flex: none; }
.gate-back { align-self: flex-start; margin-bottom: 2px; border: 0; background: none; padding: 0; color: var(--link); font: 600 12.5px var(--sans); cursor: pointer; }
.gate-back:hover { text-decoration: underline; }

/* Felix's own loader: his face with the thinking eyes drifting side to side, what he's doing, and three dots that
   pulse in turn. The form behind it fades and stops taking clicks, so the card reads as busy, not frozen. */
.setup-go.loading, .setup-go.loading:disabled { opacity: 1; cursor: progress; }
.felix-load { display: inline-flex; align-items: center; gap: 8px; }
.felix-load .mark { width: 18px; height: 18px; }
.felix-load .dots { display: inline-flex; gap: 2px; margin-left: -4px; }
.felix-load .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .25; animation: felix-dot 1.2s ease-in-out infinite; }
.felix-load .dots i:nth-child(2) { animation-delay: .2s; }
.felix-load .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes felix-dot { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
.setup.busy .setup-steps, .setup.busy .setup-fields, .setup.busy .setup-foot > span { opacity: .45; pointer-events: none; transition: opacity .25s ease; }
@media (prefers-reduced-motion: reduce) { .felix-load .dots i { animation: none; opacity: .7; } }

.google-route { margin-top: 10px; }
.copy-text { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg); padding: 8px; font: 12px/1.45 var(--mono); resize: vertical; }
.cal-reply { display: inline-flex; gap: 4px; flex: none; }
/* Slack: message rows that open in Slack, a count beside each section's name, and the watched channels. */
.label .n { margin-left: 4px; color: var(--muted); font-weight: 500; }
.slack-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.slack-msg { display: flex; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; color: var(--fg); text-decoration: none; }
.slack-msg:hover { background: var(--surface-2); }
.slack-msg .face { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-bg); font-size: 11px; font-weight: 600; }
.slack-text { display: grid; gap: 2px; min-width: 0; flex: 1; }
.slack-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: 13px; }
.slack-top b { font-weight: 600; white-space: nowrap; }
.slack-top .sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.slack-body { color: var(--muted); font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.slack-more { color: var(--link); font-size: 12px; text-decoration: none; }
.slack-more:hover { text-decoration: underline; }
.slack-kv { color: var(--fg); text-decoration: none; padding: 3px 0; }
.slack-kv:hover span { color: var(--link); }
.slack-kv.quiet b { color: var(--muted); font-weight: 500; }
/* An invite's Yes, Maybe and No sit on their own line under the title, so the row never outgrows the card. */
.cal-row.ask { flex-wrap: wrap; row-gap: 4px; }
.cal-row.ask .cal-reply { order: 3; flex-basis: 100%; padding-left: 56px; flex-wrap: wrap; row-gap: 6px; }
.cal-reply .mini.quiet { border-color: transparent; background: none; color: var(--muted); }
.cal-reply .mini.quiet[aria-expanded="true"] { color: var(--fg); background: var(--surface-2); }
.cal-note { flex-basis: 100%; height: 32px; }
.cal-reply .mini { height: 24px; padding: 0 8px; }
.setup .linkbtn, .card-foot .linkbtn, .ooo-new .linkbtn, .google-route { border: 0; background: none; padding: 0; color: var(--link); font: 600 13px/1 var(--sans); cursor: pointer; }
.setup .linkbtn:hover, .card-foot .linkbtn:hover, .ooo-new .linkbtn:hover, .google-route:hover { text-decoration: underline; }
.card-foot .linkbtn { font-size: 12px; }

/* Team out of office: when (Today, Tomorrow, Upcoming, Pick dates) and who (My team, Everyone), then the people out. */
.ooo-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.ooo-pick { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.ooo-pick .dd-btn { height: 32px; min-width: 0; width: auto; background: var(--surface-2); }
.ooo-list { display: grid; gap: 10px; }
.ooo-list .person > span:last-child { display: grid; gap: 2px; }
.ooo-new { margin-top: 12px; padding: 8px 10px; border-radius: var(--r-box); background: var(--neutral-soft); font-size: 12px; color: var(--muted); }

.team-dlg { width: min(560px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 64px)); padding: 0; border: 1px solid var(--line-strong); border-radius: var(--r-card, 16px); background: var(--surface); color: var(--fg); box-shadow: 0 24px 60px rgba(0, 0, 0, .3); }
.team-dlg::backdrop { background: rgba(0, 0, 0, .35); }
.team-dlg form { display: grid; grid-template-rows: auto 1fr auto auto; max-height: inherit; }
.team-head { display: grid; gap: 4px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.team-head .sub { font-size: 12px; }
.team-list { overflow: auto; padding: 10px 20px; display: grid; gap: 6px; align-content: start; }
.team-search { margin-top: 8px; }
.team-list { gap: 0; }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 6px; border-radius: 10px; }
.team-row[hidden] { display: none; }
.team-pick { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border-radius: 10px; cursor: pointer; }
.team-pick:hover { background: var(--surface-2); }

.team-pick .face { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-bg); font-size: 11px; font-weight: 600; }
.team-pick .who { display: grid; gap: 1px; min-width: 0; font-size: 13px; }
.team-pick .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-pick .who .sub { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-pick:has(input:checked) .face { background: var(--accent); color: var(--on-accent); }
.team-edit { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; opacity: 0; }
.team-row:hover .team-edit, .team-edit:focus-visible, .team-edit.on { opacity: 1; }
.team-edit:hover, .team-edit.on { background: var(--surface-2); color: var(--fg); }
.team-edit svg { width: 16px; height: 16px; }
.team-fields { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 4px 8px 12px 44px; }
.team-fields[hidden] { display: none; }
.team-fields .field { min-width: 0; }
.team-count { font-size: 12px; color: var(--muted); align-self: center; }
.ooo-holiday { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; }
.ooo-holiday .flag { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--neutral-soft); color: var(--muted); }
.ooo-holiday .flag svg { width: 14px; height: 14px; }
.ooo-holiday > span:last-child { display: grid; gap: 2px; }
.team-dlg .setup-error { margin: 0 20px; }
.team-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }

/* Calendar: today's events, the one on now or next highlighted with Join as the main button. */
.cal-next { color: var(--accent-ink); font: 600 13px/1 var(--sans); white-space: nowrap; }
.cal-rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.cal-row { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 6px 10px; margin: 0 -10px; border-radius: var(--r-box); font-size: 13px; }
.cal-row.lead { background: var(--accent-soft); }
.cal-row.past { opacity: .5; }
.cal-time { width: 44px; flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-title { flex: 1; min-width: 0; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-row.lead .cal-title { font-weight: 600; }
.cal-title:hover { text-decoration: underline; }
.cal-row .mini { text-decoration: none; }

/* My Jira Board */
.jira-counts { row-gap: 8px; }
.jira-col { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
.jira-col .dot { width: 8px; height: 8px; border-radius: 50%; }
.jira-counts .kv.zero { opacity: .55; }
.jira-progress { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.jira-progress .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.jira-progress .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
.jira-plate-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 12px 0 4px; }
.jira-plate { display: grid; grid-template-columns: minmax(0, 1fr); }
.jira-ticket { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; margin: 0 -8px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 13px; }
.jira-ticket:hover { background: var(--surface-2); }
.jira-ticket .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.jira-ticket .key { font: 500 12px var(--mono); color: var(--muted); flex: none; }
.jira-ticket .sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jira-ticket .col { flex: none; color: var(--muted); font-size: 12px; }
.jira-more { color: var(--link); font-size: 12px; text-decoration: none; white-space: nowrap; }
.jira-more:hover { text-decoration: underline; }

/* Cards still to come: an example of how they will look, dimmed, with a note at the foot. */
.card.soon { border-style: dashed; }
.card.soon .icon { color: var(--faint); }
.card.soon .icon b { font-size: 14px; }
.preview { display: flex; flex-direction: column; gap: 8px; opacity: .62; user-select: none; }
.soon-foot { flex-wrap: nowrap; justify-content: flex-start; align-items: center; }
.soon-foot .chip { border-style: dashed; border-color: var(--line-strong); }
.soon-foot > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.indent { padding-left: 16px; margin-top: -4px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip.warm { align-self: flex-start; background: var(--warn-bg); color: var(--warn); }
.times { display: grid; grid-template-columns: 44px 1fr; gap: 6px 8px; font-size: 13px; }
.times > span:nth-child(odd) { color: var(--muted); font-variant-numeric: tabular-nums; }
/* A meeting with an action: its name on the left, the Join button at the row's right end. */
.times .ev { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.person { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; }
.person .face { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-bg); font-size: 11px; font-weight: 600; }
.person b, .item b { font-weight: 600; }
.item { display: grid; font-size: 13px; }
.item.soon .sub { color: var(--accent); }
.check { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.box { width: 16px; height: 16px; flex: none; border: 1.5px solid var(--muted); border-radius: 4px; opacity: .7; }
.done > .box { background: var(--accent); border-color: var(--accent); opacity: 1; }
.box { border-color: var(--line-strong); opacity: 1; }
.add { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-box); color: var(--muted); font-size: 13px; }
.task { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 19px; }
.task:last-of-type { border-bottom: 0; }
/* A long name wraps onto as many lines as it needs; the box, labels and due day line up with its first line. */
.task .title { flex: 1; min-width: 0; line-height: 19px; overflow-wrap: anywhere; }
.task > :not(.title) { margin-top: 1px; }
.task > .box { margin-top: 2px; }
.task.high .title::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--bad); vertical-align: middle; }
.task .tag { padding: 2px 8px; border-radius: var(--r-tag); background: var(--surface-2); color: var(--muted); font: 500 12px/1.3 var(--sans); }
.task .due { width: 64px; text-align: right; }
.task.late .due { color: var(--bad); font-weight: 600; }
.task.done .title, .task.done .due { color: var(--muted); }

/* The live Tasks card: quick add, views, rows you tick, open and drag. */
.task-add { display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-box); color: var(--muted); font-size: 13px; }
.task-add:focus-within { border-color: var(--accent); }
.task-add input { flex: 1; min-width: 0; height: 34px; border: 0; background: none; color: var(--fg); font: 500 13px var(--sans); outline: none; }
.task-add input::placeholder { color: var(--muted); }
.task-tools { margin: 10px 0 4px; }
.task-tools .chip { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.task-tools .chip .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.task-tools .chip .n.bad { color: var(--bad); font-weight: 600; }
/* One column no wider than the card: a long title cuts off with "…" instead of widening the list. */
.task-list { display: grid; grid-template-columns: minmax(0, 1fr); }
.task-list .task { border-bottom: 1px solid var(--line); }
.task-list .task:last-child { border-bottom: 0; }
.task-list .task[draggable] { cursor: grab; }
.task-list .task.dragging { opacity: .4; }
.task .box { padding: 0; background: none; cursor: pointer; }
.task.done .box { background: var(--accent); border-color: var(--accent); }
.task .title { border: 0; background: none; padding: 0; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.task .title:hover { color: var(--link); }
.task.done .title { text-decoration: line-through; }
.task button.tag { border: 0; cursor: pointer; }
.task-tags { display: inline-flex; gap: 3px; flex: none; }
.task .tag.more { font-variant-numeric: tabular-nums; }
.task-project { display: inline-flex; align-items: center; gap: 4px; flex: none; max-width: 120px; padding: 0; border: 0; background: none; color: var(--muted); font: 500 12px/1.3 var(--sans); cursor: pointer; }
.task-project span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-project svg { width: 13px; height: 13px; flex: none; }
.task-project:hover { color: var(--fg); }
.tag-pop { min-width: 150px; }
.tag-pop-head { padding: 6px 10px 4px; color: var(--muted); font: 600 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; }
.tag-pop .dd-item { width: 100%; border: 0; background: none; text-align: left; }
.task button.tag:hover { color: var(--fg); }
.task-link { font: 500 12px var(--mono); color: var(--muted); text-decoration: none; white-space: nowrap; }
.task-link:hover { color: var(--link); text-decoration: underline; }
.task-subs, .task-repeat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.task-foot { margin-top: auto; }
.task-list:has(> .empty-state) { flex: 1; align-content: center; }

/* Empty states: a small drawing over one muted line, centred in the card's free space. */
.empty-state { display: grid; justify-items: center; gap: 10px; padding: 18px 0; text-align: center; animation: felix-in .35s cubic-bezier(0.22, 1, 0.36, 1); }
.empty-state svg { width: 112px; height: 84px; overflow: visible; }
.empty-state p { margin: 0; color: var(--muted); font-size: 13px; }
.empty-state .tile { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.75; }
.empty-state .clip { fill: var(--raised); stroke: var(--line-strong); stroke-width: 1.75; }
.empty-state .line { fill: none; stroke: var(--muted); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.empty-state .line.thick { stroke-width: 3.5; }
.empty-state .tick { fill: none; stroke: var(--ok); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.empty-state .tick-on { fill: none; stroke: var(--on-accent); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.empty-state .spark-tile { fill: var(--accent); }
.empty-state .spark { fill: var(--accent); opacity: .85; }
.empty-state .dot { fill: var(--line-strong); }
.empty-state .moon { fill: var(--raised); stroke: var(--line-strong); stroke-width: 1.75; }
.ooo-list:has(> .empty-state) { align-content: center; flex: 1; }
.task-foot .card-foot { margin-top: 8px; }
/* The task's name wraps onto as many lines as it needs, and the box grows with it. */
.task-dlg .task-name { display: block; width: 100%; padding: 0; border: 0; background: none; color: var(--fg); font: 600 16px/1.35 var(--sans); outline: none; resize: none; overflow: hidden; }
.task-fields { gap: 12px; }
.task-fields .setup-field { font-weight: 600; }
.link-chip { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 4px 0 10px; border-radius: var(--r-pill); background: var(--surface-2); font: 500 12.5px var(--sans); }
.link-chip a { color: var(--link); text-decoration: none; }
.link-chip a:hover { text-decoration: underline; }
.link-chip button { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
.link-chip button:hover { background: var(--line); color: var(--fg); }
.task-links:empty { display: none; }
.task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check-line { cursor: pointer; }
.task-links { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; }
.task-links a { color: var(--link); }
.task-subtasks { display: grid; gap: 6px; }
.team-foot .spacer { flex: 1; }
.mini.danger { color: var(--bad); }
.mini.danger:hover { border-color: var(--bad); color: var(--bad); }
.weather { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.weather .temp, .big { font-size: 22px; font-weight: 600; line-height: 1.2; }
.weather .temp { font-size: 30px; }
.bubble { padding: 8px 12px; border: 1px solid var(--accent); border-radius: var(--r-box); background: var(--accent-bg); font-size: 13px; }
.bubble.plain { border-color: var(--line); background: none; }
/* The Felix card: a check-in on something you told him, with its day and your words, or a quiet note. */
.checkin { display: grid; gap: 8px; }
.checkin .acts { display: flex; gap: 8px; }
.checkin .acts button { height: 30px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-box); background: var(--surface); color: var(--fg); font: 600 12px var(--sans); cursor: pointer; }
.checkin .acts .yes { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mood { display: flex; gap: 6px; }
.mood i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); }
.mood i.ok { background: var(--ok); border-color: var(--ok); }
.mood i.warn { background: var(--warn); border-color: var(--warn); }
.mood i.accent { background: var(--accent); border-color: var(--accent); }
.habit { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.habit .days { display: flex; gap: 4px; }
.habit .days i { width: 11px; height: 11px; border-radius: 3px; background: var(--neutral-bg); }
.habit .days i.on { background: var(--accent); }

.skel { background: var(--neutral-bg); border-radius: var(--r-tag); height: 12px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>

<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="grid" id="grid"></main>
  <footer class="dock" id="dock"></footer>
</div>
<script type="module">
import { cleanSettings } from "/settings-schema.mjs";

const $ = (id) => document.getElementById(id);
const { LAYOUTS, placementStyle, rowCount } = FelixLayout;
const { CARDS, strokeIcon } = FelixCards;

/**
 * Escapes text for HTML.
 * @param {unknown} s
 * @returns {string}
 */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let settings = cleanSettings(FelixShell.cachedSettings());

FelixShell.mount({ install: true, mode: settings.mode, onMode: switchMode });

// ---------- Cards ----------
const EXTERNAL_ICON = strokeIcon(`<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>`);

/**
 * A card's header link: a page in Felix, or an outside site that opens in a new tab.
 * @param {{ href: string, label: string, external?: boolean } | undefined} link
 * @returns {string}
 */
function cardLinkHtml(link) {
  if (!link) return "";
  const outside = link.external ? ` target="_blank" rel="noopener"` : "";
  return `<a class="more" href="${esc(link.href)}"${outside}>${esc(link.label)}${link.external ? ` ${EXTERNAL_ICON}` : ""}</a>`;
}

/**
 * A card still to come: its example, dimmed and out of the tab order, then what it needs, which stays in view
 * when the example scrolls.
 * @param {{ needs: string, preview: string }} soon
 * @returns {string}
 */
const soonBodyHtml = (soon) => `<div class="card-body"><div class="preview" inert aria-hidden="true">${soon.preview}</div></div>`
  + `<div class="card-foot soon-foot"><span class="chip">Coming soon · example</span><span title="${esc(soon.needs)}">${esc(soon.needs)}</span></div>`;

/**
 * One card at its grid spot: the header, then a body that its loader fills, or a placeholder's example.
 * @param {{ id: string, x: number, y: number, w: number, h: number }} spot
 * @returns {string}
 */
function cardHtml(spot) {
  const c = CARDS[spot.id];
  const about = c.soon ? ` title="${esc(c.soon.about)}"` : "";
  return `<section class="card${c.soon ? " soon" : ""}" id="${spot.id}" aria-labelledby="${spot.id}-title" style="${placementStyle(spot)}"${about}>`
    + `<div class="card-head"><span class="icon">${c.icon}</span><h2 id="${spot.id}-title">${esc(c.title)}</h2><span class="spacer"></span>`
    + `<span class="head-tools" id="${spot.id}-tools"></span>${cardLinkHtml(c.link)}</div>`
    + `${c.soon ? soonBodyHtml(c.soon) : `<div class="card-body" id="${spot.id}-body"></div>`}</section>`;
}

/**
 * Draws the cards of the current mode, the live ones from their last data.
 */
function drawGrid() {
  const layout = LAYOUTS[settings.mode];
  $("grid").style.setProperty("--rows", rowCount(layout));
  $("grid").innerHTML = layout.map(cardHtml).join("");
  renderCards();
}

/**
 * Draws the mode's live cards again from their last data, as after a settings change.
 */
function renderCards() {
  if (settings.mode === "work") { renderIc(); renderJira(); renderPrs(); renderAi(); renderCal(); renderSlack(); renderOoo(); renderTasks("tasks"); }
  else renderTasks("ptasks");
}

// Times show in this Mac's time zone (Manila), like the Datadog page.
const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmtDay = (t) => new Date(t).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const DAY = 86400e3;

/**
 * "today", "tomorrow" or "in 5 days", by calendar day.
 * @param {string | number} t
 * @returns {string}
 */
function daysAway(t) {
  const n = Math.round((startOfDay(t) - startOfDay(Date.now())) / DAY);
  return n <= 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
}

/**
 * "in 25m", "in 3h 10m", or the day for anything a day or more away.
 * @param {string} t
 * @returns {string}
 */
function inTime(t) {
  const m = Math.max(0, Math.round((Date.parse(t) - Date.now()) / 60e3));
  if (m < 60) return `in ${m}m`;
  const h = Math.floor(m / 60);
  return h < 24 ? `in ${h}h${m % 60 ? ` ${m % 60}m` : ""}` : daysAway(t);
}

/**
 * "just now", "4m ago", "2h ago" or "3d ago".
 * @param {string} iso
 * @returns {string}
 */
function ago(iso) {
  const m = Math.floor((Date.now() - Date.parse(iso)) / 60e3);
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  return m < 1440 ? `${Math.floor(m / 60)}h ago` : `${Math.floor(m / 1440)}d ago`;
}

/**
 * A time as "11:59 PM" today, or "Fri, Oct 30, 11:59 PM" on another day.
 * @param {string} iso
 * @returns {string}
 */
const fmtWhen = (iso) => startOfDay(iso) === startOfDay(Date.now()) ? fmtTime(iso) : `${fmtDay(iso)}, ${fmtTime(iso)}`;

/**
 * Reads a card's last data from the browser.
 * @param {string} key
 * @returns {object | null}
 */
function readCache(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; }
}

/**
 * Keeps a card's data in the browser, so the card draws at once next time.
 * @param {string} key
 * @param {object} value
 */
function saveCache(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const skeleton = (rows) => `<div style="display:grid;gap:10px">${Array.from({ length: rows }, (_, i) => `<div class="skel" style="width:${[60, 85, 70, 45][i % 4]}%"></div>`).join("")}</div>`;

/**
 * GETs JSON from the local server.
 * @param {string} path
 * @returns {Promise<object>}
 * @throws {Error & { code?: string }} when the server is down or answers with an error.
 */
async function fetchJson(path) {
  let res;
  try { res = await fetch(path, { cache: "no-store" }); }
  catch { throw new Error("Can't reach the local server. Start it with ./prs start."); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || `The server answered ${res.status}.`), { code: body.code });
  return body;
}

/**
 * The foot of a live card: an optional note on the left, and when its data was fetched on the right.
 * @param {string} iso When the data was fetched.
 * @param {boolean} loading Whether a refresh is under way.
 * @param {string} [note] Markup for the left side.
 * @returns {string}
 */
const footHtml = (iso, loading, note = "") => `<div class="card-foot"><span>${note}</span>`
  + `<span class="when" title="${esc(new Date(iso).toLocaleString())}">${esc(`Updated ${ago(iso)}${loading ? " · refreshing…" : ""}`)}</span></div>`;

/**
 * A label and its value on one line.
 * @param {string} label
 * @param {string} value Markup.
 * @param {string} [cls]
 * @param {string} [title]
 * @returns {string}
 */
const kvHtml = (label, value, cls = "", title = "") => `<div class="kv ${cls}"${title ? ` title="${esc(title)}"` : ""}><span>${esc(label)}</span><b>${value}</b></div>`;

/**
 * Draws a live card's body, or nothing when the card isn't on the page (personal mode).
 * @param {string} id
 * @param {string} html
 */
function fillCard(id, html) {
  const body = $(`${id}-body`);
  if (body) body.innerHTML = html;
}

// says what it's for, with Set up. The guide opens only on Set up, with Back to the sample.

const GATES = {
  ic: { title: "Connect Datadog", text: "See who's Incident Commander now and next, and your next shift." },
  jira: { title: "Connect Jira", text: "See your sprint, column by column, and what's on your plate." },
  cal: { title: "Connect Google Calendar", text: "See today's meetings with Join, and answer invites." },
  ooo: { title: "Connect Google Calendar", text: "See who on your team is out today and coming up, from the vacation tracker." },
  slack: { title: "Connect Slack", text: "See who mentioned you, what you saved for later, and the channels you watch." },
};

/**
 * Draws a card that needs setup: its sample under the Set up panel, or the guide once Set up was clicked.
 * @param {keyof typeof GATES} id
 * @param {string} guide The setup guide's markup.
 * @param {string} problem Why the saved connection stopped working, if it did.
 * @param {() => void} drawSample Draws the card with sample data into its body.
 */
function gateCard(id, guide, problem, drawSample) {
  const tools = $(`${id}-tools`);
  if (guideOpen.has(id)) {
    if (tools) tools.textContent = "";
    return fillCard(id, `<button type="button" class="gate-back" data-gate-back="${id}">← Back</button>${guide}`);
  }
  drawSample();
  const body = $(`${id}-body`);
  if (!body) return;
  if (tools) tools.textContent = "";
  const g = GATES[id];
  body.innerHTML = `<div class="gate"><div class="gate-preview" inert aria-hidden="true">${body.innerHTML}</div>`
    + `<div class="gate-panel" role="group" aria-label="${esc(g.title)}"><span class="gate-text"><b>${esc(g.title)}</b><span>${esc(g.text)}</span>`
    + `${problem ? `<span class="gate-problem">${esc(problem)}</span>` : ""}</span>`
    + `<button class="setup-go" type="button" data-gate-open="${id}">${problem ? "Fix it" : "Set up"}</button></div></div>`;
}

/**
 * Draws a card once with sample data in place of its real data, then puts the real data back.
 * @param {() => any[]} get The card's state, as [data, error, loading].
 * @param {(state: any[]) => void} set Puts state back.
 * @param {any} sample
 * @param {() => void} render
 */
function withSample(get, set, sample, render) {
  const keep = get();
  set([sample, null, false]);
  try { render(); } finally { set(keep); }
}

// ---------- Incident Commander ----------
const IC_CACHE = "cmd-center:ic";
let ic = readCache(IC_CACHE);
let icError = null;
let icLoading = false;

/**
 * A time on the Incident Commander card, with the time zone after it when Settings asks for it: "10:00 PM GMT+8".
 * @param {string | number} t
 * @returns {string}
 */
const icTime = (t) => (settings.icZone ? new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZoneName: "short" }) : fmtTime(t));

/**
 * A shift's times, "8:00 AM – 10:00 PM", the time zone (when shown) only once, at the end.
 * @param {{ start: string, end: string }} x
 * @returns {string}
 */
const icRange = (x) => `${fmtTime(x.start)} – ${icTime(x.end)}`;

/**
 * Who is on a schedule in one cell of the shifts table.
 * @param {Array<{ user: { name: string }, mine: boolean, start: string, end: string }>} list
 * @returns {string}
 */
function shiftCell(list) {
  if (!list.length) return `<span class="empty">No one</span>`;
  return list.map((s) => `<span class="${s.mine ? "me" : ""}"><span class="name" title="${esc(s.user.name)}">${esc(s.user.name)}${s.mine ? " (you)" : ""}</span>`
    + `<span class="time">${icRange(s)}</span></span>`).join("");
}

/**
 * Who is on now, big, with their schedule and when the shift ends.
 * @param {Array<{ user: { name: string }, mine: boolean, schedule: string, end: string }>} onNow
 * @param {number} now
 * @returns {string}
 */
function onNowHtml(onNow, now) {
  if (!onNow.length) return `<div class="now"><span class="label">On now</span><span class="who none">Nobody on shift</span></div>`;
  return onNow.map((x) => `<div class="now"><span class="label">On now</span><span class="who">${esc(x.user.name)}${x.mine ? " (you)" : ""}</span>`
    + `<span class="sub">${esc(x.schedule)} · until ${icTime(x.end)}${startOfDay(x.end) !== startOfDay(now) ? ` ${fmtDay(x.end)}` : ""}</span></div>`).join("");
}

/**
 * The Next line: who takes over and when.
 * @param {{ user: { name: string }, schedule: string, start: string } | undefined} next
 * @param {number} now
 * @returns {string}
 */
function nextHtml(next, now) {
  if (!next) return "";
  const day = startOfDay(next.start) === startOfDay(now) ? "" : `${fmtDay(next.start)}, `;
  return kvHtml("Next", `${esc(next.user.name)} · ${day}${icTime(next.start)}`, "", `${next.schedule}, ${inTime(next.start)}`);
}

/**
 * The Your shift line: on now, the next one, or none coming.
 * @param {{ start: string, end: string } | null} m
 * @param {number} lookahead Days the server looked ahead.
 * @param {number} now
 * @returns {string}
 */
function myShiftHtml(m, lookahead, now) {
  if (!m) return kvHtml("Your shift", `None in ${lookahead} days`);
  if (Date.parse(m.start) <= now) return kvHtml("Your shift", `On now · until ${icTime(m.end)}`, "warn");
  return kvHtml("Your shift", `${fmtDay(m.start)} · ${daysAway(m.start)}`, "accent", icRange(m));
}

/**
 * The shifts after the next one (two unless Settings says otherwise, from the very next when Who's next is off), for
 * a narrow card with room to spare: who, which schedule, and when.
 * @param {Array<{ user: { name: string }, mine: boolean, schedule: string, start: string, end: string }>} upcoming
 *   Every shift still to start, soonest first.
 * @param {number} now
 * @returns {string}
 */
function comingUpHtml(upcoming, now) {
  const from = settings.icNext ? 1 : 0;
  const later = upcoming.slice(from, from + settings.icComingUp);
  if (!later.length) return "";
  const day = (t) => (startOfDay(t) === startOfDay(now) ? "" : `${fmtDay(t)}, `);
  const row = (x) => `<div class="item${x.mine ? " mine" : ""}"><b>${esc(x.user.name)}${x.mine ? " (you)" : ""}</b>`
    + `<span class="sub">${esc(x.schedule)} · ${day(x.start)}${icRange(x)}</span></div>`;
  return `<div class="list roomy narrow-only"><span class="label">Coming up</span>${later.map(row).join("")}</div>`;
}

/**
 * Each day's shifts for every schedule (today and tomorrow, or the days the server read), shown when the card is wide
 * enough.
 * @param {Array<{ name: string, shifts: Array<{ start: string }> }>} schedules
 * @param {number} count How many days.
 * @param {number} now
 * @returns {string}
 */
function shiftsTableHtml(schedules, count, now) {
  const today = startOfDay(now);
  const days = Array.from({ length: count }, (_, i) => {
    const d = startOfDay(today + (i * 24 + 12) * 3600e3);
    return [i === 0 ? "Today" : i === 1 ? "Tomorrow" : fmtDay(d), d];
  });
  const byStartDay = (s, d) => s.shifts.filter((x) => startOfDay(x.start) === d);
  return `<div class="wide-only"><table class="shifts"><thead><tr><th></th>${schedules.map((s) => `<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>`
    + days.map(([label, d]) => `<tr><td class="label">${label}</td>${schedules.map((s) => `<td>${shiftCell(byStartDay(s, d))}</td>`).join("")}</tr>`).join("")
    + `</tbody></table></div>`;
}

/**
 * Draws the Incident Commander card: who is on now, who is next and your shift, then the shifts coming up (on a
 * narrow card with room) or the shifts table (on a wide card).
 */
function renderIc() {
  if (icError?.code === "no-token" || icError?.code === "auth") {
    return gateCard("ic", icErrorHtml(), icError.code === "auth" ? icError.message : "",
      () => withSample(() => [ic, icError, icLoading], ([a, b, c]) => { ic = a; icError = b; icLoading = c; }, SAMPLES.ic(), renderIc));
  }
  if (!ic) return fillCard("ic", icError ? icErrorHtml() : skeleton(4));
  const now = Date.now();
  const all = ic.schedules.flatMap((s) => s.shifts.map((x) => ({ ...x, schedule: s.name })));
  const onNow = all.filter((x) => Date.parse(x.start) <= now && now < Date.parse(x.end));
  const upcoming = all.filter((x) => Date.parse(x.start) > now).sort((a, b) => Date.parse(a.start) - Date.parse(b.start));
  const lines = `${settings.icNext ? nextHtml(upcoming[0], now) : ""}${settings.icMine ? myShiftHtml(ic.myNext, ic.myLookahead, now) : ""}`;
  const table = settings.icTable ? shiftsTableHtml(ic.schedules, ic.days || 2, now) : "";
  fillCard("ic", `${icError ? icErrorHtml() : ""}${onNowHtml(onNow, now)}${lines ? `<hr>${lines}` : ""}`
    + `${comingUpHtml(upcoming, now)}${table}${footHtml(ic.fetchedAt, icLoading)}`);
}

/**
 * Why the on-call schedule didn't load. A missing or refused Datadog token shows the Set up form instead.
 * @returns {string}
 */
function icErrorHtml() {
  if (icError.code === "auth" || icError.code === "no-token") return setupHtml("datadog", icError.code === "auth" ? icError.message : "");
  return `<div class="error">${esc(icError.message)}${ic ? " Showing the last data." : ""}</div>`;
}

/**
 * Loads the on-call schedule.
 * @param {boolean} [fresh] Skip the server's hour-long cache.
 */
async function loadIc(fresh = false) {
  icLoading = true;
  renderIc();
  try {
    ic = await fetchJson(`/api/incident-commander${fresh ? "?fresh=1" : ""}`);
    icError = null;
    saveCache(IC_CACHE, ic);
  } catch (e) {
    icError = { message: e.message || String(e), code: e.code };
  } finally {
    icLoading = false;
    renderIc();
  }
}

/**
 * A card's Set up form.
 * @param {keyof typeof SETUPS} id
 * @param {string} [problem] Why the last try failed, such as a refused token.
 * @returns {string}
 */
function setupHtml(id, problem = "") {
  const s = SETUPS[id];
  const field = (f) => `<label class="setup-field"><span>${esc(f.label)}</span>`
    + `<input class="field" name="${f.name}" type="${f.type || "text"}" value="${esc((typeof f.value === "function" ? f.value() : f.value) || "")}" autocomplete="${f.autocomplete || "off"}" spellcheck="false" required>`
    + `${f.help ? `<small>${esc(f.help)}</small>` : ""}</label>`;
  return `<form class="setup" data-setup="${id}"><div class="setup-head"><b>${esc(s.title)}</b><span>${esc(s.why)}</span></div>`
    + `<ol class="setup-steps">${s.steps.map((t) => `<li>${t}</li>`).join("")}</ol>`
    + `<div class="setup-fields">${s.fields.map(field).join("")}</div>`
    + `<p class="setup-error" role="alert"${problem ? "" : " hidden"}>${esc(problem)}</p>`
    + `<div class="setup-foot"><button class="setup-go" type="submit">${esc(s.button)}</button><span>Checked first, then saved in your Mac's Keychain.</span></div></form>`;
}

/**
 * Felix's loader: his face thinking, what he's doing, and pulsing dots.
 * @param {string} label Like "Checking with Jira".
 * @returns {string}
 */
const loaderHtml = (label) => `<span class="felix-load" role="status">${window.FelixShell.mark("").replace('class="mark"', 'class="mark thinking"')}`
  + `<span>${esc(label)}</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span>`;

$("grid").addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-setup]");
  if (!form) return;
  e.preventDefault();
  const id = form.dataset.setup;
  const go = form.querySelector(".setup-go");
  const err = form.querySelector(".setup-error");
  go.disabled = true;
  go.classList.add("loading");
  go.style.minWidth = `${go.offsetWidth}px`;
  go.innerHTML = loaderHtml(`Checking with ${SETUPS[id].name || "the service"}`);
  form.classList.add("busy");
  err.hidden = true;
  try {
    await window.FelixShell.request(`/api/connect/${SETUPS[id].service || id}`, { fields: Object.fromEntries(new FormData(form)) });
    guideOpen.clear();
    await SETUPS[id].load();
  } catch (problem) {
    err.textContent = problem.message;
    err.hidden = false;
    form.classList.remove("busy");
    go.classList.remove("loading");
    go.disabled = false;
    go.textContent = SETUPS[id].button;
  }
});

// ---------- My Jira Board ----------
const JIRA_CACHE = "felix:jira";
let jira = readCache(JIRA_CACHE);
let jiraError = null;
let jiraLoading = false;

/** Each column's dot, by the kind of statuses it holds. */
const JIRA_TONES = { todo: "var(--faint)", doing: "var(--info)", review: "var(--warn)", blocked: "var(--bad)", done: "var(--ok)" };

/**
 * The sprint's name and how long it has left, or its end date, or the name alone, as Settings says.
 * @param {{ name: string, endDate: string | null }} sprint
 * @returns {string}
 */
function sprintLine(sprint) {
  if (!sprint.endDate || settings.jiraSprint === "name") return esc(sprint.name);
  if (settings.jiraSprint === "end") return `${esc(sprint.name)} · ends ${esc(fmtDay(sprint.endDate))}`;
  const days = Math.ceil((Date.parse(sprint.endDate) - Date.now()) / 86400e3);
  const left = days > 1 ? `${days} days left` : days === 1 ? "ends tomorrow" : days === 0 ? "ends today" : "past its end date";
  return `${esc(sprint.name)} · ${left}`;
}

/**
 * Draws My Jira Board: the Set up form until Jira is connected, else the open sprint and how many of your tickets sit
 * in each of the board's columns, in Jira's own order and names.
 */
function renderJira() {
  if (jiraError?.code === "no-token" || jiraError?.code === "auth") {
    return gateCard("jira", setupHtml("jira", jiraError.code === "auth" ? jiraError.message : ""), jiraError.code === "auth" ? jiraError.message : "",
      () => withSample(() => [jira, jiraError, jiraLoading], ([a, b, c]) => { jira = a; jiraError = b; jiraLoading = c; }, SAMPLES.jira(), renderJira));
  }
  // A copy saved before the card read the board's columns has none: wait for the fresh one.
  if (!jira?.columns) return fillCard("jira", jiraError ? `<div class="error">${esc(jiraError.message)}</div>` : skeleton(4));
  const err = jiraError ? `<div class="error">${esc(jiraError.message)} Showing the last data.</div>` : "";
  if (!jira.sprint) {
    return fillCard("jira", `${err}<div class="sub">No open sprint on ${esc(jira.board.name)}.</div>${footHtml(jira.fetchedAt, jiraLoading)}`);
  }
  // Columns named in Settings stay off the card, and so do empty ones when Settings hides them.
  const hidden = new Set(settings.jiraHide.split("\n").map((n) => n.trim().toLowerCase()).filter(Boolean));
  const columns = jira.columns.filter((c) => !hidden.has(c.name.toLowerCase()) && (settings.jiraEmpty || c.count));
  const counts = columns.map((c) => `<div class="kv${c.count ? "" : " zero"}"><span class="jira-col"><span class="dot" style="background:${JIRA_TONES[c.tone] || JIRA_TONES.doing}"></span>${esc(c.name)}</span><b>${c.count}</b></div>`).join("");
  // How far your part of the sprint is, and your open tickets: in progress, then to do, then code review.
  const pct = jira.total ? Math.round((jira.done / jira.total) * 100) : 0;
  const progress = jira.total && settings.jiraProgress ? `<div class="jira-progress" title="${jira.done} of ${jira.whose === "all" ? "the" : "your"} ${jira.total} tickets in this sprint are done"><div class="bar"><i style="width:${pct}%"></i></div><span>${jira.done} of ${jira.total} done</span></div>` : "";
  const active = jira.active || [];
  const shown = active.slice(0, settings.jiraPlate);
  const jql = encodeURIComponent("assignee = currentUser() AND sprint in openSprints() AND statusCategory != Done ORDER BY status");
  const more = active.length > shown.length ? `<a class="jira-more" href="https://${esc(jira.site)}/issues/?jql=${jql}" target="_blank" rel="noopener">${active.length - shown.length} more in Jira →</a>` : "";
  const plate = active.length && settings.jiraPlate
    ? `<div class="jira-plate-head"><span class="label">On your plate</span>${more}</div><div class="jira-plate">${shown.map((t) => `<a class="jira-ticket" href="${esc(t.url)}" target="_blank" rel="noopener" title="${esc(`${t.key} · ${t.summary} · ${t.column}`)}">`
      + `<span class="dot" style="background:${JIRA_TONES[t.tone] || JIRA_TONES.doing}"></span><span class="key">${esc(t.key)}</span><span class="sum">${esc(t.summary)}</span><span class="col">${esc(t.column)}</span></a>`).join("")}</div>`
    : "";
  const sprint = settings.jiraSprint === "none" ? "" : `<div class="sub">${sprintLine(jira.sprint)}</div>`;
  fillCard("jira", `${err}${sprint}<div class="two jira-counts">${counts}</div>${progress}${plate}`
    + footHtml(jira.fetchedAt, jiraLoading, esc(jira.board.name)));
}

/**
 * Loads My Jira Board, keeping a copy in the browser so the card draws at once next time.
 * @param {boolean} [fresh] Skip the server's cache (a minute, unless Settings says otherwise).
 */
async function loadJira(fresh = false) {
  jiraLoading = true;
  renderJira();
  try {
    jira = await fetchJson(`/api/jira${fresh ? "?fresh=1" : ""}`);
    jiraError = null;
    saveCache(JIRA_CACHE, jira);
  } catch (e) {
    jiraError = { message: e.message || String(e), code: e.code };
    if (e.code === "no-token") jira = null;
  } finally {
    jiraLoading = false;
    renderJira();
  }
}

// ---------- Google sign-in, for Calendar and Team out of office ----------

/**
 * The step after the Google app is saved: sign in, in a small window. Felix asks only to read and answer your
 * calendar events.
 * @param {string} [problem] Why the last sign-in failed.
 * @returns {string}
 */
function googleSignInHtml(problem = "") {
  return `<div class="setup"><div class="setup-head"><b>Sign in with Google</b><span>Use your work account. Felix asks to see your calendar events and answer invites.</span></div>`
    + `<p class="setup-error" role="alert"${problem ? "" : " hidden"}>${esc(problem)}</p>`
    + `<div class="setup-foot"><button class="setup-go" type="button" data-google-signin>Sign in with Google</button>`
    + `<button class="linkbtn" type="button" data-google-app>Use a different Google app</button></div></div>`;
}

const GOOGLE_ROUTE_KEY = "felix:google-route";

/**
 * Why a working Google connection stopped, for the Set up panel; nothing when it was just never set up.
 * @param {{ code?: string, message: string } | null} error
 * @returns {string}
 */
function googleProblem(error) {
  return ["expired", "bridge-access", "bridge-key"].includes(error?.code) ? error.message : "";
}

/**
 * What a Google card shows when it can't read, as a guide: set up the bridge or a Google app, or sign in.
 * @param {{ code?: string, message: string } | null} error
 * @returns {string | null} The guide, or null when the problem is something else.
 */
function googleStepHtml(error) {
  // Two ways in: the Apps Script bridge (the default, as PURE accounts can't make Cloud projects) or your own Google app.
  const app = readCache(GOOGLE_ROUTE_KEY) === "app";
  const other = (route, label) => `<button class="linkbtn google-route" type="button" data-google-route="${route}">${label}</button>`;
  if (error?.code === "bridge-access" || error?.code === "bridge-key") return setupHtml("bridge", error.message) + other("app", "Use a Google Cloud app instead");
  if (error?.code === "no-client") return app ? setupHtml("google") + other("bridge", "Use the Apps Script bridge instead") : setupHtml("bridge") + other("app", "Use a Google Cloud app instead");
  if (error?.code === "not-connected") return googleSignInHtml();
  if (error?.code === "expired") return googleSignInHtml(error.message);
  return null;
}

let bridgeScript = null;

/**
 * A file's text, selected in a dialog, for when the clipboard can't be written.
 * @param {string} name
 * @param {string} text
 */
function showCopyDialog(name, text) {
  const dlg = document.createElement("dialog");
  dlg.className = "team-dlg";
  dlg.innerHTML = `<form method="dialog"><div class="team-head"><b>${esc(name)}</b><span class="sub">Press ⌘C to copy it, then paste it into Apps Script.</span></div>`
    + `<div class="team-list"><textarea class="copy-text" readonly rows="14"></textarea></div><div class="team-foot"><button class="mini primary" value="done">Done</button></div></form>`;
  dlg.querySelector("textarea").value = text;
  document.body.append(dlg);
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
  dlg.querySelector("textarea").select();
}

$("grid").addEventListener("click", async (e) => {
  const route = e.target.closest("[data-google-route]")?.dataset.googleRoute;
  if (route) {
    saveCache(GOOGLE_ROUTE_KEY, route);
    renderCal();
    renderOoo();
    return;
  }
  const copy = e.target.closest("[data-bridge-copy]");
  if (copy) {
    // The script carries Felix's key, so it's fetched from this Mac, not kept in the page.
    const label = copy.textContent;
    try {
      bridgeScript ??= await window.FelixShell.request("/api/google-bridge/script", {});
      await navigator.clipboard.writeText(bridgeScript[copy.dataset.bridgeCopy]);
      copy.textContent = "Copied";
    } catch {
      // The clipboard said no: show the text selected, to copy by hand.
      if (bridgeScript) showCopyDialog(copy.dataset.bridgeCopy === "code" ? "Code.gs" : "appsscript.json", bridgeScript[copy.dataset.bridgeCopy]);
      else copy.textContent = "Couldn't copy";
    }
    setTimeout(() => { copy.textContent = label; }, 2500);
    return;
  }
  if (e.target.closest("[data-google-signin]")) {
    window.open("/api/google/connect/work", "felix-google", "popup,width=520,height=720");
  } else if (e.target.closest("[data-google-app]")) {
    calError = { code: "no-client", message: "" };
    oooError = { code: "no-client", message: "" };
    renderCal();
    renderOoo();
  }
});
$("grid").addEventListener("click", async (e) => {
  // Note opens a short text box under the buttons; whatever's in it goes with Yes, Maybe or No.
  const noteBtn = e.target.closest("[data-rsvp-note]");
  if (noteBtn) {
    const box = noteBtn.parentElement.querySelector(".cal-note");
    box.hidden = !box.hidden;
    noteBtn.setAttribute("aria-expanded", String(!box.hidden));
    if (!box.hidden) box.focus();
    return;
  }
  const b = e.target.closest("[data-rsvp]");
  if (!b) return;
  const group = b.closest(".cal-reply");
  const note = group.querySelector(".cal-note")?.value.trim() || "";
  group.querySelectorAll("button, input").forEach((x) => { x.disabled = true; });
  b.textContent = "Sending…";
  try {
    await window.FelixShell.request("/api/calendar/rsvp", { id: b.dataset.ev, response: b.dataset.rsvp, ...(note ? { note } : {}) });
    await loadCal(true);
  } catch (err) {
    calError = { message: err.message, code: err.code };
    renderCal();
  }
});

// The sign-in window says when it's done; the Google cards reload.
addEventListener("message", (e) => {
  if (e.data?.felix !== "google-signed-in") return;
  if (e.data.ok) { loadCal(true); loadOoo(true); }
  else { calError = { code: "expired", message: e.data.text }; renderCal(); }
});

// ---------- Calendar ----------
const CAL_CACHE = "felix:calendar";
let cal = readCache(CAL_CACHE);
let calError = null;
let calLoading = false;

/**
 * How long until a time, said simply: "in 20 min", "in 1 h 5 min".
 * @param {number} ms
 * @returns {string}
 */
function untilText(ms) {
  const min = Math.max(1, Math.round(ms / 60e3));
  if (min < 60) return `in ${min} min`;
  const h = Math.floor(min / 60);
  return `in ${h} h${min % 60 ? ` ${min % 60} min` : ""}`;
}

/** The answer pills: only the ones that need a look. */
const RESPONSE = { tentative: ["Maybe", ""], needsAction: ["Invited", "warn"], declined: ["Declined", ""] };
const REPLIES = [["accepted", "Yes"], ["tentative", "Maybe"], ["declined", "No"]];

/**
 * Whether the leading event's Join is the main button: always for the next meeting, from some minutes before it
 * starts, or never, as Settings says.
 * @param {{ start: string }} ev
 * @param {number} now
 * @returns {boolean}
 */
function joinStandsOut(ev, now) {
  if (settings.calJoin === "next") return true;
  return settings.calJoin !== "never" && Date.parse(ev.start) - now <= settings.calJoin * 60e3;
}

/**
 * One event row: its time, title (opening it in Google Calendar), its answer if it needs a look, and Join when it
 * has a meeting link. The one on now or next is highlighted, with Join as the main button (when Settings says so).
 * @param {{ title: string, start: string, end: string, allDay: boolean, join: string | null, link: string, response: string | null }} ev
 * @param {boolean} lead
 * @param {number} now
 * @returns {string}
 */
function calRowHtml(ev, lead, now) {
  const past = !ev.allDay && Date.parse(ev.end) <= now;
  const when = ev.allDay ? "All day" : fmtTime(ev.start).replace(/\s?[AP]M$/i, "");
  // An invite you haven't answered gets Yes, Maybe and No when the bridge can send replies.
  const reply = cal?.canReply && settings.calReplies && ev.response === "needsAction" && !past
    ? `<span class="cal-reply" role="group" aria-label="Reply to ${esc(ev.title)}">${REPLIES.map(([r, label]) => `<button type="button" class="mini" data-rsvp="${r}" data-ev="${esc(ev.id)}">${label}</button>`).join("")}`
      + `<button type="button" class="mini quiet" data-rsvp-note aria-expanded="false" title="Add a short note to your reply">Note</button>`
      + `<input class="field cal-note" type="text" maxlength="500" placeholder="A note for the organizer (optional)" aria-label="Note with your reply" hidden></span>` : "";
  const pill = reply || (RESPONSE[ev.response] ? `<span class="pill plain ${RESPONSE[ev.response][1]}">${RESPONSE[ev.response][0]}</span>` : "");
  const join = ev.join && !past ? `<a class="${lead && joinStandsOut(ev, now) ? "mini primary" : "mini"}" href="${esc(ev.join)}" target="_blank" rel="noopener">Join</a>` : "";
  return `<div class="cal-row${lead ? " lead" : ""}${past ? " past" : ""}${reply ? " ask" : ""}"><span class="cal-time">${esc(when)}</span>`
    + `<a class="cal-title" href="${esc(ev.link)}" target="_blank" rel="noopener" title="Open in Google Calendar">${esc(ev.title)}</a>${pill}${join}</div>`;
}

/**
 * Draws the Calendar card: the Google setup step until it can read, else today's events with the next one leading,
 * a countdown in the header, and the days after (tomorrow, unless Settings says otherwise) under them when there's
 * room. Settings also leaves out past meetings, all-day events and the ones you declined.
 */
function renderCal() {
  const tools = $("cal-tools");
  const step = googleStepHtml(calError);
  if (step) {
    return gateCard("cal", step, googleProblem(calError),
      () => withSample(() => [cal, calError, calLoading], ([a, b, c]) => { cal = a; calError = b; calLoading = c; }, SAMPLES.cal(), renderCal));
  }
  if (!cal) return fillCard("cal", calError ? `<div class="error">${esc(calError.message)}</div>` : skeleton(4));
  const now = Date.now();
  const tomorrow = startOfDay(now) + 86400e3;
  const shown = cal.events.filter((e) => (settings.calAllDay || !e.allDay) && (settings.calDeclined || e.response !== "declined")
    && (settings.calPast || e.allDay || Date.parse(e.end) > now));
  const today = shown.filter((e) => Date.parse(e.start) < tomorrow);
  const dayStart = (i) => startOfDay(tomorrow + (i - 1) * 86400e3 + 12 * 3600e3);
  const onDay = (i) => shown.filter((e) => Date.parse(e.start) >= dayStart(i) && Date.parse(e.start) < dayStart(i + 1));
  const nextDay = onDay(1);
  const lead = today.find((e) => !e.allDay && e.response !== "declined" && Date.parse(e.end) > now);
  if (tools && !settings.calCountdown) tools.textContent = "";
  else if (tools) {
    const on = lead && Date.parse(lead.start) <= now;
    tools.innerHTML = lead ? `<span class="cal-next">${on ? "On now" : `Next ${untilText(Date.parse(lead.start) - now)}`}</span>` : "";
  }
  const err = calError ? `<div class="error">${esc(calError.message)} Showing the last events.</div>` : "";
  const list = today.length ? today.map((e) => calRowHtml(e, e === lead, now)).join("") : `<p class="sub">Nothing on your calendar today.</p>`;
  const later = Array.from({ length: settings.calDays - 1 }, (_, i) => {
    const events = onDay(i + 1);
    return events.length
      ? `<div class="list roomy"><span class="label">${i ? esc(fmtDay(dayStart(i + 1))) : "Tomorrow"}</span>${events.map((e) => calRowHtml(e, false, now)).join("")}</div>` : "";
  }).join("");
  const note = settings.calDays < 2 ? "" : `Tomorrow: ${nextDay.length ? `${nextDay.length} event${nextDay.length === 1 ? "" : "s"}` : "nothing yet"}`;
  fillCard("cal", `${err}<div class="cal-rows">${list}</div>${later}${footHtml(cal.fetchedAt, calLoading, esc(note))}`);
}

/**
 * Loads the calendar, keeping a copy in the browser so the card draws at once next time.
 * @param {boolean} [fresh] Skip the server's cache (5 minutes, unless Settings says otherwise).
 */
async function loadCal(fresh = false) {
  calLoading = true;
  renderCal();
  try {
    cal = await fetchJson(`/api/calendar${fresh ? "?fresh=1" : ""}`);
    calError = null;
    saveCache(CAL_CACHE, cal);
  } catch (e) {
    calError = { message: e.message || String(e), code: e.code };
    if (["no-client", "not-connected"].includes(e.code)) cal = null;
  } finally {
    calLoading = false;
    renderCal();
  }
}
// The countdown and the highlighted event move on with the clock.
setInterval(() => { if (cal && settings.mode === "work") renderCal(); }, 60e3);

/**
 * A card's empty state: its drawing and one short line.
 * @param {keyof typeof ILLUSTRATIONS} kind
 * @param {string} text Markup.

const emptyHtml = (kind, text) => `<div class="empty-state"><svg viewBox="0 0 96 72" aria-hidden="true">${ILLUSTRATIONS[kind] || ILLUSTRATIONS.search}</svg><p>${text}</p></div>`;

// ---------- Slack ----------
const SLACK_CACHE = "felix:slack";
let slack = readCache(SLACK_CACHE);
let slackError = null;
let slackLoading = false;

/**
 * When a message was sent, short: "9:42 AM" today, else "Wed 9:42 AM".
 * @param {string} iso
 * @returns {string}
 */
const slackWhen = (iso) => startOfDay(iso) === startOfDay(Date.now()) ? fmtTime(iso) : `${new Date(iso).toLocaleDateString([], { weekday: "short" })} ${fmtTime(iso)}`;

/**
 * One message row: who, where and when on top, the words under, the whole row opening it in Slack.
 * @param {{ who: string, where: string, text: string, at: string, link: string }} m
 * @returns {string}
 */
const slackRowHtml = (m) => `<a class="slack-msg" href="${esc(m.link || slack?.me?.url || "https://app.slack.com/client")}" target="_blank" rel="noopener" title="Open in Slack">`
  + `<span class="face">${esc((m.who || "?").charAt(0).toUpperCase())}</span><span class="slack-text"><span class="slack-top"><b>${esc(m.who || "Someone")}</b>`
  + `<span class="sub">in ${esc(m.where)} · ${esc(slackWhen(m.at))}</span></span><span class="slack-body">${esc(m.text)}</span></span></a>`;

/**
 * Draws the Slack card: Connect Slack until a token works, else your mentions, saved for later, and the channels you
 * watch with their unread counts.
 */
function renderSlack() {
  if (["no-token", "auth", "scope"].includes(slackError?.code)) {
    const problem = slackError.code === "no-token" ? "" : slackError.message;
    return gateCard("slack", setupHtml("slack", problem), problem,
      () => withSample(() => [slack, slackError, slackLoading], ([a, b, c]) => { slack = a; slackError = b; slackLoading = c; }, SAMPLES.slack(), renderSlack));
  }
  if (!slack?.mentions) return fillCard("slack", slackError ? `<div class="error">${esc(slackError.message)}</div>` : skeleton(5));
  const err = slackError ? `<div class="error">${esc(slackError.message)} Showing the last messages.</div>` : "";
  const days = settings.slackDays || 3;
  const mentions = slack.mentions.length
    ? `<div class="slack-list">${slack.mentions.slice(0, 5).map(slackRowHtml).join("")}</div>`
      + (slack.mentions.length > 5 ? `<a class="slack-more" href="${esc(slack.me.url || "https://app.slack.com/client")}activity" target="_blank" rel="noopener">${slack.mentions.length - 5} more in Slack →</a>` : "")
    : emptyHtml("mentions", `Nobody mentioned you in the last ${days === 1 ? "day" : `${days} days`}.`);
  const saved = slack.saved === null ? ""
    : `<hr><span class="label">Saved for later${slack.saved.length ? ` <span class="n">${slack.saved.length}</span>` : ""}</span>`
      + (slack.problems?.saved ? `<p class="sub">${esc(slack.problems.saved)}</p>` : slack.saved.length ? `<div class="slack-list">${slack.saved.slice(0, 3).map(slackRowHtml).join("")}</div>` : `<p class="sub">Nothing saved.</p>`);
  const watching = slack.unread.length || slack.missing.length || slack.problems?.unread;
  const unread = watching
    ? `<hr><span class="label">Channels you watch</span>${slack.problems?.unread ? `<p class="sub">${esc(slack.problems.unread)}</p>` : ""}`
      + slack.unread.map((u) => `<a class="kv slack-kv${u.count ? "" : " quiet"}" href="${esc(u.link)}" target="_blank" rel="noopener"><span>#${esc(u.channel)}</span><b>${u.count ? `${u.count >= 100 ? "100+" : u.count} new` : "All read"}</b></a>`).join("")
      + (slack.missing.length ? `<p class="sub">You're not in ${slack.missing.map((c) => `#${esc(c)}`).join(", ")}.</p>` : "")
    : `<hr><a class="slack-more" href="/settings#slack">Pick channels to watch →</a>`;
  fillCard("slack", `${err}<span class="label">Mentions${slack.mentions.length ? ` <span class="n">${slack.mentions.length}</span>` : ""}</span>${mentions}${saved}${unread}`
    + footHtml(slack.fetchedAt, slackLoading, esc(slack.me.team || "")));
}
