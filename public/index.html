<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open PRs · fm + bm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232563EB' d='M5 3.25a2.25 2.25 0 1 1-3 2.12v5.26a2.25 2.25 0 1 1 1.5 0V5.37A2.25 2.25 0 0 1 5 3.25Zm6.5 7.38V6.5A1.5 1.5 0 0 0 10 5H8.56l1.22 1.22-1.06 1.06L5.69 4.25l3.03-3.03 1.06 1.06L8.56 3.5H10a3 3 0 0 1 3 3v4.13a2.25 2.25 0 1 1-1.5 0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/pr-status.js"></script>
<style>
/* Layout: list column on the left; the PR details panel takes the right half of the screen when open.
   Colors and type come from /theme.css. */
.main { padding: 16px 16px 64px; }
body.panel-open .main, body.panel-empty .main { margin-right: 50vw; }
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; container-type: inline-size; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 22px; font-weight: 600; }
header .who { color: var(--muted); font-family: var(--mono); font-size: 13px; }
header .spacer { flex: 1; }
header .home { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; color: var(--muted); }
header .home:hover { background: var(--surface); color: var(--fg); }
header .home svg { width: 18px; height: 18px; }
.updated { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.refresh {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px; border: 0; border-radius: 6px;
  background: var(--accent); color: #fff; cursor: pointer;
}
.refresh:hover { background: var(--accent-hover); }
.bell { height: 36px; padding: 0 12px; font-size: 13px; }
/* Narrow list column: the bell shows just its icon (its tooltip keeps the words) so the header stays on one line. */
@container (max-width: 760px) { .bell { width: 36px; padding: 0; justify-content: center; } .bell span { display: none; } .bell svg { width: 16px; height: 16px; } }
.bell[data-state="on"] { color: var(--ok); border-color: var(--ok); }
.bell[data-state="blocked"] { color: var(--bad); }
.refresh svg { width: 18px; height: 18px; }
.refresh.spinning svg, .spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .refresh.spinning svg, .spin { animation: none; } }

/* Tabs on the left, the Claude model picker at the right end of the same row */
.tabs-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
.tabs-row .model { margin-left: auto; padding-bottom: 4px; }
.tabs-row .model select { height: 32px; }
.tabs a {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 10px 14px; margin-bottom: -1px; text-decoration: none;
  border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap;
}
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .n { padding: 0 7px; border-radius: 999px; background: var(--neutral-bg); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs a[aria-current="page"] .n { background: var(--accent-bg); }
.sub { margin: -8px 0 0; color: var(--muted); }

.banner { padding: 10px 14px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); }
.banner code { font-family: var(--mono); }

.toolbar { display: grid; gap: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { position: relative; flex: 1 1 260px; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; height: 36px; padding: 0 64px 0 34px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-bg); }
.search .hint {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
}
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: var(--neutral-bg); border-radius: 4px; padding: 1px 6px; font-size: 12px; cursor: pointer; color: var(--muted);
}
.seg { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 2px; }
.seg button {
  border: 0; background: none; padding: 0 12px; height: 30px; border-radius: 4px; cursor: pointer; color: var(--muted);
  font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg .n { opacity: 0.75; margin-left: 4px; }
.sort { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.sort select { height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; color: var(--muted); cursor: pointer;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.zero { opacity: 0.55; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); opacity: 1; }
.chip[aria-pressed="true"] b { color: var(--accent); }
.filters .spacer { flex: 1; }
.linkbtn { border: 0; background: none; padding: 4px 2px; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; }
.showing { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

#repos { display: grid; gap: 20px; }
section { display: grid; gap: 8px; }
section h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
section h2 .repo { font-family: var(--mono); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
section h2 .count { margin-left: auto; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; }
section h2 a { text-decoration: none; }
section h2 a:hover { color: var(--accent); }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; container-type: inline-size; }
/* When the list is narrow (panel open, small window), buttons go under the title instead of squeezing it. */
@container (max-width: 640px) {
  .list .pr { grid-template-columns: minmax(0, 1fr); }
  .list .pr .num { display: flex; gap: 8px; }
  .list .pr .meta, .list .pr .pills { grid-column: 1; }
  .list .pr .head { flex-direction: column; gap: 8px; }
  .list .pr .actions { justify-content: flex-start; order: 2; }
}
.pr {
  display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 12px;
  padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer;
  box-shadow: inset 3px 0 0 transparent;
}
.pr:first-child { border-top: 0; }
.pr:hover { background: color-mix(in srgb, var(--accent-bg) 45%, transparent); }
.pr.selected { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.pr .num { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 1px; display: grid; align-content: start; gap: 2px; }
.pr .num .rk { font-family: var(--sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.pr .head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.pr .title { flex: 1; min-width: 0; font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.pr .title:hover { color: var(--accent); }
.pr .meta { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.author b { font-weight: 500; color: var(--fg); }
.pr .branch { font-family: var(--mono); overflow-wrap: anywhere; }
.size { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.add { color: var(--ok); }
.del { color: var(--bad); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.pills { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--neutral-bg); color: var(--muted);
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.alert { background: var(--alert-bg); color: var(--alert); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.run { background: var(--accent-bg); color: var(--accent); }
.pill.run::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.pill.claude { font-weight: 600; }
.ticket {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 999px; border: 1px solid var(--accent);
  color: var(--accent); font-family: var(--mono); font-size: 12px; font-weight: 500; text-decoration: none;
}
.ticket svg { width: 12px; height: 12px; }
.ticket:hover { background: var(--accent-bg); }
.tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }

.actions { flex: none; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none;
  white-space: nowrap;
}
.btn svg { width: 13px; height: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); color: #fff; }
.btn.done { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.btn.confirm { border-color: var(--bad); color: #fff; background: var(--bad); }
/* Batch review: row checkboxes and the selection bar */
.pick { display: inline-flex; align-items: center; margin-bottom: 2px; cursor: pointer; }
.pick input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-bg); font-size: 13px; }
/* Fix with Claude */
.answer:disabled { opacity: 0.5; cursor: not-allowed; }
.custom-fix { display: grid; gap: 8px; }
.custom-fix textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); resize: vertical; }
.custom-fix textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.custom-fix .row { justify-content: flex-end; }
.local-model select { height: 30px; }
.fix-files { display: grid; gap: 10px; }
details.file > summary { list-style: none; }
details.file > summary::-webkit-details-marker { display: none; }
details.file > summary .chev { transition: transform 0.15s; }
details.file[open] > summary .chev { transform: rotate(90deg); }
.warnbox { padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.another { border-top: 1px solid var(--line); padding-top: 12px; }
.another > summary { cursor: pointer; font-weight: 500; }
.btn:disabled { opacity: 0.6; cursor: progress; }

.empty { padding: 20px 16px; color: var(--muted); text-align: center; }
/* Loading: placeholder shapes that match real rows, with a soft shimmer */
.sk {
  display: block; height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--neutral-bg) 30%, color-mix(in srgb, var(--neutral-bg) 45%, var(--surface)) 50%, var(--neutral-bg) 70%);
  background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.skeleton .pr { cursor: default; }
.skeleton .pr:hover { background: none; }
.skeleton .head { display: grid; gap: 8px; }
.sk.pillsk { display: inline-block; width: 84px; height: 18px; border-radius: 999px; }
.chip.sk-chip { width: 120px; height: 30px; padding: 0; border-color: transparent; border-radius: 999px; cursor: default; }
.chip.sk-chip::before { display: none; }
.tabs .n.sk { display: inline-block; width: 22px; height: 16px; }
.loadbar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 30; overflow: hidden; }
.loadbar::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent);
  animation: loadbar 1.1s ease-in-out infinite;
}
@keyframes loadbar { from { left: -30%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .loadbar::after { animation: none; left: 0; width: 100%; opacity: 0.5; } }
.stale { color: var(--warn); }

/* Details panel: right half of the screen */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 50vw; z-index: 20;
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -8px 0 24px rgba(41, 46, 63, 0.08);
}
.panel-head { padding: 16px 20px 0; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.panel-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.panel-top .id { font-family: var(--mono); font-weight: 500; color: var(--fg); }
.panel-top .spacer { flex: 1; }
.close { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 22px; line-height: 1; }
.close:hover { background: var(--neutral-bg); color: var(--fg); }
.panel h2 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.panel .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
.panel .meta .branch { font-family: var(--mono); }
.panel .pills { padding: 0; grid-column: auto; }
.ptabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 4px; }
.ptabs button {
  border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.ptabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.ptabs .n { font-size: 12px; opacity: 0.8; margin-left: 4px; }
/* max-content rows: items that clip their own overflow (file boxes, check lists) must keep full height; the body scrolls. */
/* One column that never grows past the panel: wide things (terminal, diffs, tables) scroll inside themselves. */
.panel-body {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 20px 48px;
  display: grid; gap: 18px; align-content: start; grid-auto-rows: max-content; grid-template-columns: minmax(0, 1fr);
}
.panel-body > * { min-width: 0; }
.panel-body h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.loading { color: var(--muted); }

.md { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { font-size: 15px; margin: 18px 0 6px; text-transform: none; letter-spacing: 0; color: var(--fg); }
.md h1, .md h2 { font-size: 16px; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 22px; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md img { max-width: 100%; }
.md a { color: var(--accent); }
.md hr { border: 0; border-top: 1px solid var(--line); }

.panel-body { container-type: inline-size; }
.state { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; background: #047857; }
.state.draft { background: #748095; }
.state.merged { background: #82517D; }
.state.closed { background: #B91C1C; }
.state-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--muted); font-size: 13px; }
.state-line b { color: var(--fg); font-weight: 500; }
.ref { font-family: var(--mono); font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.panel h2 .n { color: var(--muted); font-weight: 400; }
.ptabs .diffstat { margin-left: auto; align-self: center; font-family: var(--mono); font-size: 12px; white-space: nowrap; padding: 0 4px; }

/* Conversation: thread on the left, GitHub-style sidebar on the right (stacks when narrow) */
.convo { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: start; }
@container (max-width: 760px) { .convo { grid-template-columns: minmax(0, 1fr); } }
.thread { display: grid; gap: 12px; min-width: 0; }
.side { display: grid; gap: 14px; font-size: 13px; }
.side > div { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.side h3 { margin-bottom: 8px; }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.people li { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.people .who { font-weight: 500; overflow-wrap: anywhere; }
.none { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.label { display: inline-block; margin: 0 4px 4px 0; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--lc); background: color-mix(in srgb, var(--lc) 18%, transparent); }
.event { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.event-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: var(--code-bg); font-size: 12px; color: var(--muted); }
.event-head b { color: var(--fg); font-weight: 500; }
.event-head a { margin-left: auto; color: var(--muted); display: inline-flex; }
.event-head a svg { width: 13px; height: 13px; }
.event > .md { padding: 10px 12px; }
.code-comments { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 10px; }
.cc { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.cc-path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: var(--code-bg); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.cc-body { padding: 8px 10px; display: grid; gap: 4px; font-size: 13px; }
.cc-body + .cc-body { border-top: 1px solid var(--line); }
.cc-body b { font-weight: 500; }

/* Commits and checks */
.rows { list-style: none; margin: 0 0 14px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.rows li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.rows li:first-child { border-top: 0; }
.rows .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rows .grow a { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.rows .grow a:hover { color: var(--accent); text-decoration: underline; }
.rows code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.check-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.check-dot.passed { background: var(--ok); }
.check-dot.failed { background: var(--bad); }
.check-dot.pending { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.check-dot.skipped { background: transparent; border: 2px solid var(--muted); }
.check-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

/* Files changed: one box per file with its diff */
.files-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.files-bar .spacer { flex: 1; }
.file { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.file-head { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 0; background: var(--code-bg); }
.file-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 0 8px 12px; border: 0; background: none; cursor: pointer; text-align: left; }
.file-head .name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.file-head .st { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.file-head .size { font-size: 12px; white-space: nowrap; }
.file-head a { color: var(--muted); display: inline-flex; }
.file-head a svg, .chev { width: 13px; height: 13px; flex: none; }
.chev { color: var(--muted); transition: transform 0.15s; }
.file-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.diff-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
.diff { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.diff td { padding: 0 8px; vertical-align: top; white-space: pre; }
.diff td.ln { width: 1%; min-width: 44px; text-align: right; color: var(--muted); user-select: none; border-right: 1px solid var(--line); }
.diff tr.add { background: color-mix(in srgb, var(--ok-bg) 80%, transparent); }
.diff tr.del { background: color-mix(in srgb, var(--bad-bg) 80%, transparent); }
.diff tr.hunk td { background: var(--accent-bg); color: var(--muted); padding-block: 2px; }
.diff .sign { user-select: none; color: var(--muted); padding-right: 6px; }
.diff tr.add .sign { color: var(--ok); }
.diff tr.del .sign { color: var(--bad); }
.diff-missing { padding: 12px; color: var(--muted); font-size: 13px; }

.claude-box { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.claude-box .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.claude-box .note { color: var(--muted); font-size: 13px; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.progress .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-top-color: transparent; }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.answer { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; display: grid; gap: 2px; }
.answer b { font-weight: 600; }
.answer span { font-size: 12px; color: var(--muted); }
.answer:hover { border-color: var(--accent); }
.answer.confirm { border-color: var(--bad); background: var(--bad-bg); }
.answer.confirm b, .answer.confirm span { color: var(--bad); }
.answer:disabled { opacity: 0.6; cursor: progress; }
.cost { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel-body h3 .cost { text-transform: none; letter-spacing: 0; font-weight: 400; }
/* Terminal look for the live view in both themes: the screen is plain text from tmux. */
.term {
  margin: 0; max-height: 420px; overflow: auto; padding: 12px 14px; border-radius: 8px;
  background: #1E293B; color: #E2E8F0; border: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre;
}
/* Sub-tabs inside the Claude review tab */
.subtabs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); justify-self: start; }
.subtabs button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
.subtabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.subtabs .n { font-size: 12px; opacity: 0.8; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
.term { max-height: calc(100vh - 330px); min-height: 240px; }
.steps { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 2px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; }
.steps li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; padding: 2px 0; overflow-wrap: anywhere; }
.steps .t { color: var(--muted); font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.steps li.you { color: var(--accent); }
.steps li.done { color: var(--ok); font-weight: 500; }
.steps li.error { color: var(--bad); }
.steps li.wait { color: var(--warn); }

.panel-empty-state { margin: auto; padding: 24px; max-width: 380px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--muted); }
.panel-empty-state svg { width: 40px; height: 40px; color: var(--line); }
.panel-empty-state h2 { color: var(--fg); font-size: 17px; }
.panel-empty-state p { margin: 0; }
.glance { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.glance a { display: block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--fg); }
.glance a:hover { border-color: var(--accent); color: var(--accent); }
.glance b { font-variant-numeric: tabular-nums; }
.keys { font-size: 12px; }
kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; margin: 0 2px 0 8px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--fg); }
kbd:first-child { margin-left: 0; }

@media (max-width: 900px) {
  .panel { width: 100vw; }
  .panel.empty { display: none; }
  body.panel-open .main, body.panel-empty .main { margin-right: 0; }
  body.panel-open { overflow: hidden; }
}
@media (max-width: 560px) {
  .main { padding-top: 12px; }
  .pr { grid-template-columns: minmax(0, 1fr); }
  .pr .num { display: flex; gap: 8px; }
  .pr .meta, .pills { grid-column: 1; }
  .search .hint { display: none; }
}

/* Dropdowns: our own button + menu over a hidden native select */
.dd-native { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.dd-btn {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
  height: 36px; min-width: 120px; padding: 0 10px 0 12px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  color: var(--fg); font-size: 13px; text-align: left; cursor: pointer; white-space: nowrap;
}
.dd-btn:hover { border-color: var(--accent); }
.dd-btn[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.dd-btn svg { width: 14px; height: 14px; flex: none; color: var(--muted); transition: transform 0.15s; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.tabs-row .model .dd-btn, .local-model .dd-btn { height: 32px; }
.dd-menu {
  position: fixed; z-index: 60; padding: 4px; max-height: 320px; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(41, 46, 63, 0.18);
}
.dd-item {
  display: flex; align-items: center; gap: 6px; padding: 7px 12px 7px 6px; border-radius: 6px;
  font-size: 13px; color: var(--fg); cursor: pointer; white-space: nowrap;
}
.dd-item:hover, .dd-item:focus { background: var(--accent-bg); outline: none; }
.dd-item[aria-selected="true"] { color: var(--accent); font-weight: 500; }
.dd-check { width: 16px; height: 16px; flex: none; display: inline-grid; place-items: center; }
.dd-check svg { width: 14px; height: 14px; }
@media (prefers-reduced-motion: reduce) { .dd-btn svg { transition: none; } }
</style>
</head>
<body>
<div class="loadbar" id="loadbar" hidden></div>
<div class="main">
<div class="wrap">
  <header>
    <a class="home" href="/" title="Command center" aria-label="Back to the command center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
    </a>
    <h1>Open PRs</h1>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <span class="updated" id="updated">Loading your PRs from GitHub…</span>
    <button class="btn bell" id="bell" type="button" hidden></button>
    <button class="refresh" id="refresh" type="button" title="Refresh (R)" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </header>

  <div class="tabs-row">
  <nav class="tabs" id="tabs" aria-label="Lists"></nav>
  <label class="sort model" title="Model used when you start a Claude review">Claude model
        <select id="model">
          <option value="">Default</option>
          <option value="opus">Opus 5.5</option>
          <option value="sonnet">Sonnet 5.5</option>
          <option value="haiku">Haiku 5.5</option>
          <option value="fable">Fable 5.1</option>
        </select>
  </label>
  </div>
  <p class="sub" id="subheading"></p>

  <div class="banner" id="error" hidden></div>

  <div class="toolbar">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search title, branch, PMHUB key, #number, person" aria-label="Search PRs">
        <span class="hint" id="hint">/</span>
        <button class="clear" id="clearq" type="button" hidden>Clear</button>
      </label>
      <div class="seg" id="repo" role="group" aria-label="Repository"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="attention">Needs attention first</option>
          <option value="updated">Recently updated</option>
          <option value="stale">Least recently updated</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="largest">Largest</option>
          <option value="smallest">Smallest</option>
          <option value="number">PR number</option>
        </select>
      </label>
    </div>
    <div class="filters">
      <div class="filters" id="chips" role="group" aria-label="Status filters"></div>
      <button class="linkbtn" id="reset" type="button" hidden>Clear filters</button>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" id="grouped" aria-pressed="true">By repo</button>
        <button type="button" id="flat" aria-pressed="false">One list</button>
      </div>
    </div>
    <div class="selbar" id="selbar" hidden></div>
    <span class="showing" id="showing"></span>
  </div>

  <div id="repos" aria-busy="true"></div>
</div>
</div>

<aside class="panel" id="panel" hidden aria-label="PR details"></aside>

<script>
const $ = (id) => document.getElementById(id);
const REPO_LABEL = { fm: "frontend-monorepo", bm: "backend-monorepo" };
const REPO_KEY = { "purepm/frontend-monorepo": "fm", "purepm/backend-monorepo": "bm" };
const JIRA = "https://purepm.atlassian.net/browse/";
const ICON = {
  ticket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6Z"/><path d="M14 5v14" stroke-dasharray="2 2"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`,
  userMinus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/></svg>`,
  spark: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>`,
  stop: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>`,
  external: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>`,
};

const TABS = [
  { id: "mine", label: "My PRs", sub: "Your open PRs in frontend-monorepo and backend-monorepo.",
    ghQuery: (login) => `is:pr is:open author:${login}`, empty: "You have no open PRs in fm or bm." },
  { id: "review", label: "Needs my review", sub: "Other people's open PRs where you are added as a reviewer, plus ones you reviewed here with Claude.",
    ghQuery: (login) => `is:pr is:open user-review-requested:${login}`, empty: "Nobody is waiting on your review right now." },
];

// The skill's own posting choices (review-pr Step 5).
const ANSWERS = [
  { id: "A", label: "Post suggested verdict", note: "Approves or requests changes on GitHub", posts: true },
  { id: "B", label: "Comment issues only", note: "Posts the issues as comments, no verdict", posts: true },
  { id: "C", label: "Comment issues + verdict", note: "Posts the issues and the verdict", posts: true },
  { id: "D", label: "Do nothing", note: "Keeps the review here only", posts: false },
];

// ---------- State and URL ----------
// Path picks the list (/prs/mine or /prs/review). Search params hold the rest, so any view can be bookmarked:
// ?q=portal&repo=fm&sort=oldest&status=failing,conflict&view=list&pr=fm-12247&panel=files
const DEFAULT_VIEW = { tab: "mine", q: "", repo: "all", sort: "attention", statuses: [], group: true, pr: null, panel: "conversation" };
let view = { ...DEFAULT_VIEW };
let data = null;
let reviews = {};
let loading = false;
const details = new Map(); // "fm-12247" -> { loading, data, error }

function readUrl() {
  const p = new URLSearchParams(location.search);
  view = {
    tab: location.pathname.startsWith("/prs/review") ? "review" : "mine",
    q: p.get("q") || "",
    repo: ["fm", "bm"].includes(p.get("repo")) ? p.get("repo") : "all",
    sort: SORTS[p.get("sort")] ? p.get("sort") : "attention",
    statuses: (p.get("status") || "").split(",").filter((s) => STATUSES.some((x) => x.id === s)),
    group: p.get("view") !== "list",
    pr: /^(fm|bm)-\d+$/.test(p.get("pr") || "") ? p.get("pr") : null,
    panel: PANEL_TABS.includes(p.get("panel")) ? p.get("panel") : "conversation",
  };
}

function urlFor(v) {
  const p = new URLSearchParams();
  if (v.q) p.set("q", v.q);
  if (v.repo !== "all") p.set("repo", v.repo);
  if (v.sort !== "attention") p.set("sort", v.sort);
  if (v.statuses.length) p.set("status", v.statuses.join(","));
  if (!v.group) p.set("view", "list");
  if (v.pr) p.set("pr", v.pr);
  if (v.pr && v.panel !== "conversation") p.set("panel", v.panel);
  const qs = p.toString().replace(/%2C/g, ",");
  return `/prs/${v.tab}${qs ? `?${qs}` : ""}`;
}

// Tab and panel changes add a history entry (Back undoes them); filter typing just replaces it.
function update(patch, { push = false } = {}) {
  view = { ...view, ...patch };
  const url = urlFor(view);
  if (url !== location.pathname + location.search) history[push ? "pushState" : "replaceState"](null, "", url);
  render();
}

window.addEventListener("popstate", () => { readUrl(); $("q").value = view.q; render(); });

// ---------- Helpers ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  const m = s / 60; if (m < 60) return `${Math.floor(m)}m ago`;
  const h = m / 60; if (h < 24) return `${Math.floor(h)}h ago`;
  const d = h / 24; if (d < 30) return `${Math.floor(d)}d ago`;
  return new Date(iso).toLocaleDateString();
}

function duration(ms) {
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

// Same size buckets as the PR Slack post.
function sizeLabel(lines) {
  if (lines < 50) return "XS";
  if (lines < 100) return "S";
  if (lines < 500) return "M";
  if (lines < 1000) return "L";
  return "XL";
}

// GitHub already sanitizes its HTML; DOMPurify is a second guard. Without it, show plain text.
function safeHtml(html) {
  return window.DOMPurify ? DOMPurify.sanitize(html, { ADD_ATTR: ["target"] }) : esc(html.replace(/<[^>]+>/g, ""));
}

function markdown(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  return `<pre>${esc(text)}</pre>`;
}

function prKey(p) {
  return `${p.repoKey}-${p.number}`;
}

// The rules live in /pr-status.js so the home page counts PRs the same way.
const { needsReview } = PrStatus;
const claudeState = (p) => PrStatus.claudeState(p, reviews);
const fixState = (p) => PrStatus.fixState(p, reviews);

// Status filters. A PR shows when it matches ANY selected status. `only` limits a filter to one tab.
const STATUSES = [
  { id: "claude-running", only: "review", label: "Claude reviewing", color: "var(--accent)", test: (p) => claudeState(p)?.id === "running" },
  { id: "claude-ready", only: "review", label: "Needs your action", color: "var(--warn)", test: (p) => claudeState(p)?.id === "ready" },
  { id: "new-commits", only: "review", label: "New commits", color: "var(--alert)", test: (p) => Boolean(p.newCommits) },
  { id: "fix-ready", only: "mine", label: "Fix needs you", color: "var(--warn)", test: (p) => fixState(p)?.id === "ready" },
  { id: "needs", label: "Need review", color: "var(--warn)", test: (p) => needsReview(p) },
  { id: "approved", label: "Approved", color: "var(--ok)", test: (p) => p.reviewDecision === "APPROVED" },
  { id: "changes", label: "Changes requested", color: "var(--alert)", test: (p) => p.changesRequestedBy.length > 0 },
  { id: "failing", label: "Checks failing", color: "var(--bad)", test: (p) => p.checks.state === "failing" },
  { id: "running", label: "Checks running", color: "var(--accent)", test: (p) => p.checks.state === "pending" },
  { id: "conflict", label: "Conflicts", color: "var(--bad)", test: (p) => p.mergeable === "CONFLICTING" },
  { id: "draft", label: "Drafts", color: "var(--muted)", test: (p) => p.isDraft },
];

// Lower rank = needs your attention sooner.
function attentionRank(p) {
  const c = claudeState(p)?.id;
  if (c === "ready" || p.newCommits) return -1;
  if (p.checks.state === "failing" || p.mergeable === "CONFLICTING" || p.changesRequestedBy.length) return 0;
  if (p.isDraft) return 4;
  if (p.reviewDecision === "APPROVED") return 1;
  if (p.checks.state === "pending") return 3;
  return 2;
}

const SORTS = {
  attention: (a, b) => attentionRank(a) - attentionRank(b) || b.updatedAt.localeCompare(a.updatedAt),
  updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt),
  stale: (a, b) => a.updatedAt.localeCompare(b.updatedAt),
  newest: (a, b) => b.createdAt.localeCompare(a.createdAt),
  oldest: (a, b) => a.createdAt.localeCompare(b.createdAt),
  largest: (a, b) => (b.additions + b.deletions) - (a.additions + a.deletions),
  smallest: (a, b) => (a.additions + a.deletions) - (b.additions + b.deletions),
  number: (a, b) => b.number - a.number,
};

function tokens() {
  return view.q.toLowerCase().split(/\s+/).map((t) => t.replace(/^#/, "")).filter(Boolean);
}

// Every word in the search box must appear somewhere in the PR.
function matchesSearch(p, toks) {
  if (!toks.length) return true;
  const hay = [p.repoKey, p.number, `#${p.number}`, p.author, p.title, p.branch, p.base, ...p.labels, ...(p.tickets || []),
    ...p.approvedBy, ...p.changesRequestedBy, ...p.reviewRequests].join(" ").toLowerCase();
  return toks.every((t) => hay.includes(t));
}

function highlight(text, toks) {
  if (!toks.length) return esc(text);
  const re = new RegExp(`(${toks.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
  return String(text).split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join("");
}

// ---------- Pills ----------
function checksPill(c) {
  if (c.state === "failing") return `<span class="pill bad" title="${esc(c.failing.join("\n"))}">${c.failed} check${c.failed > 1 ? "s" : ""} failing</span>`;
  if (c.state === "pending") return `<span class="pill run">${c.pending} check${c.pending > 1 ? "s" : ""} running</span>`;
  if (c.state === "passing") return `<span class="pill ok">Checks pass</span>`;
  return `<span class="pill">No checks</span>`;
}

function reviewPill(p) {
  if (p.isDraft) return `<span class="pill">Draft</span>`;
  if (p.changesRequestedBy.length) return `<span class="pill alert">Changes requested by ${esc(p.changesRequestedBy.join(", "))}</span>`;
  if (p.reviewDecision === "APPROVED") return `<span class="pill ok">Approved</span>`;
  const n = p.approvedBy.length;
  if (n) return `<span class="pill warn" title="Approved by ${esc(p.approvedBy.join(", "))}">${n} approval${n > 1 ? "s" : ""}, needs more</span>`;
  return `<span class="pill warn">Needs review</span>`;
}

function claudePill(p) {
  const s = isMine(p) ? fixState(p) : claudeState(p);
  return s ? `<span class="pill claude ${s.cls}" title="${isMine(p) ? "Claude fix" : "Claude review"}">${esc(s.label)}</span>` : "";
}

function isMine(p) {
  return Boolean(data && p.author === data.login);
}

function fixKey(p) {
  return `fix:${p.url}`;
}

function ticketLinks(p, toks = []) {
  return (p.tickets || []).map((k) =>
    `<a class="ticket" href="${JIRA}${encodeURIComponent(k)}" target="_blank" rel="noopener" title="Open ${esc(k)} in Jira">${ICON.ticket}${highlight(k, toks)}</a>`).join("");
}

function allPills(p, toks = []) {
  const conflict = p.mergeable === "CONFLICTING" ? `<span class="pill bad">Merge conflict</span>` : "";
  const labels = p.labels.map((l) => `<span class="tag">${highlight(l, toks)}</span>`).join("");
  const fresh = p.newCommits ? `<span class="pill alert" title="The author pushed after your last review">New commits since your review</span>` : "";
  return `${fresh}${claudePill(p)}${ticketLinks(p, toks)}${reviewPill(p)}${checksPill(p.checks)}${conflict}${labels}`;
}

// The Claude button that fits the PR's current review state.
function claudeButton(p, { big = false } = {}) {
  const r = reviews[p.url];
  const cls = big ? "btn primary" : "btn";
  if (r?.status === "running" || r?.status === "answering") return `<button class="btn" type="button" data-stop="${esc(p.url)}" title="Interrupt what Claude is doing">${ICON.stop}<span>Stop</span></button>`;
  if (r?.status === "queued") return `<button class="btn" type="button" data-stop="${esc(p.url)}" title="Take this review out of the queue">${ICON.stop}<span>Cancel</span></button>`;
  if ((r?.status === "ready" || r?.status === "waiting") && claudeState(p)?.id === "ready") return `<button class="btn primary" type="button" data-decide="${esc(prKey(p))}">${ICON.spark}<span>Decide</span></button>`;
  if (p.newCommits) return `<button class="btn primary" type="button" data-review="${esc(p.url)}" title="Review the new commits with Claude">${ICON.spark}<span>Re-review</span></button>`;
  return `<button class="${cls}" type="button" data-review="${esc(p.url)}">${ICON.spark}<span>${r ? "Review again" : "Review with Claude"}</span></button>`;
}

// ---------- List ----------
function renderPr(p, toks, showRepo) {
  const lines = p.additions + p.deletions;
  const others = view.tab === "review";
  const waitingOn = p.reviewRequests.filter((r) => !others || r !== data.login);
  const waiting = waitingOn.length ? `<span>${others ? "Also asked" : "Waiting on"}: ${highlight(waitingOn.join(", "), toks)}</span>` : "";
  const author = others ? `<span class="author">by <b>${highlight(p.author, toks)}</b> · opened ${ago(p.createdAt)}</span>` : "";
  const notRequested = others && !p.requested ? `<span>Review request cleared</span>` : "";
  return `<div class="pr${view.pr === prKey(p) ? " selected" : ""}" data-open="${esc(prKey(p))}">
    <span class="num">${others ? `<label class="pick" title="Select for batch review"><input type="checkbox" data-pick="${esc(p.url)}"${selected.has(p.url) ? " checked" : ""} aria-label="Select #${p.number}"></label>` : ""}${showRepo ? `<span class="rk">${esc(p.repoKey)}</span>` : ""}<span>#${highlight(p.number, toks)}</span></span>
    <div class="head">
      <a class="title" href="${esc(p.url)}" data-open="${esc(prKey(p))}">${highlight(p.title, toks)}</a>
      <div class="actions">
        ${others ? claudeButton(p) : `<button class="btn" type="button" data-fixopen="${esc(prKey(p))}" title="Ask Claude to fix checks, conflicts or review comments">${ICON.spark}<span>Fix with Claude</span></button>`}
        <button class="btn" type="button" data-copy="${esc(p.url)}" title="Copy ${esc(p.url)}">${ICON.copy}<span>Copy link</span></button>
        ${others && p.requested ? `<button class="btn" type="button" data-remove="${esc(p.url)}" title="Remove you from this PR's reviewers on GitHub">${ICON.userMinus}<span>Remove me</span></button>` : ""}
      </div>
    </div>
    <div class="meta">
      ${author}
      <span class="branch">${highlight(p.branch, toks)}</span>
      <span class="size" title="${p.changedFiles} files">${sizeLabel(lines)} <span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span></span>
      <span title="Opened ${esc(new Date(p.createdAt).toLocaleString())}">updated ${ago(p.updatedAt)}</span>
      ${waiting}${notRequested}
    </div>
    <div class="pills">${allPills(p, toks)}</div>
  </div>`;
}

function currentTab() {
  return TABS.find((t) => t.id === view.tab) || TABS[0];
}

function listFor(tabId) {
  return (data?.lists?.[tabId] || []).flatMap((r) => r.prs.map((p) => ({ ...p, repoKey: r.key })));
}

function repos() {
  return data?.lists?.[currentTab().id] || [];
}

function findPr(key) {
  return [...listFor("review"), ...listFor("mine")].find((p) => prKey(p) === key) || null;
}

function tabStatuses() {
  return STATUSES.filter((s) => !s.only || s.only === view.tab);
}

function renderControls(all, toks) {
  const tab = currentTab();
  $("tabs").innerHTML = TABS.map((t) => {
    const n = listFor(t.id).length;
    const href = urlFor({ ...view, tab: t.id, statuses: [], pr: null });
    return `<a href="${esc(href)}" data-tab="${t.id}"${t.id === tab.id ? ' aria-current="page"' : ""}>${t.label}<span class="n">${n}</span></a>`;
  }).join("");
  $("subheading").textContent = tab.sub;

  // Repo counts follow the search; status counts follow search + repo.
  const searched = all.filter((p) => matchesSearch(p, toks));
  const repoOpts = [["all", "All"], ...repos().map((r) => [r.key, r.key])];
  $("repo").innerHTML = repoOpts.map(([key, label]) => {
    const n = key === "all" ? searched.length : searched.filter((p) => p.repoKey === key).length;
    return `<button type="button" data-repo="${esc(key)}" aria-pressed="${view.repo === key}">${esc(label)}<span class="n">${n}</span></button>`;
  }).join("");

  const scoped = searched.filter((p) => view.repo === "all" || p.repoKey === view.repo);
  $("chips").innerHTML = tabStatuses().map((s) => {
    const n = scoped.filter(s.test).length;
    const on = view.statuses.includes(s.id);
    return `<button type="button" class="chip${n === 0 && !on ? " zero" : ""}" data-status="${s.id}" aria-pressed="${on}" style="--c: ${s.color}"><b>${n}</b>${s.label}</button>`;
  }).join("");

  $("sort").value = view.sort;
  $("sort")._ddSync?.();
  $("grouped").setAttribute("aria-pressed", String(view.group));
  $("flat").setAttribute("aria-pressed", String(!view.group));
  $("clearq").hidden = !view.q;
  $("hint").hidden = !!view.q;
  $("reset").hidden = !(view.q || view.repo !== "all" || view.statuses.length);
}

function renderList() {
  if (!data) return;
  $("who").textContent = `@${data.login}`;
  const all = listFor(view.tab);
  const toks = tokens();
  renderControls(all, toks);

  const active = tabStatuses().filter((s) => view.statuses.includes(s.id));
  const shown = all
    .filter((p) => view.repo === "all" || p.repoKey === view.repo)
    .filter((p) => matchesSearch(p, toks))
    .filter((p) => !active.length || active.some((s) => s.test(p)))
    .sort(SORTS[view.sort] || SORTS.attention);

  lastShown = shown.map((p) => p.url);
  renderSelbar();
  $("showing").textContent = shown.length === all.length ? `${all.length} open PRs` : `Showing ${shown.length} of ${all.length} open PRs`;

  if (!shown.length) {
    $("repos").innerHTML = all.length
      ? `<div class="list"><div class="empty">No PRs match. <button class="linkbtn" type="button" data-reset>Clear filters</button></div></div>`
      : `<div class="list"><div class="empty">${esc(currentTab().empty)}</div></div>`;
    return;
  }

  if (!view.group) {
    $("repos").innerHTML = `<div class="list">${shown.map((p) => renderPr(p, toks, true)).join("")}</div>`;
    return;
  }

  const visible = repos().filter((r) => view.repo === "all" || r.key === view.repo);
  $("repos").innerHTML = visible.map((r) => {
    const prs = shown.filter((p) => p.repoKey === r.key);
    const total = all.filter((p) => p.repoKey === r.key).length;
    const listUrl = `https://github.com/${r.repo}/pulls?q=${encodeURIComponent(currentTab().ghQuery(data.login))}`;
    const body = prs.length ? prs.map((p) => renderPr(p, toks, false)).join("") : `<div class="empty">No matching PRs in ${esc(r.key)}.</div>`;
    return `<section>
      <h2><a href="${esc(listUrl)}" target="_blank" rel="noopener">${esc(r.key)}</a><span class="repo">${esc(REPO_LABEL[r.key] || r.repo)}</span><span class="count">${prs.length} of ${total}</span></h2>
      <div class="list">${body}</div>
    </section>`;
  }).join("");
}

// ---------- Details panel ----------
async function loadDetails(key, force = false) {
  const cur = details.get(key);
  if (cur && !force && (cur.loading || cur.data)) return;
  details.set(key, { loading: true, data: cur?.data || null });
  renderPanel();
  const [repo, number] = key.split("-");
  try {
    const res = await fetch(`/api/pr?repo=${repo}&number=${number}`, { cache: "no-store" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `The server answered ${res.status}.`);
    details.set(key, { loading: false, data: body });
  } catch (e) {
    details.set(key, { loading: false, data: cur?.data || null, error: e.message });
  }
  renderPanel();
}

const PANEL_TABS = ["conversation", "commits", "checks", "files", "claude"];
const CHEVRON = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
const REVIEW_LABEL = {
  APPROVED: ["ok", "approved these changes"],
  CHANGES_REQUESTED: ["alert", "requested changes"],
  COMMENTED: ["", "reviewed"],
  DISMISSED: ["", "review dismissed"],
};

function loadingBlock(det) {
  return det?.error ? `<p class="none">Couldn't load this part. ${esc(det.error)}</p>` : `<p class="loading">Loading from GitHub…</p>`;
}

// Unified diff to table rows. Hunk headers reset the line counters; `numbers: false` hides the number columns.
function renderPatch(patch, { numbers = true } = {}) {
  let oldN = 0, newN = 0;
  const row = (cls, a, b, sign, text) => `<tr${cls ? ` class="${cls}"` : ""}>${numbers ? `<td class="ln">${a}</td><td class="ln">${b}</td>` : ""}<td class="code"><span class="sign">${sign}</span>${esc(text)}</td></tr>`;
  return String(patch).split("\n").map((line) => {
    if (line.startsWith("@@")) {
      const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(line);
      if (m) { oldN = Number(m[1]); newN = Number(m[2]); }
      return `<tr class="hunk">${numbers ? `<td class="ln"></td><td class="ln"></td>` : ""}<td class="code">${esc(line)}</td></tr>`;
    }
    if (line.startsWith("\\")) return row("", "", "", "", line);
    if (line[0] === "+") return row("add", "", newN++, "+", line.slice(1));
    if (line[0] === "-") return row("del", oldN++, "", "-", line.slice(1));
    return row("", oldN++, newN++, " ", line.slice(1));
  }).join("");
}

function sidebar(p, d) {
  const reviewer = (r) => {
    const [cls, text] = r.requested && r.state ? ["warn", "Re-requested"]
      : r.requested ? ["warn", "Waiting"]
      : r.state === "APPROVED" ? ["ok", "Approved"]
      : r.state === "CHANGES_REQUESTED" ? ["alert", "Changes requested"]
      : r.state === "DISMISSED" ? ["", "Dismissed"] : ["", "Commented"];
    return `<li><span class="who">${esc(r.login)}${r.team ? " (team)" : ""}</span><span class="pill ${cls}">${text}</span></li>`;
  };
  const decision = { APPROVED: "Approved to merge.", CHANGES_REQUESTED: "Changes were requested.", REVIEW_REQUIRED: "More approving reviews are required to merge." }[d.reviewDecision];
  const labels = d.labels.map((l) => `<span class="label" style="--lc: #${/^[0-9a-f]{6}$/i.test(l.color) ? l.color : "939EB1"}">${esc(l.name)}</span>`).join("");
  return `<aside class="side">
    <div><h3>Reviewers</h3>${d.reviewers.length ? `<ul class="people">${d.reviewers.map(reviewer).join("")}</ul>` : `<p class="none">No reviewers</p>`}${decision ? `<p class="none">${decision}</p>` : ""}</div>
    <div><h3>Assignees</h3><p class="none">${d.assignees.length ? esc(d.assignees.join(", ")) : "No one"}</p></div>
    <div><h3>Labels</h3>${labels || `<p class="none">None yet</p>`}</div>
    <div><h3>Milestone</h3>${d.milestone ? `<a href="${esc(d.milestone.url)}" target="_blank" rel="noopener">${esc(d.milestone.title)}</a>` : `<p class="none">No milestone</p>`}</div>
    <div><h3>Jira</h3>${d.tickets.length ? ticketLinks(d) : `<p class="none">No ticket found</p>`}</div>
  </aside>`;
}

function eventCard({ author, verb, pill = "", at, html, url, extra = "" }) {
  return `<div class="event">
    <div class="event-head"><b>${esc(author || "someone")}</b>${pill || `<span>${esc(verb)}</span>`}<span>${ago(at)}</span>
      <a href="${esc(url)}" target="_blank" rel="noopener" title="Open on GitHub">${ICON.external}</a></div>
    ${html ? `<div class="md">${safeHtml(html)}</div>` : ""}${extra}
  </div>`;
}

// Inline code comments: the first comment of a thread shows the code it points at; replies follow it.
function codeThreads(comments) {
  const roots = comments.filter((c) => !c.replyTo || !comments.some((x) => x.id === c.replyTo));
  return roots.map((root) => {
    const replies = comments.filter((c) => c.replyTo === root.id);
    const body = (c) => `<div class="cc-body"><div><b>${esc(c.author)}</b> <span class="cost">${ago(c.at)}</span></div><div class="md">${safeHtml(c.html)}</div></div>`;
    return `<div class="cc">
      <div class="cc-path">${esc(root.path)}${root.line ? `:${root.line}` : ""}${root.outdated ? ` <span class="pill">Outdated</span>` : ""}</div>
      ${root.hunk && !root.replyTo ? `<div class="diff-wrap"><table class="diff">${renderPatch(root.hunk, { numbers: false })}</table></div>` : ""}
      ${body(root)}${replies.map(body).join("")}
    </div>`;
  }).join("");
}

function panelConversation(p, d, det) {
  if (!d) return loadingBlock(det);
  const description = eventCard({
    author: d.author, verb: "opened this pull request", at: d.createdAt, url: d.url,
    html: d.bodyHtml || "<p><em>No description provided.</em></p>",
  });
  const items = d.timeline.map((t) => {
    if (t.kind === "comment") return eventCard({ author: t.author, verb: "commented", at: t.at, html: t.html, url: t.url });
    const [cls, text] = REVIEW_LABEL[t.state] || ["", t.state.toLowerCase()];
    const extra = t.codeComments.length ? `<div class="code-comments">${codeThreads(t.codeComments)}</div>` : "";
    return eventCard({ author: t.author, pill: `<span class="pill ${cls}">${text}</span>`, at: t.at, html: t.html, url: t.url, extra });
  }).join("");
  return `<div class="convo"><div class="thread">${description}${items}</div>${sidebar(p, d)}</div>`;
}

function panelCommits(d, det) {
  if (!d) return loadingBlock(det);
  const days = new Map();
  for (const c of d.commits) {
    const day = new Date(c.date).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    days.set(day, [...(days.get(day) || []), c]);
  }
  const more = d.commitCount > d.commits.length ? `<p class="cost">Showing ${d.commits.length} of ${d.commitCount} commits.</p>` : "";
  return [...days].map(([day, list]) => `<div><h3>Commits on ${esc(day)}</h3><ul class="rows">${list.map((c) => `<li>
      <span class="grow"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.message)}</a><span class="cost">${esc(c.author || "")} · ${ago(c.date)}</span></span>
      <code>${esc(c.sha)}</code></li>`).join("")}</ul></div>`).join("") + more;
}

function panelChecks(d, det) {
  if (!d) return loadingBlock(det);
  if (!d.checks.length) return `<p class="none">No checks ran on the latest commit.</p>`;
  const order = { failed: 0, pending: 1, passed: 2, skipped: 3 };
  const count = (o) => d.checks.filter((c) => c.outcome === o).length;
  const took = (c) => (c.startedAt && c.completedAt ? duration(new Date(c.completedAt) - new Date(c.startedAt)) : "");
  const summary = [["failed", "bad", "failed"], ["pending", "warn", "running"], ["passed", "ok", "passed"], ["skipped", "", "skipped or cancelled"]]
    .filter(([o]) => count(o)).map(([o, cls, text]) => `<span class="pill ${cls}">${count(o)} ${text}</span>`).join("");
  const rows = [...d.checks].sort((a, b) => order[a.outcome] - order[b.outcome] || a.name.localeCompare(b.name)).map((c) => `<li>
      <span class="check-dot ${c.outcome}" title="${esc(c.result || c.outcome)}"></span>
      <span class="grow"><span>${c.workflow ? `<span class="cost">${esc(c.workflow)} /</span> ` : ""}${esc(c.name)}</span>
        <span class="cost">${esc((c.result || c.outcome).toLowerCase())}${took(c) ? ` · ${took(c)}` : ""}${c.description ? ` · ${esc(c.description)}` : ""}</span></span>
      ${c.url ? `<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">Details</a>` : ""}</li>`).join("");
  return `<div class="check-sum">${summary}</div><ul class="rows">${rows}</ul>`;
}

// Which files are expanded, per PR. Small PRs open fully; big ones start collapsed.
const expanded = new Map();
function panelFiles(p, d, det) {
  if (!d) return loadingBlock(det);
  const key = prKey(p);
  if (!expanded.has(key)) {
    const lines = d.files.reduce((n, f) => n + (f.patch ? f.patch.split("\n").length : 0), 0);
    expanded.set(key, new Set(lines <= 1500 ? d.files.map((f) => f.name) : []));
  }
  const open = expanded.get(key);
  const more = d.changedFiles > d.files.length ? `<p class="cost">Showing the first ${d.files.length} of ${d.changedFiles} files. Open on GitHub for the rest.</p>` : "";
  const files = d.files.map((f) => {
    const isOpen = open.has(f.name);
    const body = !isOpen ? "" : f.patch
      ? `<div class="diff-wrap"><table class="diff">${renderPatch(f.patch)}</table></div>`
      : `<div class="diff-missing">GitHub doesn't include this file's changes (it's too large or binary). <a href="${esc(f.url)}" target="_blank" rel="noopener">See it on GitHub</a></div>`;
    return `<div class="file">
      <div class="file-head">
        <button class="file-toggle" type="button" data-file="${esc(f.name)}" aria-expanded="${isOpen}">
          ${CHEVRON}<span class="name">${f.previousName ? `${esc(f.previousName)} → ` : ""}${esc(f.name)}</span>
          <span class="st">${esc(f.status)}</span>
          <span class="size"><span class="add">+${f.additions}</span> <span class="del">−${f.deletions}</span></span>
        </button>
        <a href="${esc(f.url)}" target="_blank" rel="noopener" title="See this file on GitHub">${ICON.external}</a>
      </div>${body}
    </div>`;
  }).join("");
  return `<div class="files-bar"><span>${d.changedFiles} files · <span class="add">+${d.additions}</span> <span class="del">−${d.deletions}</span></span><span class="spacer"></span>
      <button class="btn" type="button" data-files-all="open">Expand all</button><button class="btn" type="button" data-files-all="close">Collapse all</button></div>
    ${files}${more}`;
}

function panelClaude(p) {
  const r = reviews[p.url];
  const s = claudeState(p);
  if (!r) {
    return `<div class="claude-box">
      <div class="note">Claude runs your <code>/review-pr</code> skill on this PR in a hidden session on your Mac, with Remote Control on so you can also follow it in the Claude phone app or on claude.ai. Nothing is posted until you choose what to do with the review.</div>
      <div class="row">${claudeButton(p, { big: true })}${modelPicker()}</div>
    </div>`;
  }
  // Where to continue the session by hand: phone/claude.ai while it's live, this Mac any time.
  const open = `
    ${r.alive && r.rcUrl ? `<a class="btn" href="${esc(r.rcUrl)}" target="_blank" rel="noopener">${ICON.external}<span>Open on phone or claude.ai</span></a>` : ""}
    <button class="btn" type="button" data-open-session="warp" data-key="${esc(p.url)}">${r.alive ? "Watch in Warp" : "Resume in Warp"}</button>
    ${r.alive ? `<button class="btn" type="button" data-end="${esc(p.url)}" title="Close the hidden session">End session</button>`
      : `<button class="btn" type="button" data-open-session="app" data-key="${esc(p.url)}">Resume in Claude app</button>`}`;
  const head = `<div class="row"><span class="pill claude ${s?.cls || ""}">${esc(s?.label || r.status)}</span>
    <span class="cost">Started ${ago(r.startedAt)} · ${esc(MODEL_NAMES[r.model || ""] || r.model)}${r.alive ? " · Remote Control on" : ""}</span></div>`;
  let body = "";
  if (r.status === "running" || r.status === "answering") {
    body = `<div class="progress"><span class="dot spin"></span><span>${esc(r.lastStep || "Working")}</span><span class="cost">${r.steps} step${r.steps === 1 ? "" : "s"}</span></div>
      <div class="row">${claudeButton(p)}${open}</div>`;
  } else if (r.status === "waiting") {
    body = `<div class="note">${esc(r.note || "Claude is waiting for your approval.")} Answer it on your phone, on claude.ai, or in Warp.</div><div class="row">${open}</div>`;
  } else if (r.status === "failed" || r.status === "stopped") {
    body = `<div class="note">${esc(r.error || "The review stopped before finishing.")}</div><div class="row">${claudeButton(p, { big: true })}${modelPicker()}</div><div class="row">${open}</div>`;
  } else {
    const decide = r.status === "ready" && r.alive && s?.id === "ready" ? `
      <h3>What should Claude do?</h3>
      <div class="answers">${ANSWERS.map((a) => `<button class="answer" type="button" data-answer="${a.id}" data-url="${esc(p.url)}" data-posts="${a.posts}">
        <b>${a.id}. ${esc(a.label)}</b><span>${esc(a.note)}</span></button>`).join("")}</div>` : "";
    body = `${decide}${decide ? "" : `<div class="row">${claudeButton(p)}${modelPicker()}</div>`}<div class="row">${open}</div>`;
  }
  const report = r.result && r.status !== "failed" ? `<div class="md">${markdown(r.result)}</div>` : "";
  // Sub-tabs under the status box: the report, the live terminal, and the step log.
  const sub = currentClaudeSub(r);
  const subs = [
    ["review", "Review"],
    ["live", r.alive ? `Live view <span class="live-dot" title="Session is running"></span>` : "Live view"],
    ["steps", `Steps <span class="n">${(r.log || []).length}</span>`],
  ];
  const subBody = sub === "live"
    ? (r.alive ? liveView(p.url, r) : `<p class="none">This review's session has ended, so there is nothing live to show. Resume it in Warp or the Claude app to keep going.</p>`)
    : sub === "steps" ? stepList(r)
    : (report || `<p class="none">${r.status === "failed" ? "There is no review to show." : "Claude's review will show here when it finishes. Watch it in Live view meanwhile."}</p>`);
  return `<div class="claude-box">${head}${body}</div>
    <div class="subtabs" role="tablist">${subs.map(([id, label]) =>
      `<button type="button" role="tab" data-csub="${id}" aria-selected="${sub === id}">${label}</button>`).join("")}</div>
    <div>${subBody}</div>`;
}

// Which Claude review sub-tab is open. Until you pick one: Live view while Claude works, Review once there is one.
let claudeSub = null;
function currentClaudeSub(r) {
  return claudeSub || (r?.result && !["running", "answering"].includes(r.status) ? "review" : r?.alive ? "live" : "review");
}

// ---------- Review logs ----------
// Live view: the hidden session's terminal screen, fetched while the Claude tab is open.
const screens = new Map(); // session key -> { text, at }

function liveView(key, r) {
  if (!r.alive) return "";
  const s = screens.get(key);
  if (!s || Date.now() - s.at > 2500) fetchScreen(key);
  return `<pre class="term" id="term" data-key="${esc(key)}">${s ? esc(s.text) : "Loading…"}</pre>`;
}

let screenBusy = false;
async function fetchScreen(key) {
  if (screenBusy) return;
  screenBusy = true;
  try {
    const res = await fetch(`/api/review/screen?key=${encodeURIComponent(key)}`, { cache: "no-store" });
    const body = await res.json();
    if (res.ok) {
      const before = screens.get(key)?.text;
      screens.set(key, { text: body.text || "", at: Date.now() });
      const term = $("term");
      if (term && term.dataset.key === key && before !== body.text) {
        const atBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 20;
        term.textContent = body.text || "";
        if (atBottom || before === undefined) term.scrollTop = term.scrollHeight;
      }
    }
  } catch {}
  screenBusy = false;
}

// Steps: everything the session did, newest last.
function stepList(r) {
  const log = r.log || [];
  if (!log.length) return `<p class="none">No steps recorded yet.</p>`;
  const time = (at) => new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  return `<ol class="steps">${log.map((l) => `<li class="${esc(l.kind)}"><span class="t">${time(l.at)}</span><span>${esc(l.text)}</span></li>`).join("")}</ol>`;
}

// While Live view is showing, keep fetching the session's screen.
setInterval(() => {
  const p = view.pr && findPr(view.pr);
  const key = p && (isMine(p) ? fixKey(p) : p.url);
  const r = key && reviews[key];
  if (view.panel === "claude" && r?.alive && $("term")?.dataset.key === key && document.visibilityState === "visible") fetchScreen(key);
}, 3000);

// A PR that isn't in either list (say, you were removed as reviewer) is built from its details instead.
function prFromDetails(key, d) {
  const outcome = (o) => d.checks.filter((c) => c.outcome === o);
  const failed = outcome("failed"), pending = outcome("pending");
  return {
    repoKey: key.split("-")[0], number: d.number, title: d.title, url: d.url, author: d.author,
    branch: d.head, base: d.base, isDraft: d.draft, createdAt: d.createdAt, updatedAt: d.updatedAt,
    additions: d.additions, deletions: d.deletions, changedFiles: d.changedFiles,
    labels: d.labels.map((l) => l.name), tickets: d.tickets, reviewDecision: d.reviewDecision,
    approvedBy: d.reviewers.filter((r) => r.state === "APPROVED").map((r) => r.login),
    changesRequestedBy: d.reviewers.filter((r) => r.state === "CHANGES_REQUESTED").map((r) => r.login),
    reviewRequests: d.reviewers.filter((r) => r.requested).map((r) => r.login),
    mergeable: d.mergeableState === "dirty" ? "CONFLICTING" : null, myReview: null, requested: false,
    checks: {
      total: d.checks.length, failed: failed.length, pending: pending.length,
      passed: d.checks.length - failed.length - pending.length, failing: failed.map((c) => c.name),
      state: !d.checks.length ? "none" : failed.length ? "failing" : pending.length ? "pending" : "passing",
    },
  };
}

  }[view.panel]();
  // Keep the reading position when the panel re-renders for a status update.

        <span class="id">${esc(p.repoKey.toUpperCase())} #${p.number}</span>
        <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${ICON.external}<span>Open on GitHub</span></a>
        <button class="btn" type="button" data-copy="${esc(p.url)}">${ICON.copy}<span>Copy link</span></button>
        <span class="spacer"></span>
        <button class="close" type="button" data-close aria-label="Close details" title="Close (Esc)">×</button>
      </div>
      <h2>${esc(p.title)} <span class="n">#${p.number}</span></h2>
      <div class="state-line">

        <span><b>${esc(p.author)}</b> wants to merge ${commits ? `${commits} commit${commits === 1 ? "" : "s"}` : "into"}${commits ? " into" : ""}</span>
        <code class="ref">${esc(p.base)}</code><span>from</span><code class="ref">${esc(p.branch)}</code>
      </div>
      <div class="pills">${allPills(p)}</div>
      ${det?.error ? `<div class="banner">Couldn't load all details. ${esc(det.error)}</div>` : ""}
      <div class="ptabs" role="tablist">${tabs.map(([id, label, n]) =>
        `<button type="button" role="tab" data-ptab="${id}" aria-selected="${view.panel === id}">${label}${n !== "" && n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("")}
        <span class="diffstat"><span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span></span></div>
    </div>
    <div class="panel-body">${content}</div>`;
  panel.dataset.shown = `${key}:${view.panel}`;
