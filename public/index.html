// ---------- Loading and polling ----------
// The last good list is kept in this browser so the page can show it at once on the next visit.
const CACHE_KEY = "open-prs:last";
let fromCache = false;

function saveCache(body) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(body)); } catch {}
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch { return null; }
}

function renderUpdated() {
  $("loadbar").hidden = !loading;
  if (!data) { $("updated").textContent = loading ? "Loading your PRs from GitHub…" : ""; return; }
  const time = new Date(data.fetchedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const when = fromCache ? `Saved list from ${time}` : `Updated ${ago(data.fetchedAt)} · ${time}`;
  $("updated").innerHTML = loading ? `${esc(when)} · <span class="stale">refreshing…</span>` : esc(when);
}

async function load() {
  if (loading) return;
  loading = true;
  $("refresh").classList.add("spinning");
  renderUpdated();
  try {
    let res;
    try {
      res = await fetch("/api/prs", { cache: "no-store" });
    } catch {
      throw new Error("Can't reach the local server. Start it with <code>./prs start</code> in the pure-tech-lead-cmd-center folder.");
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(esc(body.error || `The server answered ${res.status}.`));
    data = body;
    reviews = body.reviews || {};
    fromCache = false;
    saveCache(body);
    notifyListChanges();
    $("error").hidden = true;
    if (view.pr) loadDetails(view.pr, true);
  } catch (e) {
    $("error").innerHTML = `Couldn't refresh. ${e.message}${data ? " Showing the last list." : ""}`;
    $("error").hidden = false;
    if (!data) $("repos").innerHTML = `<div class="list"><div class="empty">Nothing to show yet. Fix the problem above, then press refresh.</div></div>`;
  } finally {
    loading = false;
    $("refresh").classList.remove("spinning");
    if (data) render();
    renderUpdated();
    schedulePoll();
  }
}

// Ask the local server about review sessions (no GitHub calls): every 3s while one is working, every
// 15s while one sits open (you might answer it from your phone). When one finishes a turn, reload
// everything so GitHub's verdict shows up.
const BUSY = ["running", "answering", "waiting"];
let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  const all = Object.values(reviews);
  if (all.some((r) => BUSY.includes(r.status))) pollTimer = setTimeout(poll, 3000);
  else if (all.some((r) => r.alive || r.status === "queued")) pollTimer = setTimeout(poll, 15000);
}

async function poll() {
  try {
    const res = await fetch("/api/reviews", { cache: "no-store" });
    const body = await res.json();
    const before = reviews;
    reviews = body.reviews || {};
    notifyReviewChanges(before, reviews);
    const changed = Object.entries(reviews).some(([url, r]) => before[url]?.status !== r.status);
    const finished = Object.entries(reviews).some(([url, r]) => BUSY.includes(before[url]?.status) && !BUSY.includes(r.status));
    if (finished) { fixDiffs.clear(); return load(); }
    if (changed || Object.values(reviews).some((r) => BUSY.includes(r.status))) render();
  } catch {}
  schedulePoll();
}

async function post(path, payload) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `The server answered ${res.status}.`);
  if (body.reviews) reviews = body.reviews;
  return body;
}

function showError(text) {
  $("error").textContent = text;
  $("error").hidden = false;
}

// ---------- Actions ----------
// The model picker in the header; remembered in this browser.
const MODEL_KEY = "open-prs:model";
const MODEL_NAMES = { "": "Default model", opus: "Opus 5.5", sonnet: "Sonnet 5.5", haiku: "Haiku 5.5", fable: "Fable 5.1" };
try { $("model").value = localStorage.getItem(MODEL_KEY) || ""; } catch {}
$("model").addEventListener("change", (e) => { try { localStorage.setItem(MODEL_KEY, e.target.value); } catch {} renderPanel(); });

// Per-PR model picker in the panel. It starts on the global "Claude model" choice (shown as
// "default"); a pick here applies only to this PR and resets when another PR is opened.
let panelModel = null;

function panelModelValue() {
  return panelModel ?? $("model").value;
}

function modelPicker() {
  const global = $("model").value;
  const options = Object.entries(MODEL_NAMES).map(([value, name]) =>
    `<option value="${esc(value)}"${value === panelModelValue() ? " selected" : ""}>${esc(value === "" ? "Claude's default" : name)}${value === global ? " (your default)" : ""}</option>`).join("");
  return `<label class="sort local-model" title="Model for this PR only. Your default comes from Claude model at the top.">Model <select id="localmodel">${options}</select></label>`;
}

document.addEventListener("change", (e) => {
  if (e.target.id === "localmodel") { panelModel = e.target.value; e.target.blur(); renderPanel(); }
});

async function startReview(button, url) {
  button.disabled = true;
  button.querySelector("span").textContent = "Starting…";
  try {
    await post("/api/review", { url, model: button.closest("#panel") ? panelModelValue() : $("model").value });
    $("error").hidden = true;
  } catch (e) {
    showError(`Couldn't start the review. ${e.message}`);
  }
  render();
  schedulePoll();
}

async function stopReview(button, key) {
  button.disabled = true;
  try { await post("/api/review/stop", { key }); } catch (e) { showError(`Couldn't stop the review. ${e.message}`); }
  setTimeout(poll, 800);
}

async function endSession(button, key) {
  button.disabled = true;
  try { await post("/api/review/end", { key }); } catch (e) { showError(`Couldn't end the session. ${e.message}`); }
  render();
  schedulePoll();
}

// Posting answers need a second click within 4 seconds; "Do nothing" goes straight through.
async function answer(button) {
  const posts = button.dataset.posts === "true";
  if (posts && !button.classList.contains("confirm")) {
    button.classList.add("confirm");
    button.querySelector("span").textContent = "Click again to post this to GitHub";
    setTimeout(() => { if (button.isConnected && !button.disabled) renderPanel(); }, 4000);
    return;
  }
  button.disabled = true;
  try {
    await post("/api/review/answer", { url: button.dataset.url, answer: button.dataset.answer });
    $("error").hidden = true;
  } catch (e) {
    showError(`Couldn't send your answer. ${e.message}`);
  }
  render();
  schedulePoll();
}

async function openSession(button) {
  try { await post("/api/review/open", { key: button.dataset.key, where: button.dataset.openSession }); }
  catch (e) { showError(`Couldn't open the session. ${e.message}`); }
}

async function copyLink(button) {
  const url = button.dataset.copy;
  try {
    await navigator.clipboard.writeText(url);
  } catch {
    // Older browsers: copy through a hidden text box.
    const box = Object.assign(document.createElement("textarea"), { value: url });
    document.body.append(box);
    box.select();
    document.execCommand("copy");
    box.remove();
  }
  const label = button.querySelector("span");
  button.classList.add("done");
  label.textContent = "Copied";
  setTimeout(() => { button.classList.remove("done"); label.textContent = "Copy link"; }, 1500);
}

// First click asks to confirm; a second click within 4 seconds removes you on GitHub.
async function removeMe(button) {
  const label = button.querySelector("span");
  if (!button.classList.contains("confirm")) {
    button.classList.add("confirm");
    label.textContent = "Click again to remove";
    setTimeout(() => {
      if (button.isConnected && !button.disabled) { button.classList.remove("confirm"); label.textContent = "Remove me"; }
    }, 4000);
    return;
  }
  button.disabled = true;
  label.textContent = "Removing…";
  const url = button.dataset.remove;
  try {
    await post("/api/remove-me", { url });
    for (const r of data.lists.review) r.prs = r.prs.filter((p) => p.url !== url);
    $("error").hidden = true;
    render();
  } catch (e) {
    showError(`Couldn't remove you from that PR. ${e.message}`);
    button.disabled = false;
    button.classList.remove("confirm");
    label.textContent = "Remove me";
  }
}

function toggleFile(name) {
  const open = expanded.get(view.pr);
  if (!open) return;
  if (open.has(name)) open.delete(name); else open.add(name);
  renderPanel();
}

function toggleAllFiles(show) {
  const d = details.get(view.pr)?.data;
  if (!d) return;
  expanded.set(view.pr, new Set(show ? d.files.map((f) => f.name) : []));
  renderPanel();
}

// ---------- Batch review ----------
const selected = new Set(); // PR links ticked on the Needs my review tab
let lastShown = [];

function renderSelbar() {
  const bar = $("selbar");
  if (view.tab !== "review" || !selected.size) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = `<span><b>${selected.size}</b> selected</span>
    <button class="btn primary" type="button" data-batch>${ICON.spark}<span>Review ${selected.size} with Claude</span></button>
    <button class="linkbtn" type="button" data-select-all>Select all shown</button>
    <button class="linkbtn" type="button" data-clear-sel>Clear</button>
    <span class="cost">${esc(MODEL_NAMES[$("model").value] || "Default model")} · at most 3 run at once, the rest wait in a queue</span>`;
}

$("selbar").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.hasAttribute("data-select-all")) { lastShown.forEach((u) => selected.add(u)); return renderList(); }
  if (b.hasAttribute("data-clear-sel")) { selected.clear(); return renderList(); }
  if (!b.hasAttribute("data-batch")) return;
  b.disabled = true;
  try {
    const out = await post("/api/review/batch", { urls: [...selected], model: $("model").value });
    selected.clear();
    $("error").hidden = true;
    if (out.skipped) showError(`${out.skipped} PR${out.skipped === 1 ? " was" : "s were"} skipped because a review is already running or queued for ${out.skipped === 1 ? "it" : "them"}.`);
  } catch (err) {
    showError(`Couldn't start the reviews. ${err.message}`);
  }
  render();
  schedulePoll();
});

// ---------- Fix with Claude (my PRs) ----------
const FIX_KINDS = { checks: "Fix failing checks", conflict: "Resolve merge conflict", comments: "Address review comments", custom: "Your request" };
const fixDiffs = new Map(); // fix key -> { loading, data, error }
let fixDraft = "";

function fixOptions(p) {
  const failing = p.checks.state === "failing";
  const conflict = p.mergeable === "CONFLICTING";
  const opts = [
    ["checks", FIX_KINDS.checks, failing ? `${p.checks.failed} failing: ${p.checks.failing.slice(0, 3).join(", ")}` : "No checks are failing", failing],
    ["conflict", FIX_KINDS.conflict, conflict ? `Merge ${p.base} into this branch` : "No conflict right now", conflict],
    ["comments", FIX_KINDS.comments, p.changesRequestedBy.length ? `Changes requested by ${p.changesRequestedBy.join(", ")}` : "Work through reviewers' comments", true],
  ];
  return `<div class="row">${modelPicker()}</div>
    <div class="answers">${opts.map(([kind, label, note, on]) =>
      `<button class="answer" type="button" data-fix="${kind}" data-url="${esc(p.url)}"${on ? "" : " disabled"}><b>${esc(label)}</b><span>${esc(note)}</span></button>`).join("")}</div>
    <div class="custom-fix">
      <textarea id="fixreq" placeholder="Or describe something else, e.g. rename the helper and update its tests">${esc(fixDraft)}</textarea>
      <div class="row"><button class="btn primary" type="button" data-fix="custom" data-url="${esc(p.url)}">${ICON.spark}<span>Ask Claude</span></button></div>
    </div>`;
}

function panelFix(p) {
  const key = fixKey(p);
  const f = reviews[key];
  if (!f) {
    return `<div class="claude-box">
      <div class="note">Claude works on this PR in its own copy of the repo (a git worktree), so your checkout isn't touched. It commits there but can't push: you check the changes here and press Push.</div>
      <h3>What should Claude fix?</h3>
      ${fixOptions(p)}
    </div>`;
  }
  const s = fixState(p);
  const busy = BUSY.includes(f.status);
  const open = `
    ${f.alive && f.rcUrl ? `<a class="btn" href="${esc(f.rcUrl)}" target="_blank" rel="noopener">${ICON.external}<span>Open on phone or claude.ai</span></a>` : ""}
    <button class="btn" type="button" data-open-session="warp" data-key="${esc(key)}">${f.alive ? "Watch in Warp" : "Resume in Warp"}</button>
    ${f.alive ? `<button class="btn" type="button" data-end="${esc(key)}" title="Close the hidden session">End session</button>`
      : `<button class="btn" type="button" data-open-session="app" data-key="${esc(key)}">Resume in Claude app</button>`}
    ${busy ? `<button class="btn" type="button" data-stop="${esc(key)}" title="Interrupt what Claude is doing">${ICON.stop}<span>Stop</span></button>` : ""}`;
  const head = `<div class="row"><span class="pill claude ${s?.cls || ""}">${esc(s?.label || f.status)}</span>
    <span class="cost">${esc(FIX_KINDS[f.kind] || "Fix")} · started ${ago(f.startedAt)} · ${esc(MODEL_NAMES[f.model || ""] || f.model)}${f.pushedAt ? ` · pushed ${ago(f.pushedAt)}` : ""}</span></div>`;
  const progress = busy
    ? `<div class="progress"><span class="dot spin"></span><span>${esc(f.status === "waiting" ? f.note || "Waiting for your approval" : f.lastStep || "Working")}</span><span class="cost">${f.steps} step${f.steps === 1 ? "" : "s"}</span></div>`
    : f.error && f.status === "failed" ? `<div class="note">${esc(f.error)}</div>` : "";
  const sub = claudeSub || (busy ? "live" : f.status === "ready" ? "changes" : "summary");
  const subs = [
    ["summary", "Summary"],
    ["changes", "Changes"],
    ["live", f.alive ? `Live view <span class="live-dot"></span>` : "Live view"],
    ["steps", `Steps <span class="n">${(f.log || []).length}</span>`],
  ];
  const body = sub === "changes" ? fixChangesView(p, f)
    : sub === "live" ? (f.alive ? liveView(key, f) : `<p class="none">The session has ended, so there is nothing live to show.</p>`)
    : sub === "steps" ? stepList(f)
    : (f.result ? `<div class="md">${markdown(f.result)}</div>` : `<p class="none">Claude's summary will show here when it finishes.</p>`);
  const another = busy ? "" : `<details class="another"><summary>Ask Claude for another fix</summary>${fixOptions(p)}</details>`;
  return `<div class="claude-box">${head}${progress}<div class="row">${open}</div></div>
    <div class="subtabs" role="tablist">${subs.map(([id, label]) =>
      `<button type="button" role="tab" data-csub="${id}" aria-selected="${sub === id}">${label}</button>`).join("")}</div>
    <div>${body}</div>${another}`;
}

// The Changes sub-tab: commits Claude made in the worktree and what pushing would change.
function fixChangesView(p, f) {
  const key = fixKey(p);
  const c = fixDiffs.get(key);
  if (!c) { loadFixChanges(key, p.url); return `<p class="loading">Reading the worktree…</p>`; }
  if (c.loading && !c.data) return `<p class="loading">Reading the worktree…</p>`;
  if (c.error && !c.data) return `<p class="none">Couldn't read the worktree. ${esc(c.error)}</p>`;
  const d = c.data;
  const busy = BUSY.includes(f.status);
  const files = d.files.map((file) => `<details class="file" open>
      <summary class="file-head"><span class="file-toggle">${CHEVRON}<span class="name">${file.previousName ? `${esc(file.previousName)} → ` : ""}${esc(file.name)}</span>
        <span class="st">${esc(file.status)}</span><span class="size"><span class="add">+${file.additions}</span> <span class="del">−${file.deletions}</span></span></span></summary>
      ${file.patch ? `<div class="diff-wrap"><table class="diff">${renderPatch(file.patch)}</table></div>` : `<div class="diff-missing">Too large or binary to show here.</div>`}
    </details>`).join("");
  const commits = d.commits.length ? `<ul class="rows">${d.commits.map((cm) => `<li><span class="grow"><span>${esc(cm.message)}</span><span class="cost">${esc(cm.author)} · ${ago(cm.date)}</span></span><code>${esc(cm.sha)}</code></li>`).join("")}</ul>` : "";
  const warn = [
    d.behind ? `The PR branch has ${d.behind} new commit${d.behind === 1 ? "" : "s"} that aren't in this worktree, so a push would be refused. Ask Claude to merge them first.` : "",
    d.uncommitted ? `${d.uncommitted} changed file${d.uncommitted === 1 ? " is" : "s are"} not committed yet and won't be pushed.` : "",
  ].filter(Boolean).map((t) => `<div class="warnbox">${esc(t)}</div>`).join("");
  const canPush = d.ahead > 0 && !busy && !d.behind;
  return `<div class="fix-files">
    <div class="files-bar"><span><b>${d.ahead}</b> new commit${d.ahead === 1 ? "" : "s"} for <code class="ref">${esc(d.head)}</code> · ${d.files.length} file${d.files.length === 1 ? "" : "s"}</span><span class="spacer"></span>
      <button class="btn" type="button" data-discard="${esc(p.url)}" title="Close the session and delete the worktree">Discard</button>
      <button class="btn primary" type="button" data-push="${esc(p.url)}"${canPush ? "" : " disabled"} title="${canPush ? `Push to ${esc(d.head)} on GitHub` : busy ? "Wait for Claude to finish" : "Nothing to push"}">Push</button></div>
    ${warn}${commits}
    ${files || `<p class="none">${busy ? "No commits yet. Claude is still working." : "Claude didn't commit any changes."}</p>`}
    <p class="cost">Worktree: <code>${esc(d.worktree)}</code> · local branch <code>${esc(d.branch)}</code></p>
  </div>`;
}

async function loadFixChanges(key, url) {
  const prev = fixDiffs.get(key);
  fixDiffs.set(key, { loading: true, data: prev?.data || null });
  try {
    const res = await fetch(`/api/fix/changes?url=${encodeURIComponent(url)}`, { cache: "no-store" });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `The server answered ${res.status}.`);
    fixDiffs.set(key, { loading: false, data: body });
  } catch (e) {
    fixDiffs.set(key, { loading: false, data: prev?.data || null, error: e.message });
  }
  renderPanel();
}

async function startFix(button) {
  const kind = button.dataset.fix;
  const request = kind === "custom" ? ($("fixreq")?.value || "").trim() : "";
  if (kind === "custom" && !request) { $("fixreq")?.focus(); return; }
  button.disabled = true;
  const label = button.querySelector("b, span");
  if (label) label.textContent = "Starting… (making the worktree can take a minute)";
  try {
    await post("/api/fix", { url: button.dataset.url, kind, request, model: panelModelValue() });
    fixDraft = "";
    claudeSub = null;
    fixDiffs.delete(`fix:${button.dataset.url}`);
    $("error").hidden = true;
  } catch (e) {
    showError(`Couldn't start the fix. ${e.message}`);
  }
  if (document.activeElement?.id === "fixreq") document.activeElement.blur();
  render();
  schedulePoll();
}

// Push and Discard both need a second click within 4 seconds.
function confirmFirst(button, text) {
  if (button.classList.contains("confirm")) return true;
  button.classList.add("confirm");
  button.dataset.label = button.textContent;
  button.textContent = text;
  setTimeout(() => { if (button.isConnected && !button.disabled) { button.classList.remove("confirm"); button.textContent = button.dataset.label; } }, 4000);
  return false;
}

async function pushFix(button) {
  const head = fixDiffs.get(`fix:${button.dataset.push}`)?.data?.head || "the PR branch";
  if (!confirmFirst(button, `Click again to push to ${head}`)) return;
  button.disabled = true;
  button.textContent = "Pushing…";
  try {
    await post("/api/fix/push", { url: button.dataset.push });
    fixDiffs.delete(`fix:${button.dataset.push}`);
    $("error").hidden = true;
    load();
  } catch (e) {
    showError(`Couldn't push. ${e.message}`);
    render();
  }
}

async function discardFix(button) {
  if (!confirmFirst(button, "Click again to delete the worktree (unpushed commits are lost)")) return;
  button.disabled = true;
  try {
    await post("/api/fix/discard", { url: button.dataset.discard });
    fixDiffs.delete(`fix:${button.dataset.discard}`);
    claudeSub = null;
    $("error").hidden = true;
  } catch (e) {
    showError(`Couldn't discard. ${e.message}`);
  }
  render();
}

document.addEventListener("input", (e) => { if (e.target.id === "fixreq") fixDraft = e.target.value; });
document.addEventListener("focusout", (e) => { if (e.target.id === "fixreq") setTimeout(renderPanel, 0); });

function openPanel(key, panel) {
  if (key !== view.pr) { claudeSub = null; panelModel = null; }
  update({ pr: key, panel: panel || (view.pr === key ? view.panel : "conversation") }, { push: view.pr !== key });
}

function closePanel() {
  update({ pr: null, panel: "conversation" }, { push: true });
}

// One click handler for the list and the panel.
function onClick(e) {
  const t = e.target;
  const pick = (sel) => t.closest(sel);
  let b;
  if (pick("[data-reset]")) return resetFilters();
  if ((b = pick("[data-pick]"))) { if (b.checked) selected.add(b.dataset.pick); else selected.delete(b.dataset.pick); return renderSelbar(); }
  if (pick(".pick")) return; // the checkbox's label
  if ((b = pick("[data-fixopen]"))) return openPanel(b.dataset.fixopen, "claude");
  if ((b = pick("[data-fix]"))) return startFix(b);
  if ((b = pick("[data-push]"))) return pushFix(b);
  if ((b = pick("[data-discard]"))) return discardFix(b);
  if ((b = pick("[data-copy]"))) return copyLink(b);
  if ((b = pick("[data-remove]"))) return removeMe(b);
  if ((b = pick("[data-review]"))) return startReview(b, b.dataset.review);
  if ((b = pick("[data-stop]"))) return stopReview(b, b.dataset.stop);
  if ((b = pick("[data-end]"))) return endSession(b, b.dataset.end);
  if ((b = pick("[data-decide]"))) return openPanel(b.dataset.decide, "claude");
  if ((b = pick("[data-answer]"))) return answer(b);
  if ((b = pick("[data-open-session]"))) return openSession(b);
  if (pick("[data-close]")) return closePanel();
  if ((b = pick("[data-ptab]"))) return update({ panel: b.dataset.ptab });
  if ((b = pick("[data-csub]"))) { claudeSub = b.dataset.csub; return renderPanel(); }
  if ((b = pick("[data-file]"))) return toggleFile(b.dataset.file);
  if ((b = pick("[data-files-all]"))) return toggleAllFiles(b.dataset.filesAll === "open");
  // Links (Jira, GitHub, files) keep their normal behavior; the title opens the panel unless a modifier is held.
  const link = pick("a");
  if (link && !link.dataset.open) return;
  if ((b = pick("[data-open]"))) {
    if (link && (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1)) return;
    e.preventDefault();
    openPanel(b.dataset.open);
  }
}

function resetFilters() {
  $("q").value = "";
  update({ q: "", repo: "all", statuses: [] });
}

$("repos").addEventListener("click", onClick);
$("panel").addEventListener("click", onClick);
$("refresh").addEventListener("click", load);
$("tabs").addEventListener("click", (e) => {

});

$("flat").addEventListener("click", () => update({ group: false }));

document.addEventListener("keydown", (e) => {

});
// Coming back to the tab after a while refreshes the list.

});

// ---------- Notifications ----------
// Mac notifications from this page (it must stay open in a tab; a pinned tab works well).
// Clicking one opens that PR. Turned on with the bell button, which asks the browser once.
const NOTIFY_KEY = "open-prs:notify";
const SEEN_KEY = "open-prs:seen";

function notifyOn() {
  let off = false;
  try { off = localStorage.getItem(NOTIFY_KEY) === "off"; } catch {}
  return "Notification" in window && Notification.permission === "granted" && !off;
}

function renderBell() {
  const bell = $("bell");
  if (!("Notification" in window)) { bell.hidden = true; return; }
  bell.hidden = false;
  const state = Notification.permission === "denied" ? "blocked" : notifyOn() ? "on" : "off";
  bell.dataset.state = state;
  bell.innerHTML = `${ICON.bell}<span>${{ on: "Notifications on", off: "Turn on notifications", blocked: "Notifications blocked" }[state]}</span>`;
  bell.title = state === "blocked" ? "Notifications blocked. Your browser blocks them for this page; allow them in the site settings (the icon left of the address)."
    : state === "on" ? "Notifications on. Click to turn them off."
    : "Notifications off. Click to get a Mac notification when a review is ready, needs approval, or a new review request arrives.";
  bell.setAttribute("aria-label", bell.title);
}

$("bell").addEventListener("click", async () => {
  if (Notification.permission === "default") await Notification.requestPermission();
  else if (Notification.permission === "granted") {
    try { localStorage.setItem(NOTIFY_KEY, notifyOn() ? "off" : "on"); } catch {}
  }
  renderBell();
  if (notifyOn()) notify("Notifications are on", "You'll hear about finished reviews and new review requests.", null);
});

function keyFromUrl(url) {
  const m = /github\.com\/purepm\/(frontend|backend)-monorepo\/pull\/(\d+)/.exec(url);
  return m ? `${m[1] === "frontend" ? "fm" : "bm"}-${m[2]}` : null;
}

function notify(title, body, key, panel = "conversation") {
  if (!notifyOn()) return;
  const n = new Notification(title, { body, tag: key ? `${key}:${title}` : title });
  n.onclick = () => {
    window.focus();
    if (key) { if (view.tab !== "review" && !findPr(key)) update({ tab: "review" }, { push: true }); openPanel(key, panel); }
    n.close();
  };
}

// Review sessions: tell when one finishes, needs approval, fails, or finishes your answer.
function notifyReviewChanges(before, after) {
  for (const [url, r] of Object.entries(after)) {
    const was = before[url]?.status;
    if (!was || was === r.status) continue;
    const key = keyFromUrl(url);
    const pr = key && findPr(key);
    const name = `${(key || "").replace("-", " #").toUpperCase()}${pr ? ` · ${pr.title}` : ""}`;
    if (url.startsWith("fix:")) {
      if (r.status === "ready") notify("Fix ready: check and push", `${name}\nClaude committed changes in its worktree.`, key, "claude");
      else if (r.status === "waiting") notify("Claude needs your approval", `${name}\n${r.note || ""}`, key, "claude");
      else if (r.status === "failed") notify("Fix failed", `${name}\n${r.error || ""}`, key, "claude");
      continue;
    }
    if (r.status === "ready") notify("Review ready: your call", `${name}\nChoose A, B, C or D.`, key, "claude");
    else if (r.status === "waiting") notify("Claude needs your approval", `${name}\n${r.note || ""}`, key, "claude");
    else if (r.status === "failed") notify("Review failed", `${name}\n${r.error || ""}`, key, "claude");
    else if (r.status === "answered") notify("Claude finished your answer", `${name}\nAnswer ${r.answer || ""} is done.`, key, "claude");
  }
}

// The list: new review requests, and PRs that got new commits since your review.
// The first load only records what exists, so you aren't flooded.
function notifyListChanges() {
  const review = listFor("review");
  const now = { requests: review.filter((p) => p.requested).map((p) => p.url), commits: review.filter((p) => p.newCommits).map((p) => `${p.url}@${p.updatedAt}`) };
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch {}
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(now)); } catch {}
  if (!seen) return;
  const fresh = review.filter((p) => p.requested && !seen.requests.includes(p.url));
  for (const p of fresh.slice(0, 3)) notify("New review request", `${prKey(p).replace("-", " #").toUpperCase()} · ${p.title}\nby ${p.author}`, prKey(p));
  if (fresh.length > 3) notify(`${fresh.length - 3} more review requests`, "Open the page to see them.", null);
  const commitUrls = new Set(seen.commits.map((c) => c.split("@")[0]));
  for (const p of review.filter((x) => x.newCommits && !commitUrls.has(x.url)).slice(0, 3)) {
    notify("New commits since your review", `${prKey(p).replace("-", " #").toUpperCase()} · ${p.title}`, prKey(p), "commits");
  }
}

// ---------- Dropdowns ----------
// The native <select> menu is drawn by macOS and ignores the page's look, so each select gets a button
// and a menu in the design system's style. The select stays the source of truth: choosing an item sets
// its value and fires "change", so every existing handler keeps working.
var ddMenu = null, ddBtn = null, ddSel = null, ddOpenedAt = 0;

function ddIcon(kind) {
  return kind === "check"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;
}

function enhanceSelect(sel) {
  if (!sel || sel.dataset.dd) return;
  sel.dataset.dd = "1";
  sel.classList.add("dd-native");
  sel.tabIndex = -1;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "dd-btn";
  btn.id = `${sel.id}-dd`;
  btn.setAttribute("aria-haspopup", "listbox");
  btn.setAttribute("aria-expanded", "false");
  sel.after(btn);
  sel._ddSync = () => { btn.innerHTML = `<span>${esc(sel.selectedOptions[0]?.textContent || "")}</span>${ddIcon("chevron")}`; };
  sel._ddSync();
  sel.addEventListener("change", sel._ddSync);
  btn.addEventListener("click", (e) => { e.stopPropagation(); if (ddSel === sel) closeDd(); else openDd(sel, btn); });
  btn.addEventListener("keydown", (e) => {
    if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) { e.preventDefault(); e.stopPropagation(); openDd(sel, btn); }
  });
}

function openDd(sel, btn) {
  closeDd();
  const menu = document.createElement("div");
  menu.className = "dd-menu";
  menu.setAttribute("role", "listbox");
  for (const o of sel.options) {
    const item = document.createElement("div");
    item.className = "dd-item";
    item.setAttribute("role", "option");
    item.setAttribute("aria-selected", String(o.selected));
    item.tabIndex = -1;
    item.dataset.value = o.value;
    item.innerHTML = `<span class="dd-check">${o.selected ? ddIcon("check") : ""}</span><span>${esc(o.textContent)}</span>`;
    item.addEventListener("click", (e) => { e.stopPropagation(); chooseDd(o.value); });
    menu.append(item);
  }
  menu.addEventListener("keydown", (e) => {
    // The menu's keys stay with the menu: Escape here must not also close the PR panel.
    if (e.key !== "Tab") e.stopPropagation();
    const items = [...menu.querySelectorAll(".dd-item")];
    const at = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items.at(Math.min(at + 1, items.length - 1))?.focus({ preventScroll: true }); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items.at(Math.max(at - 1, 0))?.focus({ preventScroll: true }); }
    else if (e.key === "Home") { e.preventDefault(); items.at(0)?.focus({ preventScroll: true }); }
    else if (e.key === "End") { e.preventDefault(); items.at(-1)?.focus({ preventScroll: true }); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (at >= 0) chooseDd(items.at(at).dataset.value); }
    else if (e.key === "Escape") { e.preventDefault(); const b = ddBtn; closeDd(); b?.focus(); }
    else if (e.key === "Tab") closeDd();
  });
  document.body.append(menu);
  // Fixed position under the button (above it when there's no room), kept inside the window.
  const r = btn.getBoundingClientRect();
  menu.style.minWidth = `${Math.round(r.width)}px`;
  const below = innerHeight - r.bottom >= menu.offsetHeight + 8;
  menu.style.top = `${Math.round(below ? r.bottom + 4 : r.top - menu.offsetHeight - 4)}px`;
  menu.style.left = `${Math.round(Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)))}px`;
  ddMenu = menu; ddBtn = btn; ddSel = sel;
  btn.setAttribute("aria-expanded", "true");
  ddOpenedAt = Date.now();
  (menu.querySelector('[aria-selected="true"]') || menu.firstElementChild)?.focus({ preventScroll: true });
}

function chooseDd(value) {
  const sel = ddSel, btnId = ddBtn?.id;
  closeDd();
  if (!sel) return;
  if (sel.value !== value) { sel.value = value; sel.dispatchEvent(new Event("change", { bubbles: true })); }
  sel._ddSync?.();
  document.getElementById(btnId)?.focus(); // the button may have been redrawn by the change
}

function closeDd() {
  ddMenu?.remove();
  ddBtn?.setAttribute("aria-expanded", "false");
  ddMenu = ddBtn = ddSel = null;
}

document.addEventListener("click", (e) => { if (ddMenu && !ddMenu.contains(e.target)) closeDd(); });
window.addEventListener("resize", closeDd);
// Scrolling the page closes the menu, but not the small scroll some browsers make as it opens.
document.addEventListener("scroll", (e) => { if (ddMenu && !ddMenu.contains(e.target) && Date.now() - ddOpenedAt > 250) closeDd(); }, true);
enhanceSelect($("sort"));
enhanceSelect($("model"));
enhanceSelect($("localmodel"));
</script>
</body>
</html>
